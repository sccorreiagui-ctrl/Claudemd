<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 703 232" width="703" height="232" role="img" aria-label="Nave a 0,8c vista no referencial da nave e no referencial Terra–estrela"><title>Nave a 0,8c vista no referencial da nave e no referencial Terra–estrela</title><defs><marker id="nave-m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker><marker id="nave-m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8CA3"/></marker></defs><rect x="4.0" y="120.0" width="695.0" height="108.0" rx="6" fill="#fff" stroke="#C9D0DA" stroke-width="1"/><text x="14.0" y="138.0" font-size="11.5" fill="#086A7C" text-anchor="start" font-weight="700">Referencial TERRA–ESTRELA (S): Terra e estrela em repouso, nave a 0,8c</text><circle cx="62.0" cy="174.0" r="9" fill="#1769C9" stroke="#fff" stroke-width="1"/><text x="62.0" y="196.0" font-size="9.5" fill="#4A5568" text-anchor="middle" font-weight="700">Terra</text><circle cx="462.0" cy="174.0" r="9" fill="#1769C9" stroke="#fff" stroke-width="1"/><text x="462.0" y="196.0" font-size="9.5" fill="#4A5568" text-anchor="middle" font-weight="700">estrela</text><line x1="74.0" y1="174.0" x2="450.0" y2="174.0" stroke="#5B6573" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#nave-m1)" marker-start="url(#nave-m1)" stroke-linecap="butt"/><text x="262.0" y="166.0" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="600" stroke="#fff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">distância medida em S: 8 anos-luz</text><path d="M84.0,182.0 L132.0,182.0 L144.0,193.0 L132.0,204.0 L84.0,204.0 Z" fill="#E0F4F7" stroke="#0B8CA3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="148.0" y1="193.0" x2="182.0" y2="193.0" stroke="#0B8CA3" stroke-width="2" marker-end="url(#nave-m2)" stroke-linecap="butt"/><text x="185.0" y="197.0" font-size="9.5" fill="#086A7C" text-anchor="start" font-weight="700">v = 0,8c</text><text x="84.0" y="218.0" font-size="10" fill="#086A7C" text-anchor="start" font-weight="700">L = 60 m</text><text x="486.0" y="170.0" font-size="12" fill="#086A7C" text-anchor="start" font-weight="700">Δt = 10 anos</text><text x="486.0" y="184.0" font-size="9.5" fill="#4A5568" text-anchor="start" font-weight="400">(relógios da Terra e</text><text x="486.0" y="196.0" font-size="9.5" fill="#4A5568" text-anchor="start" font-weight="400">da estrela, sincronizados)</text><text x="486.0" y="213.0" font-size="9.5" fill="#1B2430" text-anchor="start" font-weight="400">nave contraída: L = L₀/γ</text><rect x="4.0" y="4.0" width="695.0" height="108.0" rx="6" fill="#fff" stroke="#C9D0DA" stroke-width="1"/><text x="14.0" y="22.0" font-size="11.5" fill="#086A7C" text-anchor="start" font-weight="700">Referencial da NAVE (S′): nave em repouso; Terra e estrela passam a 0,8c</text><path d="M262.0,50.0 L350.0,50.0 L362.0,61.0 L350.0,72.0 L262.0,72.0 Z" fill="#E0F4F7" stroke="#0B8CA3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="312.0" y="92.0" font-size="10" fill="#086A7C" text-anchor="middle" font-weight="700">L₀ = 100 m</text><text x="312.0" y="106.0" font-size="9.5" fill="#4A5568" text-anchor="middle" font-weight="400">(comprimento próprio)</text><circle cx="430.0" cy="61.0" r="9" fill="#1769C9" stroke="#fff" stroke-width="1"/><text x="430.0" y="85.0" font-size="9.5" fill="#4A5568" text-anchor="middle" font-weight="700">Terra</text><circle cx="670.0" cy="61.0" r="9" fill="#1769C9" stroke="#fff" stroke-width="1"/><text x="670.0" y="85.0" font-size="9.5" fill="#4A5568" text-anchor="middle" font-weight="700">estrela</text><line x1="442.0" y1="61.0" x2="658.0" y2="61.0" stroke="#5B6573" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#nave-m1)" marker-start="url(#nave-m1)" stroke-linecap="butt"/><text x="550.0" y="52.0" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="600" stroke="#fff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">distância medida em S′: 4,8 anos-luz</text><line x1="416.0" y1="40.0" x2="382.0" y2="40.0" stroke="#5B6573" stroke-width="1.6" marker-end="url(#nave-m1)" stroke-linecap="butt"/><text x="380.0" y="36.0" font-size="9" fill="#4A5568" text-anchor="end" font-weight="400">Terra e estrela se movem</text><text x="14.0" y="50.0" font-size="12" fill="#086A7C" text-anchor="start" font-weight="700">Δτ = 6 anos</text><text x="14.0" y="64.0" font-size="9.5" fill="#4A5568" text-anchor="start" font-weight="400">(tempo próprio: o relógio</text><text x="14.0" y="76.0" font-size="9.5" fill="#4A5568" text-anchor="start" font-weight="400">da nave está presente na</text><text x="14.0" y="88.0" font-size="9.5" fill="#4A5568" text-anchor="start" font-weight="400">partida e na chegada)</text><text x="690.0" y="100.0" font-size="8.5" fill="#4A5568" text-anchor="end" font-weight="400">escalas de comprimento: nave e distâncias independentes</text></svg>