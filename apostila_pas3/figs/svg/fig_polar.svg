<text x="380.00" y="256.00" font-size="8.4" fill="#5f6b7a" text-anchor="middle"><tspan>cos θ = a/ρ = 1/2  ·  sen θ = b/ρ = √3/2</tspan></text>
<text x="380.00" y="270.00" font-size="8.4" fill="#d4690a" text-anchor="middle" font-weight="700"><tspan>⇒ θ = 60° (1º quadrante)</tspan></text>
