<text x="270.00" y="204.00" font-size="14.5" fill="#1a2233" text-anchor="start"><tspan class="i">z</tspan><tspan class="m"> = </tspan><tspan class="m" fill="#167a44">2</tspan><tspan class="m">(</tspan><tspan class="m">cos </tspan><tspan class="m" fill="#d4690a">60°</tspan><tspan class="m"> + </tspan><tspan class="i">i</tspan><tspan class="m"> </tspan><tspan class="m">sen </tspan><tspan class="m" fill="#d4690a">60°</tspan><tspan class="m">)</tspan></text>
<text x="270.00" y="222.00" font-size="12" fill="#1a2233" text-anchor="start"><tspan class="i">z</tspan><tspan class="m"> = </tspan><tspan class="m" fill="#167a44">2</tspan><tspan class="m"> </tspan><tspan class="m">cis </tspan><tspan class="i" fill="#d4690a">π</tspan><tspan class="m" fill="#d4690a">/3</tspan></text>
<line x1="380.00" y1="92.00" x2="380.00" y2="95.20" stroke="#5f6b7a" stroke-width="1.0" stroke-linecap="round"/>
