<text x="270.00" y="76.00" font-size="17" fill="#1a2233" text-anchor="start"><tspan class="i">z</tspan><tspan class="m"> = </tspan><tspan class="m" fill="#1f5fbf">1</tspan><tspan class="m"> + </tspan><tspan class="m" fill="#7a3fc2">√3</tspan><tspan class="i" fill="#7a3fc2">i</tspan></text>
