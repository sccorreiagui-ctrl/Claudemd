<text x="270.00" y="114.00" font-size="8.6" fill="#5f6b7a" text-anchor="start" font-weight="700"><tspan>② Afixo no plano (ponto)</tspan></text>
<text x="270.00" y="140.00" font-size="17" fill="#1a2233" text-anchor="start"><tspan class="i">P</tspan><tspan class="m">(</tspan><tspan class="m" fill="#1f5fbf">1</tspan><tspan class="m">, </tspan><tspan class="m" fill="#7a3fc2">√3</tspan><tspan class="m">)</tspan></text>
<rect x="262.00" y="162.00" width="236.00" height="70.00" rx="4" fill="#fbe5cb" stroke="#d4690a" stroke-width="1.0"/>
