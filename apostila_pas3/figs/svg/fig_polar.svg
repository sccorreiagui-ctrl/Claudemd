<text x="102.50" y="267.00" font-size="9.6" fill="#1f5fbf" text-anchor="middle" font-weight="700"><tspan class="i">a</tspan><tspan class="m"> = </tspan><tspan class="i">ρ</tspan><tspan class="m"> </tspan><tspan class="m">cos </tspan><tspan class="i">θ</tspan><tspan class="m"> = 1</tspan></text>
<text x="163.00" y="159.07" font-size="9.6" fill="#7a3fc2" text-anchor="start" font-weight="700"><tspan class="i">b</tspan><tspan class="m"> = </tspan><tspan class="i">ρ</tspan><tspan class="m"> </tspan><tspan class="m">sen </tspan><tspan class="i">θ</tspan><tspan class="m"> = √3</tspan></text>
<text x="93.50" y="152.65" font-size="10" fill="#167a44" text-anchor="end" font-weight="700"><tspan class="i">ρ</tspan><tspan class="m"> = 2</tspan></text>
<text x="89.70" y="234.40" font-size="10.5" fill="#d4690a" text-anchor="start"><tspan class="i">θ</tspan></text>
<text x="44.00" y="71.13" font-size="8.6" fill="#7a3fc2" text-anchor="end"><tspan class="m">√3</tspan></text>
<text x="380.00" y="22.00" font-size="9.6" fill="#1a2233" text-anchor="middle" font-weight="700"><tspan>O MESMO número, três representações</tspan></text>
