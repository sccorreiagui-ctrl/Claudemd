<text x="140.00" y="216.00" font-size="9.2" fill="#d4690a" text-anchor="end" font-weight="700"><tspan class="i">z</tspan><tspan class="m" dy="1.84" font-size="6.62">3</tspan><tspan class="m" dy="-1.84"> = −1 − </tspan><tspan class="i">i</tspan></text>
