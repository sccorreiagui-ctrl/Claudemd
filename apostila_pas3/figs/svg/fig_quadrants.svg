<text x="5.60" y="20.76" font-size="8.0" fill="#5f6b7a" text-anchor="start"><tspan>cos−, sen+  ·  θ = π − θ₀</tspan></text>
<text x="5.60" y="259.36" font-size="8.6" fill="#1a2233" text-anchor="start" font-weight="700"><tspan>3º Q: a &lt; 0, b &lt; 0</tspan></text>
<text x="5.60" y="270.36" font-size="8.0" fill="#5f6b7a" text-anchor="start"><tspan>cos−, sen−  ·  θ = π + θ₀</tspan></text>
