<text x="390.40" y="9.76" font-size="8.6" fill="#1a2233" text-anchor="end" font-weight="700"><tspan>1º Q: a &gt; 0, b &gt; 0</tspan></text>
<text x="390.40" y="20.76" font-size="8.0" fill="#5f6b7a" text-anchor="end"><tspan>cos+, sen+  ·  θ = θ₀</tspan></text>
