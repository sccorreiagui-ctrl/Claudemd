<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 150" width="184.00mm" height="37.50mm">
<rect x="8.00" y="6.00" width="128.00" height="108.00" rx="5" fill="#e7dcf6" stroke="#5b2a9e" stroke-width="1.3"/>
<circle cx="23.00" cy="24.00" r="9.50" fill="#5b2a9e" stroke="#ffffff" stroke-width="1"/>
<text x="23.00" y="28.00" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800"><tspan>1</tspan></text>
<text x="38.00" y="28.00" font-size="10.4" fill="#1a2233" text-anchor="start" font-weight="800"><tspan>Fatore o que der</tspan></text>
<text x="72.00" y="55.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>x em evidência,</tspan></text>
<text x="72.00" y="71.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>agrupamento,</tspan></text>
<text x="72.00" y="87.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>produtos notáveis</tspan></text>
<line x1="138.00" y1="60.00" x2="149.10" y2="60.00" stroke="#5b2a9e" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="154.00,60.00 147.66,62.96 150.15,60.00 147.66,57.04" fill="#5b2a9e"/>
<rect x="156.00" y="6.00" width="128.00" height="108.00" rx="5" fill="#e7dcf6" stroke="#5b2a9e" stroke-width="1.3"/>
<circle cx="171.00" cy="24.00" r="9.50" fill="#5b2a9e" stroke="#ffffff" stroke-width="1"/>
<text x="171.00" y="28.00" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800"><tspan>2</tspan></text>
<text x="186.00" y="28.00" font-size="10.4" fill="#1a2233" text-anchor="start" font-weight="800"><tspan>Ache uma raiz</tspan></text>
<text x="220.00" y="55.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>P(0)=0?  P(1)=0?</tspan></text>
<text x="220.00" y="71.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>P(−1)=0?  Teste os</tspan></text>
<text x="220.00" y="87.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>candidatos p/q</tspan></text>
<line x1="286.00" y1="60.00" x2="297.10" y2="60.00" stroke="#5b2a9e" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="302.00,60.00 295.66,62.96 298.15,60.00 295.66,57.04" fill="#5b2a9e"/>
<rect x="304.00" y="6.00" width="128.00" height="108.00" rx="5" fill="#e7dcf6" stroke="#5b2a9e" stroke-width="1.3"/>
<circle cx="319.00" cy="24.00" r="9.50" fill="#5b2a9e" stroke="#ffffff" stroke-width="1"/>
<text x="319.00" y="28.00" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800"><tspan>3</tspan></text>
<text x="334.00" y="28.00" font-size="10.4" fill="#1a2233" text-anchor="start" font-weight="800"><tspan>Reduza o grau</tspan></text>
<text x="368.00" y="55.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>Ruffini: P = (x−r)·Q;</tspan></text>
<text x="368.00" y="71.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>repita se a raiz for</tspan></text>
<text x="368.00" y="87.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>múltipla</tspan></text>
<line x1="434.00" y1="60.00" x2="445.10" y2="60.00" stroke="#5b2a9e" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="450.00,60.00 443.66,62.96 446.15,60.00 443.66,57.04" fill="#5b2a9e"/>
<rect x="452.00" y="6.00" width="128.00" height="108.00" rx="5" fill="#e7dcf6" stroke="#5b2a9e" stroke-width="1.3"/>
<circle cx="467.00" cy="24.00" r="9.50" fill="#5b2a9e" stroke="#ffffff" stroke-width="1"/>
<text x="467.00" y="28.00" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800"><tspan>4</tspan></text>
<text x="482.00" y="28.00" font-size="10.4" fill="#1a2233" text-anchor="start" font-weight="800"><tspan>Resolva o resto</tspan></text>
<text x="516.00" y="55.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>grau 2: Bhaskara</tspan></text>
<text x="516.00" y="71.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>(Δ&lt;0: conjugadas);</tspan></text>
<text x="516.00" y="87.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>biquadr.: y = x²</tspan></text>
<line x1="582.00" y1="60.00" x2="593.10" y2="60.00" stroke="#5b2a9e" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="598.00,60.00 591.66,62.96 594.15,60.00 591.66,57.04" fill="#5b2a9e"/>
<rect x="600.00" y="6.00" width="128.00" height="108.00" rx="5" fill="#d9f0e2" stroke="#167a44" stroke-width="1.3"/>
<circle cx="615.00" cy="24.00" r="9.50" fill="#167a44" stroke="#ffffff" stroke-width="1"/>
<text x="615.00" y="28.00" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="800"><tspan>5</tspan></text>
<text x="630.00" y="28.00" font-size="10.4" fill="#1a2233" text-anchor="start" font-weight="800"><tspan>Confira</tspan></text>
<text x="664.00" y="55.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>Girard: soma e</tspan></text>
<text x="664.00" y="71.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>produto; substitua</tspan></text>
<text x="664.00" y="87.00" font-size="9.4" fill="#1a2233" text-anchor="middle"><tspan>uma raiz em P(x)</tspan></text>
<text x="368.00" y="132.00" font-size="8.8" fill="#5f6b7a" text-anchor="middle"><tspan>Se nenhuma raiz racional aparecer, a equação pode ter raízes irracionais ou complexas:</tspan></text>
<text x="368.00" y="144.00" font-size="8.8" fill="#5f6b7a" text-anchor="middle"><tspan>nem toda cúbica tem raiz racional (ex.: x³ = 2).</tspan></text>
</svg>
