<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 172" width="695" height="172" font-family="'Source Sans 3','Inter','DejaVu Sans',Arial,sans-serif"  role="img"><title>Corrosão e proteção do ferro</title><rect x="3" y="3" width="225.67" height="166" rx="9" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="115.83" y="18" font-size="11" text-anchor="middle" font-weight="800" fill="#8F3A06">Ferro exposto</text><rect x="22" y="70" width="187.67" height="24" rx="2" fill="#9AA3AF" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="115.83" cy="58" rx="22" ry="9" fill="#BBD6F8" stroke="#1D6FD8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="115.83" y="61" font-size="8.4" text-anchor="middle" font-weight="800" fill="#0B3F94"><tspan>H</tspan><tspan dy="2.02" font-size="6.05">2</tspan><tspan dy="-2.02" font-size="8.4">O + O</tspan><tspan dy="2.02" font-size="6.05">2</tspan></text><circle cx="115.83" cy="82" r="6" fill="#B5651D" opacity="0.9"/><text x="115.83" y="118" font-size="10" text-anchor="middle" font-weight="800" fill="#8F3A06"><tspan>Fe → Fe</tspan><tspan dy="-4" font-size="7.2">2+</tspan><tspan dy="4" font-size="10"> + 2 e⁻ (ânodo)</tspan></text><text x="115.83" y="131" font-size="9.6" text-anchor="middle" font-weight="700" fill="#334155"><tspan>O</tspan><tspan dy="2.3" font-size="6.91">2</tspan><tspan dy="-2.3" font-size="9.6"> + 2H</tspan><tspan dy="2.3" font-size="6.91">2</tspan><tspan dy="-2.3" font-size="9.6">O + 4e⁻ → 4OH⁻ (cátodo)</tspan></text><text x="115.83" y="148" font-size="10" text-anchor="middle" font-weight="800" fill="#8A171D"><tspan>ferrugem: Fe</tspan><tspan dy="2.4" font-size="7.2">2</tspan><tspan dy="-2.4" font-size="10">O</tspan><tspan dy="2.4" font-size="7.2">3</tspan><tspan dy="-2.4" font-size="10">·nH</tspan><tspan dy="2.4" font-size="7.2">2</tspan><tspan dy="-2.4" font-size="10">O</tspan></text><text x="115.83" y="161" font-size="9.2" text-anchor="middle" fill="#5B6575">(porosa: não protege)</text><rect x="234.67" y="3" width="225.67" height="166" rx="9" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="347.5" y="18" font-size="11" text-anchor="middle" font-weight="800" fill="#8F3A06">Galvanizado (Zn) riscado</text><rect x="253.67" y="70" width="187.67" height="24" rx="2" fill="#9AA3AF" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="253.67" y="64" width="79.83" height="6" rx="0" fill="#D3E4FA" stroke="#334155" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="361.5" y="64" width="79.83" height="6" rx="0" fill="#D3E4FA" stroke="#334155" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="347.5" cy="58" rx="22" ry="9" fill="#BBD6F8" stroke="#1D6FD8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="347.5" y="61" font-size="8.4" text-anchor="middle" font-weight="800" fill="#0B3F94"><tspan>H</tspan><tspan dy="2.02" font-size="6.05">2</tspan><tspan dy="-2.02" font-size="8.4">O + O</tspan><tspan dy="2.02" font-size="6.05">2</tspan></text><text x="277.67" y="56" font-size="9.6" text-anchor="middle" font-weight="800" fill="#0B3F94">Zn</text><text x="417.33" y="56" font-size="9.6" text-anchor="middle" font-weight="800" fill="#0B3F94">Zn</text><text x="347.5" y="118" font-size="10" text-anchor="middle" font-weight="800" fill="#0E5C33">Zn é o ânodo de sacrifício:</text><text x="347.5" y="131" font-size="9.6" text-anchor="middle" font-weight="700" fill="#334155"><tspan>Zn → Zn</tspan><tspan dy="-3.84" font-size="6.91">2+</tspan><tspan dy="3.84" font-size="9.6"> + 2e⁻ (E° Zn &lt; E° Fe)</tspan></text><text x="347.5" y="148" font-size="10" text-anchor="middle" font-weight="800" fill="#0E5C33">o Fe fica protegido,</text><text x="347.5" y="161" font-size="9.2" text-anchor="middle" fill="#5B6575">mesmo com a camada riscada</text><line x1="307.5" y1="68" x2="335.1" y2="80.08" fill="none" stroke="#EE6A1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="339.5,82 332.99,81.9 335.01,77.29" fill="#EE6A1B"/><text x="317.5" y="92" font-size="9" text-anchor="middle" font-weight="800" fill="#8F3A06">e⁻</text><rect x="466.33" y="3" width="225.67" height="166" rx="9" fill="#FFFFFF" stroke="#E5EAF1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="579.17" y="18" font-size="11" text-anchor="middle" font-weight="800" fill="#8F3A06">Folha-de-flandres (Sn) riscada</text><rect x="485.33" y="70" width="187.67" height="24" rx="2" fill="#9AA3AF" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="485.33" y="64" width="79.83" height="6" rx="0" fill="#E8E4D2" stroke="#334155" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="593.17" y="64" width="79.83" height="6" rx="0" fill="#E8E4D2" stroke="#334155" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="579.17" cy="58" rx="22" ry="9" fill="#BBD6F8" stroke="#1D6FD8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="579.17" y="61" font-size="8.4" text-anchor="middle" font-weight="800" fill="#0B3F94"><tspan>H</tspan><tspan dy="2.02" font-size="6.05">2</tspan><tspan dy="-2.02" font-size="8.4">O + O</tspan><tspan dy="2.02" font-size="6.05">2</tspan></text><text x="509.33" y="56" font-size="9.6" text-anchor="middle" font-weight="800" fill="#334155">Sn</text><text x="649" y="56" font-size="9.6" text-anchor="middle" font-weight="800" fill="#334155">Sn</text><text x="579.17" y="118" font-size="10" text-anchor="middle" font-weight="800" fill="#8A171D">Sn é menos reativo que Fe</text><text x="579.17" y="131" font-size="9.6" text-anchor="middle" font-weight="700" fill="#334155">(E° Sn &gt; E° Fe): o Fe vira ânodo</text><text x="579.17" y="148" font-size="10" text-anchor="middle" font-weight="800" fill="#8A171D">e oxida mais rápido que sozinho</text><text x="579.17" y="161" font-size="9.2" text-anchor="middle" fill="#5B6575">quando a camada é riscada</text><line x1="585.17" y1="82" x2="614.73" y2="69.83" fill="none" stroke="#EE6A1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="619.17,68 614.58,72.61 612.66,67.95" fill="#EE6A1B"/><text x="613.17" y="92" font-size="9" text-anchor="middle" font-weight="800" fill="#8F3A06">e⁻</text></svg>