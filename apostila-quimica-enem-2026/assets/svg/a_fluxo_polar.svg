<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 228" width="695" height="228" font-family="'Source Sans 3','Inter','DejaVu Sans',Arial,sans-serif"  role="img"><title>Fluxograma: molécula polar ou apolar?</title><rect x="6" y="12" width="160" height="76" rx="12" fill="#EEF2F7" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="26" r="9" fill="#334155"/><text x="20" y="29.6" font-size="11" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text><text x="94" y="42" font-size="11.8" text-anchor="middle" font-weight="700" fill="#1F2937">Existe alguma ligação</text><text x="94" y="57" font-size="11.8" text-anchor="middle" font-weight="700" fill="#1F2937">polar na molécula?</text><text x="94" y="74" font-size="10" text-anchor="middle" fill="#5B6575">(átomos com EN diferentes)</text><rect x="204" y="12" width="150" height="76" rx="12" fill="#EEF2F7" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="218" cy="26" r="9" fill="#334155"/><text x="218" y="29.6" font-size="11" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text><text x="287" y="42" font-size="11.8" text-anchor="middle" font-weight="700" fill="#1F2937">A molécula tem</text><text x="287" y="57" font-size="11.8" text-anchor="middle" font-weight="700" fill="#1F2937">só 2 átomos?</text><text x="287" y="74" font-size="10" text-anchor="middle" fill="#5B6575">(diatômica)</text><rect x="392" y="12" width="297" height="76" rx="12" fill="#EEF2F7" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="406" cy="26" r="9" fill="#334155"/><text x="406" y="29.6" font-size="11" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text><text x="548.5" y="42" font-size="11.8" text-anchor="middle" font-weight="700" fill="#1F2937">O átomo central tem par livre</text><text x="548.5" y="57" font-size="11.8" text-anchor="middle" font-weight="700" fill="#1F2937">ou os ligantes são diferentes?</text><text x="548.5" y="74" font-size="10" text-anchor="middle" fill="#5B6575">(assimetria dos vetores μ)</text><line x1="166" y1="50" x2="198.4" y2="50" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="204,50 197,52.94 197,47.06" fill="#334155"/><text x="185" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">sim</text><text x="185" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="#334155">sim</text><line x1="354" y1="50" x2="386.4" y2="50" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="392,50 385,52.94 385,47.06" fill="#334155"/><text x="373" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">não</text><text x="373" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="#334155">não</text><rect x="6" y="140" width="160" height="84" rx="12" fill="#FFF2CC" stroke="#D99100" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="160" font-size="12.6" text-anchor="middle" font-weight="800" fill="#7A5200">APOLAR</text><text x="86" y="176" font-size="10" text-anchor="middle" fill="#5B6575">sem ligação polar</text><text x="86" y="196" font-size="10.4" text-anchor="middle" font-weight="700" fill="#7A5200"><tspan>O</tspan><tspan dy="2.5" font-size="7.49">2</tspan><tspan dy="-2.5" font-size="10.4">, N</tspan><tspan dy="2.5" font-size="7.49">2</tspan><tspan dy="-2.5" font-size="10.4">, Cl</tspan><tspan dy="2.5" font-size="7.49">2</tspan><tspan dy="-2.5" font-size="10.4">, hidrocarbonetos</tspan></text><rect x="204" y="140" width="150" height="84" rx="12" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="279" y="160" font-size="12.6" text-anchor="middle" font-weight="800" fill="#0B3F94">POLAR</text><text x="279" y="176" font-size="10" text-anchor="middle" fill="#5B6575">ligação polar única</text><text x="279" y="196" font-size="10.4" text-anchor="middle" font-weight="700" fill="#0B3F94">HCl, HF, CO, NO</text><rect x="392" y="140" width="142" height="84" rx="12" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="160" font-size="12.6" text-anchor="middle" font-weight="800" fill="#0B3F94"><tspan>POLAR · μ</tspan><tspan dy="3.02" font-size="9.07">R</tspan><tspan dy="-3.02" font-size="12.6"> ≠ 0</tspan></text><text x="463" y="176" font-size="10" text-anchor="middle" fill="#5B6575">vetores não se anulam</text><text x="463" y="196" font-size="10.4" text-anchor="middle" font-weight="700" fill="#0B3F94"><tspan>H</tspan><tspan dy="2.5" font-size="7.49">2</tspan><tspan dy="-2.5" font-size="10.4">O, NH</tspan><tspan dy="2.5" font-size="7.49">3</tspan><tspan dy="-2.5" font-size="10.4">, SO</tspan><tspan dy="2.5" font-size="7.49">2</tspan><tspan dy="-2.5" font-size="10.4">, CH</tspan><tspan dy="2.5" font-size="7.49">3</tspan><tspan dy="-2.5" font-size="10.4">Cl</tspan></text><rect x="547" y="140" width="142" height="84" rx="12" fill="#FFF2CC" stroke="#D99100" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="160" font-size="12.6" text-anchor="middle" font-weight="800" fill="#7A5200"><tspan>APOLAR · μ</tspan><tspan dy="3.02" font-size="9.07">R</tspan><tspan dy="-3.02" font-size="12.6"> = 0</tspan></text><text x="618" y="176" font-size="10" text-anchor="middle" fill="#5B6575">vetores se anulam</text><text x="618" y="196" font-size="10.4" text-anchor="middle" font-weight="700" fill="#7A5200"><tspan>CO</tspan><tspan dy="2.5" font-size="7.49">2</tspan><tspan dy="-2.5" font-size="10.4">, CH</tspan><tspan dy="2.5" font-size="7.49">4</tspan><tspan dy="-2.5" font-size="10.4">, CCl</tspan><tspan dy="2.5" font-size="7.49">4</tspan><tspan dy="-2.5" font-size="10.4">, BF</tspan><tspan dy="2.5" font-size="7.49">3</tspan></text><line x1="86" y1="88" x2="86" y2="134.4" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="86,140 83.06,133 88.94,133" fill="#334155"/><text x="100" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">não</text><text x="100" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="#334155">não</text><line x1="279" y1="88" x2="279" y2="134.4" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="279,140 276.06,133 281.94,133" fill="#334155"/><text x="293" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">sim</text><text x="293" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="#334155">sim</text><line x1="463" y1="88" x2="463" y2="134.4" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="463,140 460.06,133 465.94,133" fill="#334155"/><text x="477" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">sim</text><text x="477" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="#334155">sim</text><line x1="618" y1="88" x2="618" y2="134.4" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="618,140 615.06,133 620.94,133" fill="#334155"/><text x="632" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">não</text><text x="632" y="118" font-size="10.5" text-anchor="start" font-weight="700" fill="#334155">não</text></svg>