" y="89.5" font-size="11.5" text-anchor="middle" font-weight="800" fill="#FFFFFF">4</text><text x="348" y="84.5" font-size="12" text-anchor="start" font-weight="800" fill="#1F2937">quaternário</text><text x="420.31" y="84.5" font-size="11" text-anchor="start" fill="#334155">— ligado a 4 outros carbonos</text><text x="348" y="96.5" font-size="9.8" text-anchor="start" font-weight="600" fill="#4C1D95">aqui: 1 carbono (sem H)</text><text x="321" y="109" font-size="10.2" text-anchor="start" font-weight="700" fill="#8A171D">Conte só ligações com OUTROS carbonos: H e heteroátomos (O, N, Cl) não contam.</text></svg>