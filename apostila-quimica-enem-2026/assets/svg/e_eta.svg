<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 224" width="695" height="224" font-family="'Source Sans 3','Inter','DejaVu Sans',Arial,sans-serif"  role="img"><title>Fluxograma de uma estação de tratamento de água (ETA)</title><rect x="4" y="8" width="124" height="76" rx="9" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="21" r="9" fill="#1D6FD8"/><text x="17" y="24.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">1</text><text x="31" y="25" font-size="11" text-anchor="start" font-weight="800" fill="#0B3F94">Captação</text><text x="12" y="41" font-size="9.4" text-anchor="start" fill="#1F2937">gradeamento retém</text><text x="12" y="52.4" font-size="9.4" text-anchor="start" fill="#1F2937">detritos grosseiros</text><line x1="129" y1="46" x2="136.4" y2="46" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="142,46 135,48.94 135,43.06" fill="#334155"/><rect x="143" y="8" width="124" height="76" rx="9" fill="#FFEBDC" stroke="#EE6A1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="156" cy="21" r="9" fill="#EE6A1B"/><text x="156" y="24.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">2</text><text x="170" y="25" font-size="11" text-anchor="start" font-weight="800" fill="#8F3A06">Coagulação</text><text x="151" y="41" font-size="9.4" text-anchor="start" fill="#1F2937"><tspan>Al</tspan><tspan dy="2.26" font-size="6.77">2</tspan><tspan dy="-2.26" font-size="9.4">(SO</tspan><tspan dy="2.26" font-size="6.77">4</tspan><tspan dy="-2.26" font-size="9.4">)</tspan><tspan dy="2.26" font-size="6.77">3</tspan><tspan dy="-2.26" font-size="9.4"> + cal → Al(OH)</tspan><tspan dy="2.26" font-size="6.77">3</tspan></text><text x="151" y="52.4" font-size="9.4" text-anchor="start" fill="#1F2937">gelatinoso retém partículas</text><line x1="268" y1="46" x2="275.4" y2="46" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="281,46 274,48.94 274,43.06" fill="#334155"/><rect x="282" y="8" width="124" height="76" rx="9" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="295" cy="21" r="9" fill="#1D6FD8"/><text x="295" y="24.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">3</text><text x="309" y="25" font-size="11" text-anchor="start" font-weight="800" fill="#0B3F94">Floculação</text><text x="290" y="41" font-size="9.4" text-anchor="start" fill="#1F2937">agitação lenta junta as</text><text x="290" y="52.4" font-size="9.4" text-anchor="start" fill="#1F2937">partículas em flocos</text><line x1="407" y1="46" x2="414.4" y2="46" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="420,46 413,48.94 413,43.06" fill="#334155"/><rect x="421" y="8" width="124" height="76" rx="9" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="434" cy="21" r="9" fill="#1D6FD8"/><text x="434" y="24.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">4</text><text x="448" y="25" font-size="11" text-anchor="start" font-weight="800" fill="#0B3F94">Decantação</text><text x="429" y="41" font-size="9.4" text-anchor="start" fill="#1F2937">flocos densos sedimentam</text><text x="429" y="52.4" font-size="9.4" text-anchor="start" fill="#1F2937">formando o lodo</text><line x1="546" y1="46" x2="553.4" y2="46" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="559,46 552,48.94 552,43.06" fill="#334155"/><rect x="560" y="8" width="124" height="76" rx="9" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="573" cy="21" r="9" fill="#1D6FD8"/><text x="573" y="24.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">5</text><text x="587" y="25" font-size="11" text-anchor="start" font-weight="800" fill="#0B3F94">Filtração</text><text x="568" y="41" font-size="9.4" text-anchor="start" fill="#1F2937">areia e antracito retêm</text><text x="568" y="52.4" font-size="9.4" text-anchor="start" fill="#1F2937">os flocos restantes</text><rect x="4" y="116" width="124" height="76" rx="9" fill="#FFEBDC" stroke="#EE6A1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="129" r="9" fill="#EE6A1B"/><text x="17" y="132.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">6</text><text x="31" y="133" font-size="11" text-anchor="start" font-weight="800" fill="#8F3A06">Desinfecção</text><text x="12" y="149" font-size="9.4" text-anchor="start" fill="#1F2937">cloro: HClO oxida e</text><text x="12" y="160.4" font-size="9.4" text-anchor="start" fill="#1F2937">elimina micro-organismos</text><line x1="129" y1="154" x2="136.4" y2="154" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="142,154 135,156.94 135,151.06" fill="#334155"/><rect x="143" y="116" width="124" height="76" rx="9" fill="#FFEBDC" stroke="#EE6A1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="156" cy="129" r="9" fill="#EE6A1B"/><text x="156" y="132.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">7</text><text x="170" y="133" font-size="11" text-anchor="start" font-weight="800" fill="#8F3A06">Correção de pH</text><text x="151" y="149" font-size="9.4" text-anchor="start" fill="#1F2937">cal ou soda ajustam o pH</text><text x="151" y="160.4" font-size="9.4" text-anchor="start" fill="#1F2937">(evita corrosão)</text><line x1="268" y1="154" x2="275.4" y2="154" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="281,154 274,156.94 274,151.06" fill="#334155"/><rect x="282" y="116" width="124" height="76" rx="9" fill="#FFEBDC" stroke="#EE6A1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="295" cy="129" r="9" fill="#EE6A1B"/><text x="295" y="132.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">8</text><text x="309" y="133" font-size="11" text-anchor="start" font-weight="800" fill="#8F3A06">Fluoretação</text><text x="290" y="149" font-size="9.4" text-anchor="start" fill="#1F2937">adição de fluoreto</text><text x="290" y="160.4" font-size="9.4" text-anchor="start" fill="#1F2937">(≈ 0,7 mg/L): cáries</text><line x1="407" y1="154" x2="414.4" y2="154" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="420,154 413,156.94 413,151.06" fill="#334155"/><rect x="421" y="116" width="124" height="76" rx="9" fill="#E6F0FD" stroke="#1D6FD8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="434" cy="129" r="9" fill="#1D6FD8"/><text x="434" y="132.6" font-size="10.6" text-anchor="middle" font-weight="800" fill="#FFFFFF">9</text><text x="448" y="133" font-size="11" text-anchor="start" font-weight="800" fill="#0B3F94">Reservatório</text><text x="429" y="149" font-size="9.4" text-anchor="start" fill="#1F2937">cloro residual protege</text><text x="429" y="160.4" font-size="9.4" text-anchor="start" fill="#1F2937">a rede de distribuição</text><path d="M622.0 84 L622.0 100 L66.0 100 L66.0 115" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="66,115 63.06,108 68.94,108" fill="#334155"/><text x="622" y="140" font-size="11" text-anchor="middle" font-weight="800" fill="#0E5C33">Torneira:</text><text x="622" y="154" font-size="11" text-anchor="middle" font-weight="800" fill="#0E5C33">água potável</text><line x1="546" y1="154" x2="556.4" y2="154" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="562,154 555,156.94 555,151.06" fill="#334155"/><rect x="55.28" y="206.5" width="109.44" height="15" rx="7.5" fill="#FFEBDC" stroke="#F7B68A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="217.2" font-size="9.4" text-anchor="middle" font-weight="700" fill="#8F3A06">etapa química (reação)</text><rect x="213.73" y="206.5" width="112.53" height="15" rx="7.5" fill="#E6F0FD" stroke="#9CC3F5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="217.2" font-size="9.4" text-anchor="middle" font-weight="700" fill="#0B3F94">etapa física (separação)</text></svg>