<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 240.0" role="img" aria-label="Cadeia produtiva internacional e curva do sorriso" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Cadeia produtiva internacional e curva do sorriso</title><text x="0.0" y="8.53" font-size="10.67" fill="#B23C00" font-weight="800"><tspan x="0.0" dy="0">Exemplo: smartphone (cadeia global de valor; países ilustrativos)</tspan></text><rect x="0.0" y="22.0" width="128.0" height="60.0" fill="#FFFFFF" rx="6" stroke="#7B3FA0" stroke-width="1.6" /><rect x="0.0" y="22.0" width="128.0" height="18.0" fill="#7B3FA0" rx="6" /><text x="70.0" y="34.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="70.0" dy="0">P&amp;D e design</tspan></text><text x="5.0" y="50.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="5.0" dy="0">sede da empresa: EUA, Japão,</tspan><tspan x="5.0" dy="9.44">UE, Coreia do Sul</tspan></text><circle cx="11.0" cy="31.0" r="7.5" fill="#1F2A44"/><text x="11.0" y="34.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="11.0" dy="0">1</tspan></text><line x1="129.0" y1="52.0" x2="139.1" y2="52.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="144.5,52.0 139.1,55.3 139.1,48.7" fill="#37474F"/><rect x="145.5" y="22.0" width="128.0" height="60.0" fill="#FFFFFF" rx="6" stroke="#8D5B2E" stroke-width="1.6" /><rect x="145.5" y="22.0" width="128.0" height="18.0" fill="#8D5B2E" rx="6" /><text x="215.5" y="34.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="215.5" dy="0">Matérias-primas</tspan></text><text x="150.5" y="50.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="150.5" dy="0">minérios e terras raras: Brasil,</tspan><tspan x="150.5" dy="9.44">África, Austrália, China</tspan></text><circle cx="156.5" cy="31.0" r="7.5" fill="#1F2A44"/><text x="156.5" y="34.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="156.5" dy="0">2</tspan></text><line x1="274.5" y1="52.0" x2="284.6" y2="52.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="290.0,52.0 284.6,55.3 284.6,48.7" fill="#37474F"/><rect x="291.0" y="22.0" width="128.0" height="60.0" fill="#FFFFFF" rx="6" stroke="#1565C0" stroke-width="1.6" /><rect x="291.0" y="22.0" width="128.0" height="18.0" fill="#1565C0" rx="6" /><text x="361.0" y="34.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="361.0" dy="0">Componentes</tspan></text><text x="296.0" y="50.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="296.0" dy="0">chips e telas: Coreia do Sul,</tspan><tspan x="296.0" dy="9.44">Taiwan, Japão</tspan></text><circle cx="302.0" cy="31.0" r="7.5" fill="#1F2A44"/><text x="302.0" y="34.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="302.0" dy="0">3</tspan></text><line x1="420.0" y1="52.0" x2="430.1" y2="52.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="435.5,52.0 430.1,55.3 430.1,48.7" fill="#37474F"/><rect x="436.5" y="22.0" width="128.0" height="60.0" fill="#FFFFFF" rx="6" stroke="#E65100" stroke-width="1.6" /><rect x="436.5" y="22.0" width="128.0" height="18.0" fill="#E65100" rx="6" /><text x="506.5" y="34.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="506.5" dy="0">Montagem</tspan></text><text x="441.5" y="50.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="441.5" dy="0">China, Vietnã, Índia (mão de</tspan><tspan x="441.5" dy="9.44">obra barata, incentivos)</tspan></text><circle cx="447.5" cy="31.0" r="7.5" fill="#1F2A44"/><text x="447.5" y="34.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="447.5" dy="0">4</tspan></text><line x1="565.5" y1="52.0" x2="575.6" y2="52.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="581.0,52.0 575.6,55.3 575.6,48.7" fill="#37474F"/><rect x="582.0" y="22.0" width="128.0" height="60.0" fill="#FFFFFF" rx="6" stroke="#7B3FA0" stroke-width="1.6" /><rect x="582.0" y="22.0" width="128.0" height="18.0" fill="#7B3FA0" rx="6" /><text x="652.0" y="34.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="652.0" dy="0">Marca e serviços</tspan></text><text x="587.0" y="50.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="587.0" dy="0">lojas, logística e software no</tspan><tspan x="587.0" dy="9.44">mundo todo</tspan></text><circle cx="593.0" cy="31.0" r="7.5" fill="#1F2A44"/><text x="593.0" y="34.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="593.0" dy="0">5</tspan></text><text x="0.0" y="101.04" font-size="8.80" fill="#37474F" font-weight="800"><tspan x="0.0" dy="0">“Curva do sorriso” (conceito): valor agregado alto em P&amp;D e em marca/serviços; baixo na montagem</tspan></text><line x1="24.0" y1="226.0" x2="462.0" y2="226.0" stroke="#37474F" stroke-width="1.0" stroke-linecap="round"/><line x1="24.0" y1="118.0" x2="24.0" y2="226.0" stroke="#37474F" stroke-width="1.0" stroke-linecap="round"/><text x="28.0" y="118.19" font-size="7.73" fill="#5B6475" font-weight="700"><tspan x="28.0" dy="0">valor agregado ↑</tspan></text><polygon points="24.0,132.5 35.0,139.5 45.9,146.2 56.9,152.5 67.8,158.4 78.8,164.0 89.7,169.2 100.6,174.1 111.6,178.6 122.5,182.7 133.5,186.5 144.4,189.9 155.4,193.0 166.3,195.7 177.3,198.0 188.2,200.0 199.2,201.6 210.2,202.9 221.1,203.8 232.0,204.3 243.0,204.5 254.0,204.3 264.9,203.8 275.9,202.9 286.8,201.6 297.8,200.0 308.7,198.0 319.7,195.7 330.6,193.0 341.6,189.9 352.5,186.5 363.4,182.7 374.4,178.6 385.3,174.1 396.3,169.2 407.2,164.0 418.2,158.4 429.2,152.5 440.1,146.2 451.1,139.5 462.0,132.5 462.0,226.0 24.0,226.0" fill="#FFE0B2" opacity="0.6"/><polyline points="24.0,132.5 35.0,139.5 45.9,146.2 56.9,152.5 67.8,158.4 78.8,164.0 89.7,169.2 100.6,174.1 111.6,178.6 122.5,182.7 133.5,186.5 144.4,189.9 155.4,193.0 166.3,195.7 177.3,198.0 188.2,200.0 199.2,201.6 210.2,202.9 221.1,203.8 232.0,204.3 243.0,204.5 254.0,204.3 264.9,203.8 275.9,202.9 286.8,201.6 297.8,200.0 308.7,198.0 319.7,195.7 330.6,193.0 341.6,189.9 352.5,186.5 363.4,182.7 374.4,178.6 385.3,174.1 396.3,169.2 407.2,164.0 418.2,158.4 429.2,152.5 440.1,146.2 451.1,139.5 462.0,132.5" fill="none" stroke="#E65100" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="24.0" y="236.40" font-size="8.00" fill="#1D2330" font-weight="800"><tspan x="24.0" dy="0">P&amp;D e design</tspan></text><text x="243.0" y="236.40" font-size="8.00" fill="#1D2330" font-weight="800" text-anchor="middle"><tspan x="243.0" dy="0">montagem</tspan></text><text x="462.0" y="236.40" font-size="8.00" fill="#1D2330" font-weight="800" text-anchor="end"><tspan x="462.0" dy="0">marca e serviços</tspan></text><text x="462.0" y="118.19" font-size="7.73" fill="#5B6475" font-weight="700" text-anchor="end"><tspan x="462.0" dy="0">etapas da cadeia →</tspan></text><text x="484.0" y="114.83" font-size="8.53" fill="#1D2330" font-weight="500"><tspan x="484.0" dy="0"><tspan font-weight="700">Fragmentação:</tspan> a empresa transnacional divide a</tspan><tspan x="484.0" dy="10.41">produção por vários países, buscando custos baixos,</tspan><tspan x="484.0" dy="10.41">incentivos fiscais, mercado e mão de obra qualificada.</tspan></text><text x="484.0" y="153.06" font-size="8.53" fill="#1D2330" font-weight="500"><tspan x="484.0" dy="0"><tspan font-weight="700">Ganho desigual:</tspan> países de montagem ficam com</tspan><tspan x="484.0" dy="10.41"><tspan font-weight="700">pouco valor</tspan>; sede e marca retêm lucros e patentes.</tspan></text><text x="484.0" y="180.88" font-size="8.53" fill="#1D2330" font-weight="500"><tspan x="484.0" dy="0"><tspan font-weight="700">Brasil:</tspan> exporta commodities (minério, soja, petróleo) e</tspan><tspan x="484.0" dy="10.41">importa componentes; pouca participação em etapas</tspan><tspan x="484.0" dy="10.41">de alta tecnologia.</tspan></text></svg>