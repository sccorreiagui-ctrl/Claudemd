<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348.0 196.0" role="img" aria-label="Matriz de transporte de cargas" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Matriz de transporte de cargas</title><text x="0.0" y="8.32" font-size="10.40" fill="#37474F" font-weight="800"><tspan x="0.0" dy="0">Transporte de cargas: participação por modal</tspan></text><text x="0.0" y="18.40" font-size="8.00" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">CNT, Boletim Unificado (mar/2022); t·km útil</tspan></text><text x="0.0" y="36.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Rodoviário</tspan></text><rect x="0.0" y="41.0" width="263.3" height="14.0" fill="#546E7A" rx="2" /><text x="268.3" y="51.26" font-size="9.07" fill="#37474F" font-weight="800"><tspan x="268.3" dy="0">≈ 65%</tspan></text><text x="0.0" y="70.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Aquaviário</tspan></text><rect x="0.0" y="75.0" width="63.7" height="14.0" fill="#1565C0" rx="2" /><text x="68.7" y="85.26" font-size="9.07" fill="#37474F" font-weight="800"><tspan x="68.7" dy="0">≈ 16%</tspan></text><text x="0.0" y="104.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Ferroviário</tspan></text><rect x="0.0" y="109.0" width="60.9" height="14.0" fill="#8D5B2E" rx="2" /><text x="65.9" y="119.26" font-size="9.07" fill="#37474F" font-weight="800"><tspan x="65.9" dy="0">≈ 15%</tspan></text><text x="0.0" y="138.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Dutoviário e aéreo (soma)</tspan></text><rect x="0.0" y="143.0" width="17.9" height="14.0" fill="#F9A825" rx="2" /><text x="22.9" y="153.26" font-size="9.07" fill="#37474F" font-weight="800"><tspan x="22.9" dy="0">≈ 4–5%</tspan></text><text x="0.0" y="170.61" font-size="8.27" fill="#1D2330" font-weight="500"><tspan x="0.0" dy="0">O Brasil depende das <tspan font-weight="700">rodovias</tspan> (mais caras e poluentes em longas distâncias) para</tspan><tspan x="0.0" dy="10.09">escoar grãos e minérios; ferrovias e hidrovias são subutilizadas. É um dos componentes</tspan><tspan x="0.0" dy="10.09">do <tspan font-weight="700">“Custo Brasil”</tspan>.</tspan></text></svg>