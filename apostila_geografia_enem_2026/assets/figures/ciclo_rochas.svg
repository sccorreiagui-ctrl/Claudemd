<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 308.0" role="img" aria-label="Ciclo das rochas" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Ciclo das rochas</title><path d="M440.0,40.0 Q560.0,36.0 595.5,89.3" fill="none" stroke="#D84315" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="600.0,96.0 591.4,92.0 599.6,86.5" fill="#D84315"/><path d="M606.0,150.0 Q584.0,198.0 569.8,224.8" fill="none" stroke="#8D5B2E" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="566.0,232.0 565.4,222.5 574.2,227.2" fill="#8D5B2E"/><path d="M440.0,258.0 Q355.0,300.0 277.3,261.6" fill="none" stroke="#6D4C41" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="270.0,258.0 279.5,257.2 275.1,266.0" fill="#6D4C41"/><path d="M150.0,232.0 Q96.0,200.0 97.7,158.1" fill="none" stroke="#546E7A" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="98.0,150.0 102.6,158.3 92.7,157.9" fill="#546E7A"/><path d="M98.0,98.0 Q120.0,40.0 259.9,40.0" fill="none" stroke="#D84315" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="268.0,40.0 259.9,45.0 259.9,35.0" fill="#D84315"/><line x1="512.0" y1="138.0" x2="204.3" y2="138.0" stroke="#7B1FA2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 3"/><polygon points="198.0,138.0 204.3,134.2 204.3,141.8" fill="#7B1FA2"/><path d="M170.0,150.0 Q250.0,214.0 431.8,239.1" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="4 3" /><polygon points="438.0,240.0 431.2,243.0 432.3,235.3" fill="#7B1FA2"/><rect x="270.0" y="15.0" width="170.0" height="50.0" fill="#FFFFFF" rx="8" stroke="#D84315" stroke-width="1.8" /><text x="355.0" y="33.11" font-size="10.13" fill="#D84315" font-weight="800" text-anchor="middle"><tspan x="355.0" dy="0">MAGMA</tspan></text><text x="355.0" y="43.51" font-size="8.13" fill="#37474F" font-weight="600" text-anchor="middle"><tspan x="355.0" dy="0">rocha fundida (manto e crosta profunda)</tspan></text><rect x="514.0" y="99.0" width="196.0" height="50.0" fill="#FFFFFF" rx="8" stroke="#B23C00" stroke-width="1.8" /><text x="612.0" y="117.11" font-size="10.13" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="612.0" dy="0">ROCHAS MAGMÁTICAS</tspan></text><text x="612.0" y="127.51" font-size="8.13" fill="#37474F" font-weight="600" text-anchor="middle"><tspan x="612.0" dy="0">granito (intrusiva, resfriamento lento)</tspan><tspan x="612.0" dy="9.11">basalto (extrusiva, resfriamento rápido)</tspan></text><rect x="440.0" y="233.0" width="176.0" height="50.0" fill="#FFFFFF" rx="8" stroke="#8D5B2E" stroke-width="1.8" /><text x="528.0" y="251.11" font-size="10.13" fill="#8D5B2E" font-weight="800" text-anchor="middle"><tspan x="528.0" dy="0">SEDIMENTOS</tspan></text><text x="528.0" y="261.51" font-size="8.13" fill="#37474F" font-weight="600" text-anchor="middle"><tspan x="528.0" dy="0">areia, argila, restos orgânicos</tspan></text><rect x="94.0" y="233.0" width="176.0" height="50.0" fill="#FFFFFF" rx="8" stroke="#6D4C41" stroke-width="1.8" /><text x="182.0" y="251.11" font-size="10.13" fill="#6D4C41" font-weight="800" text-anchor="middle"><tspan x="182.0" dy="0">ROCHAS SEDIMENTARES</tspan></text><text x="182.0" y="261.51" font-size="8.13" fill="#37474F" font-weight="600" text-anchor="middle"><tspan x="182.0" dy="0">arenito, calcário, folhelho</tspan></text><rect x="8.0" y="99.0" width="180.0" height="50.0" fill="#FFFFFF" rx="8" stroke="#546E7A" stroke-width="1.8" /><text x="98.0" y="117.11" font-size="10.13" fill="#546E7A" font-weight="800" text-anchor="middle"><tspan x="98.0" dy="0">ROCHAS METAMÓRFICAS</tspan></text><text x="98.0" y="127.51" font-size="8.13" fill="#37474F" font-weight="600" text-anchor="middle"><tspan x="98.0" dy="0">gnaisse, mármore, quartzito</tspan></text><text x="520.0" y="15.25" font-size="9.07" fill="#D84315" font-weight="800" text-anchor="middle"><tspan x="520.0" dy="0">resfriamento e cristalização</tspan></text><text x="706.0" y="189.04" font-size="8.80" fill="#8D5B2E" font-weight="800" text-anchor="end"><tspan x="706.0" dy="0">intemperismo, erosão</tspan><tspan x="706.0" dy="9.86">e transporte</tspan></text><text x="355.0" y="299.25" font-size="9.07" fill="#6D4C41" font-weight="800" text-anchor="middle"><tspan x="355.0" dy="0">deposição, compactação e cimentação (litificação)</tspan></text><text x="20.0" y="203.04" font-size="8.80" fill="#546E7A" font-weight="800"><tspan x="20.0" dy="0">calor e pressão</tspan><tspan x="20.0" dy="9.86">(metamorfismo)</tspan></text><text x="190.0" y="15.25" font-size="9.07" fill="#D84315" font-weight="800" text-anchor="middle"><tspan x="190.0" dy="0">fusão (temperaturas muito altas)</tspan></text><text x="355.0" y="89.73" font-size="14.67" fill="#1F2A44" font-weight="800" text-anchor="middle"><tspan x="355.0" dy="0">CICLO DAS ROCHAS</tspan></text><text x="355.0" y="105.04" font-size="8.80" fill="#5B6475" font-weight="600" text-anchor="middle" font-style="italic"><tspan x="355.0" dy="0">não há “ponto de partida” nem sequência obrigatória:</tspan><tspan x="355.0" dy="10.56">qualquer rocha pode ser erodida, metamorfizada ou fundida</tspan></text><text x="355.0" y="152.72" font-size="8.40" fill="#7B1FA2" font-weight="700" text-anchor="middle"><tspan x="355.0" dy="0">atalho: magmática → metamórfica (calor e pressão)</tspan></text><text x="300.0" y="182.72" font-size="8.40" fill="#7B1FA2" font-weight="700" text-anchor="middle"><tspan x="300.0" dy="0">atalho: metamórfica → sedimentos</tspan><tspan x="300.0" dy="9.41">(intemperismo e erosão)</tspan></text></svg>