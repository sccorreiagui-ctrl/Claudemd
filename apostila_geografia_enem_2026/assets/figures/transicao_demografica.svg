<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348.0 250.0" role="img" aria-label="Modelo da transição demográfica" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Modelo da transição demográfica</title><rect x="0.0" y="0.0" width="348.0" height="250.0" fill="#FFFFFF" /><text x="174.0" y="8.11" font-size="10.13" fill="#4A148C" font-weight="800" text-anchor="middle"><tspan x="174.0" dy="0">Transição demográfica (modelo esquemático)</tspan></text><rect x="24.0" y="26.0" width="60.0" height="112.0" fill="#ECEFF1" /><text x="54.0" y="34.19" font-size="7.73" fill="#37474F" font-weight="800" text-anchor="middle"><tspan x="54.0" dy="0">FASE 1</tspan></text><rect x="84.0" y="26.0" width="70.0" height="112.0" fill="#E3F2FD" /><text x="119.0" y="34.19" font-size="7.73" fill="#37474F" font-weight="800" text-anchor="middle"><tspan x="119.0" dy="0">FASE 2</tspan></text><rect x="154.0" y="26.0" width="84.0" height="112.0" fill="#F3E8F9" /><text x="196.0" y="34.19" font-size="7.73" fill="#37474F" font-weight="800" text-anchor="middle"><tspan x="196.0" dy="0">FASE 3</tspan></text><rect x="238.0" y="26.0" width="102.0" height="112.0" fill="#E8F5E9" /><text x="289.0" y="34.19" font-size="7.73" fill="#37474F" font-weight="800" text-anchor="middle"><tspan x="289.0" dy="0">FASE 4</tspan></text><line x1="24.0" y1="138.0" x2="340.0" y2="138.0" stroke="#37474F" stroke-width="1.0" stroke-linecap="round"/><line x1="24.0" y1="26.0" x2="24.0" y2="138.0" stroke="#37474F" stroke-width="1.0" stroke-linecap="round"/><text x="26.0" y="146.97" font-size="7.47" fill="#5B6475" font-weight="700"><tspan x="26.0" dy="0">tempo / desenvolvimento →</tspan></text><polygon points="24.0,40.0 84.0,40.0 120.0,44.0 154.0,58.0 199.0,92.0 238.0,110.0 340.0,114.0 340.0,110.0 238.0,110.0 154.0,110.0 120.0,96.0 84.0,58.0 60.0,44.0 24.0,42.0" fill="#AB47BC" opacity="0.2"/><path d="M24.0,40.0 L84.0,40.0 L120.0,44.0 L154.0,58.0 L199.0,92.0 L238.0,110.0 L340.0,114.0" fill="none" stroke="#C62828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M24.0,42.0 L60.0,44.0 L84.0,58.0 L120.0,96.0 L154.0,110.0 L238.0,110.0 L340.0,110.0" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="28.0" y="58.19" font-size="7.73" fill="#C62828" font-weight="800"><tspan x="28.0" dy="0">natalidade</tspan></text><text x="100.0" y="110.19" font-size="7.73" fill="#1565C0" font-weight="800"><tspan x="100.0" dy="0">mortalidade</tspan></text><circle cx="232.0" cy="110.0" r="3.6" fill="#2E7D32" stroke="#FFFFFF" stroke-width="1.0"/><text x="226.0" y="72.19" font-size="7.73" fill="#1B5E20" font-weight="800" text-anchor="end"><tspan x="226.0" dy="0">Brasil hoje</tspan><tspan x="226.0" dy="8.51">(fase 3→4)</tspan></text><line x1="228.0" y1="80.0" x2="232.0" y2="106.0" stroke="#1B5E20" stroke-width="0.8" stroke-linecap="round"/><rect x="24.0" y="152.0" width="58.0" height="48.0" fill="#ECEFF1" rx="3" /><text x="27.0" y="160.97" font-size="7.47" fill="#263238" font-weight="700"><tspan x="27.0" dy="0">alta</tspan><tspan x="27.0" dy="8.36">natalidade e</tspan><tspan x="27.0" dy="8.36">alta</tspan><tspan x="27.0" dy="8.36">mortalidade</tspan></text><rect x="84.0" y="152.0" width="68.0" height="48.0" fill="#E3F2FD" rx="3" /><text x="87.0" y="160.97" font-size="7.47" fill="#263238" font-weight="700"><tspan x="87.0" dy="0">mortalidade cai</tspan><tspan x="87.0" dy="8.36">primeiro:</tspan><tspan x="87.0" dy="8.36">“explosão”</tspan></text><rect x="154.0" y="152.0" width="82.0" height="48.0" fill="#F3E8F9" rx="3" /><text x="157.0" y="160.97" font-size="7.47" fill="#263238" font-weight="700"><tspan x="157.0" dy="0">natalidade cai:</tspan><tspan x="157.0" dy="8.36">crescimento</tspan><tspan x="157.0" dy="8.36">desacelera</tspan></text><rect x="238.0" y="152.0" width="100.0" height="48.0" fill="#E8F5E9" rx="3" /><text x="241.0" y="160.97" font-size="7.47" fill="#263238" font-weight="700"><tspan x="241.0" dy="0">taxas baixas;</tspan><tspan x="241.0" dy="8.36">envelhecimento</tspan></text><rect x="8.0" y="210.0" width="10.0" height="7.0" fill="#AB47BC" opacity="0.35" /><text x="22.0" y="214.19" font-size="7.73" fill="#1D2330" font-weight="600"><tspan x="22.0" dy="0">crescimento natural = natalidade − mortalidade</tspan></text><text x="8.0" y="228.40" font-size="8.00" fill="#1D2330" font-weight="600"><tspan x="8.0" dy="0">No Brasil: urbanização, mulher no mercado de trabalho, contraceptivos, custo de vida</tspan><tspan x="8.0" dy="9.60">e queda da mortalidade infantil. TFT ≈ 6 filhos por mulher (1960) → 1,55 (2022).</tspan></text></svg>