<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 232.0" role="img" aria-label="Corte transversal da Terra com suas camadas" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Corte transversal da Terra com suas camadas</title><circle cx="118.0" cy="112.0" r="102.0" fill="#7B4B2A"/><circle cx="118.0" cy="112.0" r="96.0" fill="#E8893F"/><circle cx="118.0" cy="112.0" r="91.3" fill="#C8502D"/><circle cx="118.0" cy="112.0" r="55.7" fill="#F4B63F"/><circle cx="118.0" cy="112.0" r="19.5" fill="#FBE08A"/><circle cx="118.0" cy="112.0" r="102.0" fill="none" stroke="#FFFFFF" stroke-width="1.4"/><text x="118.0" y="110.27" font-size="6.93" fill="#6A4A00" font-weight="800" text-anchor="middle"><tspan x="118.0" dy="0">NÚCLEO</tspan><tspan x="118.0" dy="8.46">INTERNO</tspan></text><text x="116.0" y="154.69" font-size="7.47" fill="#7A4A00" font-weight="800" text-anchor="middle"><tspan x="116.0" dy="0">núcleo externo</tspan></text><text x="98.0" y="41.46" font-size="9.60" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="1.5"><tspan x="98.0" dy="0">MANTO</tspan></text><line x1="171.0" y1="27.2" x2="262.0" y2="10.0" stroke="#1D2330" stroke-width="0.7" stroke-linecap="round"/><circle cx="171.0" cy="27.2" r="2.2" fill="#FFFFFF" stroke="#1D2330" stroke-width="0.8"/><text x="270.0" y="10.96" font-size="11.20" fill="#7B4B2A" font-weight="800"><tspan x="270.0" dy="0">Crosta e litosfera</tspan></text><text x="270.0" y="21.57" font-size="9.47" fill="#1D2330" font-weight="400"><tspan x="270.0" dy="0"><tspan font-weight="700">Sólidas e rígidas.</tspan> Crosta: ≈ 5–10 km (oceânica) a 30–70 km (continental). Litosfera (≈ 100 km):</tspan><tspan x="270.0" dy="11.36">crosta + topo do manto, partida em <tspan font-weight="700">placas tectônicas</tspan>.</tspan></text><line x1="194.2" y1="68.0" x2="262.0" y2="56.0" stroke="#1D2330" stroke-width="0.7" stroke-linecap="round"/><circle cx="194.2" cy="68.0" r="2.2" fill="#FFFFFF" stroke="#1D2330" stroke-width="0.8"/><text x="270.0" y="56.96" font-size="11.20" fill="#C25E1B" font-weight="800"><tspan x="270.0" dy="0">Astenosfera</tspan></text><text x="270.0" y="67.57" font-size="9.47" fill="#1D2330" font-weight="400"><tspan x="270.0" dy="0"><tspan font-weight="700">≈ 100–400 km.</tspan> Rocha sólida, quente e dúctil, que se deforma devagar; as placas “deslizam”</tspan><tspan x="270.0" dy="11.36">sobre ela.</tspan></text><line x1="186.6" y1="106.0" x2="262.0" y2="102.0" stroke="#1D2330" stroke-width="0.7" stroke-linecap="round"/><circle cx="186.6" cy="106.0" r="2.2" fill="#FFFFFF" stroke="#1D2330" stroke-width="0.8"/><text x="270.0" y="102.96" font-size="11.20" fill="#A8401F" font-weight="800"><tspan x="270.0" dy="0">Manto</tspan></text><text x="270.0" y="113.57" font-size="9.47" fill="#1D2330" font-weight="400"><tspan x="270.0" dy="0"><tspan font-weight="700">≈ 2.900 km de espessura (~84% do volume).</tspan> Rocha <tspan font-weight="700">sólida</tspan> que flui lentamente em escala de</tspan><tspan x="270.0" dy="11.36">milhões de anos (convecção); <tspan font-weight="700">não é um oceano de magma</tspan>.</tspan></text><line x1="153.6" y1="126.4" x2="262.0" y2="148.0" stroke="#1D2330" stroke-width="0.7" stroke-linecap="round"/><circle cx="153.6" cy="126.4" r="2.2" fill="#FFFFFF" stroke="#1D2330" stroke-width="0.8"/><text x="270.0" y="148.96" font-size="11.20" fill="#9A6200" font-weight="800"><tspan x="270.0" dy="0">Núcleo externo</tspan></text><text x="270.0" y="159.57" font-size="9.47" fill="#1D2330" font-weight="400"><tspan x="270.0" dy="0"><tspan font-weight="700">2.900–5.150 km, ferro e níquel líquidos.</tspan> Seu movimento gera o campo magnético que protege a</tspan><tspan x="270.0" dy="11.36">Terra do vento solar.</tspan></text><line x1="125.5" y1="120.3" x2="262.0" y2="194.0" stroke="#1D2330" stroke-width="0.7" stroke-linecap="round"/><circle cx="125.5" cy="120.3" r="2.2" fill="#FFFFFF" stroke="#1D2330" stroke-width="0.8"/><text x="270.0" y="194.96" font-size="11.20" fill="#7A5C00" font-weight="800"><tspan x="270.0" dy="0">Núcleo interno</tspan></text><text x="270.0" y="205.57" font-size="9.47" fill="#1D2330" font-weight="400"><tspan x="270.0" dy="0"><tspan font-weight="700">5.150–6.371 km, ferro-níquel sólido</tspan> (pressão altíssima); mais de ≈ 5.000 °C.</tspan></text><text x="8.0" y="224.40" font-size="8.00" fill="#5B6475" font-weight="400" font-style="italic"><tspan x="8.0" dy="0">Núcleo e manto em escala (1 cm = ≈ 570 km); crosta e litosfera foram exageradas para serem visíveis.</tspan></text></svg>