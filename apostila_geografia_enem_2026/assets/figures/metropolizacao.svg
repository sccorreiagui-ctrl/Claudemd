<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 220.0" role="img" aria-label="Conurbação, metropolização, macrocefalia e migração pendular" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Conurbação, metropolização, macrocefalia e migração pendular</title><rect x="0.0" y="0.0" width="229.0" height="20.0" fill="#7B3FA0" rx="4" /><text x="114.5" y="13.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="114.5" dy="0">CONURBAÇÃO</tspan></text><rect x="0.0" y="22.0" width="229.0" height="124.0" fill="#F7F0FB" stroke="#D8BFE8" stroke-width="0.8" /><text x="114.5" y="34.29" font-size="7.87" fill="#4A148C" font-weight="600" text-anchor="middle"><tspan x="114.5" dy="0">cidades vizinhas se fundem fisicamente</tspan></text><rect x="241.0" y="0.0" width="229.0" height="20.0" fill="#7B3FA0" rx="4" /><text x="355.5" y="13.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">METRÓPOLE E MIGRAÇÃO PENDULAR</tspan></text><rect x="241.0" y="22.0" width="229.0" height="124.0" fill="#F7F0FB" stroke="#D8BFE8" stroke-width="0.8" /><text x="355.5" y="34.29" font-size="7.87" fill="#4A148C" font-weight="600" text-anchor="middle"><tspan x="355.5" dy="0">polo + cidades-dormitório; vai e vem diário</tspan></text><rect x="482.0" y="0.0" width="229.0" height="20.0" fill="#7B3FA0" rx="4" /><text x="596.5" y="13.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="596.5" dy="0">MACROCEFALIA URBANA</tspan></text><rect x="482.0" y="22.0" width="229.0" height="124.0" fill="#F7F0FB" stroke="#D8BFE8" stroke-width="0.8" /><text x="596.5" y="34.29" font-size="7.87" fill="#4A148C" font-weight="600" text-anchor="middle"><tspan x="596.5" dy="0">uma cidade muito maior que as demais</tspan></text><circle cx="60.0" cy="90.0" r="28.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8" opacity="0.55"/><circle cx="116.0" cy="96.0" r="24.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8" opacity="0.55"/><circle cx="170.0" cy="88.0" r="30.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8" opacity="0.55"/><circle cx="60.0" cy="90.0" r="12.0" fill="#7B3FA0"/><circle cx="116.0" cy="96.0" r="10.0" fill="#7B3FA0"/><circle cx="170.0" cy="88.0" r="13.0" fill="#7B3FA0"/><text x="114.5" y="126.19" font-size="7.73" fill="#1D2330" font-weight="600" text-anchor="middle"><tspan x="114.5" dy="0">áreas urbanas contíguas (ex.: Santos–São</tspan><tspan x="114.5" dy="8.66">Vicente–Guarujá, SP; Belo Horizonte–Contagem, MG)</tspan></text><circle cx="355.5" cy="86.0" r="20.0" fill="#7B3FA0"/><text x="355.5" y="89.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">polo</tspan></text><circle cx="413.8" cy="97.6" r="8.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8"/><line x1="410.9" y1="96.6" x2="380.7" y2="93.9" stroke="#E65100" stroke-width="1.2" stroke-linecap="butt"/><polygon points="376.2,93.5 380.9,91.2 380.4,96.7" fill="#E65100"/><circle cx="366.3" cy="119.5" r="8.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8"/><line x1="365.7" y1="116.5" x2="362.0" y2="111.3" stroke="#E65100" stroke-width="1.2" stroke-linecap="butt"/><polygon points="359.3,107.7 364.2,109.7 359.7,112.9" fill="#E65100"/><circle cx="301.8" cy="103.0" r="8.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8"/><line x1="304.4" y1="101.5" x2="332.0" y2="97.6" stroke="#E65100" stroke-width="1.2" stroke-linecap="butt"/><polygon points="336.4,97.0 332.4,100.3 331.6,94.9" fill="#E65100"/><circle cx="301.8" cy="69.0" r="8.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8"/><line x1="304.4" y1="70.5" x2="332.0" y2="74.4" stroke="#E65100" stroke-width="1.2" stroke-linecap="butt"/><polygon points="336.4,75.0 331.6,77.1 332.4,71.7" fill="#E65100"/><circle cx="355.5" cy="52.0" r="8.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8"/><line x1="355.5" y1="55.0" x2="355.5" y2="59.5" stroke="#E65100" stroke-width="1.2" stroke-linecap="butt"/><polygon points="355.5,64.0 352.8,59.5 358.2,59.5" fill="#E65100"/><circle cx="409.2" cy="69.0" r="8.0" fill="#B39DDB" stroke="#7B3FA0" stroke-width="0.8"/><line x1="406.6" y1="70.5" x2="379.0" y2="74.4" stroke="#E65100" stroke-width="1.2" stroke-linecap="butt"/><polygon points="374.6,75.0 378.6,71.7 379.4,77.1" fill="#E65100"/><text x="355.5" y="126.19" font-size="7.73" fill="#1D2330" font-weight="600" text-anchor="middle"><tspan x="355.5" dy="0">cidades-dormitório → trabalho e estudo no polo; a</tspan><tspan x="355.5" dy="8.66">residência não muda (região metropolitana)</tspan></text><rect x="500.0" y="44.0" width="22.0" height="90.0" fill="#7B3FA0" /><text x="511.0" y="144.19" font-size="7.73" fill="#1D2330" font-weight="700" text-anchor="middle"><tspan x="511.0" dy="0">A</tspan></text><rect x="536.0" y="114.2" width="22.0" height="19.8" fill="#B39DDB" /><text x="547.0" y="144.19" font-size="7.73" fill="#1D2330" font-weight="700" text-anchor="middle"><tspan x="547.0" dy="0">B</tspan></text><rect x="572.0" y="121.4" width="22.0" height="12.6" fill="#B39DDB" /><text x="583.0" y="144.19" font-size="7.73" fill="#1D2330" font-weight="700" text-anchor="middle"><tspan x="583.0" dy="0">C</tspan></text><rect x="608.0" y="125.9" width="22.0" height="8.1" fill="#B39DDB" /><text x="619.0" y="144.19" font-size="7.73" fill="#1D2330" font-weight="700" text-anchor="middle"><tspan x="619.0" dy="0">D</tspan></text><rect x="644.0" y="128.6" width="22.0" height="5.4" fill="#B39DDB" /><text x="655.0" y="144.19" font-size="7.73" fill="#1D2330" font-weight="700" text-anchor="middle"><tspan x="655.0" dy="0">E</tspan></text><text x="596.5" y="153.33" font-size="6.67" fill="#1D2330" font-weight="400"><tspan x="596.5" dy="0"></tspan></text><text x="552.0" y="68.19" font-size="7.73" fill="#4A148C" font-weight="800"><tspan x="552.0" dy="0">metrópole</tspan><tspan x="552.0" dy="8.51">(exemplo didático)</tspan></text><text x="2.0" y="160.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="2.0" dy="0"><tspan font-weight="700">Conurbação:</tspan> união física de malhas urbanas de</tspan><tspan x="2.0" dy="10.08">municípios vizinhos; pode ou não formar metrópole.</tspan></text><text x="243.0" y="160.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="243.0" dy="0"><tspan font-weight="700">Metropolização:</tspan> concentração de pessoas, serviços e</tspan><tspan x="243.0" dy="10.08">gestão em um polo e sua região; gera fluxos</tspan><tspan x="243.0" dy="10.08"><tspan font-weight="700">pendulares</tspan> diários.</tspan></text><text x="484.0" y="160.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="484.0" dy="0"><tspan font-weight="700">Macrocefalia urbana:</tspan> desequilíbrio da rede urbana</tspan><tspan x="484.0" dy="10.08">(uma cidade concentra população e funções), típica de</tspan><tspan x="484.0" dy="10.08">urbanização rápida e desigual.</tspan></text></svg>