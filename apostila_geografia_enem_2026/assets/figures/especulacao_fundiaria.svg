<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 180.0" role="img" aria-label="Esquema de concentração e especulação fundiária" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Esquema de concentração e especulação fundiária</title><rect x="0.0" y="0.0" width="168.8" height="16.0" fill="#5D3A1A" rx="3" /><text x="84.4" y="10.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="84.4" dy="0">1. COMPRA BARATA</tspan></text><rect x="0.0" y="18.0" width="168.8" height="84.0" fill="#EAF4FC" /><rect x="0.0" y="78.0" width="168.8" height="24.0" fill="#C9A77C" /><rect x="14.0" y="62.0" width="140.8" height="16.0" fill="#BCAAA4" stroke="#6D4C41" stroke-width="0.8" /><text x="84.4" y="72.78" font-size="7.73" fill="#4E342E" font-weight="800" text-anchor="middle"><tspan x="84.4" dy="0">terra ociosa (cerca)</tspan></text><text x="84.4" y="40.53" font-size="10.67" fill="#2E7D32" font-weight="800" text-anchor="middle"><tspan x="84.4" dy="0">R$</tspan></text><text x="84.4" y="52.40" font-size="8.00" fill="#2E7D32" font-weight="800" text-anchor="middle"><tspan x="84.4" dy="0">preço baixo</tspan></text><text x="2.0" y="114.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="2.0" dy="0">Terra isolada e barata é comprada e</tspan><tspan x="2.0" dy="10.08">mantida ociosa (reserva de valor).</tspan></text><line x1="169.8" y1="56.0" x2="174.3" y2="56.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="179.8,56.0 174.3,59.3 174.3,52.7" fill="#37474F"/><rect x="180.8" y="0.0" width="168.8" height="16.0" fill="#5D3A1A" rx="3" /><text x="265.1" y="10.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="265.1" dy="0">2. O ESTADO INVESTE</tspan></text><rect x="180.8" y="18.0" width="168.8" height="84.0" fill="#EAF4FC" /><rect x="180.8" y="78.0" width="168.8" height="24.0" fill="#C9A77C" /><line x1="184.8" y1="90.0" x2="345.5" y2="88.0" stroke="#37474F" stroke-width="5.0" stroke-linecap="round"/><line x1="184.8" y1="90.0" x2="345.5" y2="88.0" stroke="#FFFFFF" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="4 3"/><rect x="198.8" y="62.0" width="132.8" height="12.0" fill="#BCAAA4" stroke="#6D4C41" stroke-width="0.8" /><path d="M190.75,40 L339.5,40" fill="none" stroke="#78909C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><line x1="208.8" y1="40.0" x2="208.8" y2="56.0" stroke="#78909C" stroke-width="1.4" stroke-linecap="round"/><line x1="236.8" y1="40.0" x2="236.8" y2="56.0" stroke="#78909C" stroke-width="1.4" stroke-linecap="round"/><line x1="264.8" y1="40.0" x2="264.8" y2="56.0" stroke="#78909C" stroke-width="1.4" stroke-linecap="round"/><text x="265.1" y="32.19" font-size="7.73" fill="#0D47A1" font-weight="800" text-anchor="middle"><tspan x="265.1" dy="0">Estado: estrada, luz, escola</tspan></text><text x="182.8" y="114.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="182.8" dy="0">Estrada, energia, escola e saneamento</tspan><tspan x="182.8" dy="10.08">pagos com dinheiro público chegam à</tspan><tspan x="182.8" dy="10.08">região.</tspan></text><line x1="350.5" y1="56.0" x2="355.1" y2="56.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="360.5,56.0 355.1,59.3 355.1,52.7" fill="#37474F"/><rect x="361.5" y="0.0" width="168.8" height="16.0" fill="#5D3A1A" rx="3" /><text x="445.9" y="10.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="445.9" dy="0">3. A TERRA VALORIZA</tspan></text><rect x="361.5" y="18.0" width="168.8" height="84.0" fill="#EAF4FC" /><rect x="361.5" y="78.0" width="168.8" height="24.0" fill="#C9A77C" /><rect x="379.5" y="62.0" width="132.8" height="12.0" fill="#BCAAA4" stroke="#6D4C41" stroke-width="0.8" /><line x1="365.5" y1="90.0" x2="526.2" y2="88.0" stroke="#37474F" stroke-width="4.0" stroke-linecap="round"/><line x1="445.9" y1="56.0" x2="445.9" y2="34.1" stroke="#E65100" stroke-width="3.0" stroke-linecap="butt"/><polygon points="445.9,26.0 450.8,34.1 440.9,34.1" fill="#E65100"/><text x="469.9" y="44.83" font-size="8.53" fill="#E65100" font-weight="800"><tspan x="469.9" dy="0">preço ↑↑</tspan></text><text x="363.5" y="114.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="363.5" dy="0">Sem investir, o dono vê o preço da terra</tspan><tspan x="363.5" dy="10.08">subir por causa da infraestrutura alheia.</tspan></text><line x1="531.2" y1="56.0" x2="535.9" y2="56.0" stroke="#37474F" stroke-width="1.8" stroke-linecap="butt"/><polygon points="541.2,56.0 535.9,59.3 535.9,52.7" fill="#37474F"/><rect x="542.2" y="0.0" width="168.8" height="16.0" fill="#5D3A1A" rx="3" /><text x="626.6" y="10.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="626.6" dy="0">4. VENDA OU LOTEAMENTO</tspan></text><rect x="542.2" y="18.0" width="168.8" height="84.0" fill="#EAF4FC" /><rect x="542.2" y="78.0" width="168.8" height="24.0" fill="#C9A77C" /><rect x="548.2" y="56.0" width="23.1" height="22.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><rect x="574.4" y="56.0" width="23.1" height="22.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><rect x="600.5" y="56.0" width="23.1" height="22.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><rect x="626.6" y="56.0" width="23.1" height="22.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><rect x="652.8" y="56.0" width="23.1" height="22.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><rect x="678.9" y="56.0" width="23.1" height="22.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><line x1="546.2" y1="90.0" x2="707.0" y2="88.0" stroke="#37474F" stroke-width="4.0" stroke-linecap="round"/><text x="626.6" y="38.61" font-size="8.27" fill="#B71C1C" font-weight="800" text-anchor="middle"><tspan x="626.6" dy="0">R$$$ para o proprietário</tspan></text><text x="544.2" y="114.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="544.2" dy="0">Venda por preço muito maior; pequenos</tspan><tspan x="544.2" dy="10.08">agricultores ficam sem acesso à terra.</tspan></text><text x="0.0" y="174.40" font-size="8.00" fill="#5D3A1A" font-weight="700"><tspan x="0.0" dy="0">Grilagem: apropriação de terras públicas com documentos falsificados. Função social da propriedade (CF/1988, art. 186): uso adequado, respeito ao ambiente e às leis trabalhistas.</tspan></text></svg>