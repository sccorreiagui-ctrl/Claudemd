<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 232.0" role="img" aria-label="Divisão Internacional do Trabalho: tradicional e nova" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Divisão Internacional do Trabalho: tradicional e nova</title><rect x="0.0" y="0.0" width="348.5" height="22.0" fill="#6D4C41" rx="5" /><text x="174.2" y="13.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="174.2" dy="0">DIT TRADICIONAL (colonial e industrial, até meados do séc. XX)</tspan></text><rect x="0.0" y="24.0" width="348.5" height="168.0" fill="#FAFAFA" rx="4" stroke="#E3E8EE" stroke-width="0.8" /><rect x="362.5" y="0.0" width="348.5" height="22.0" fill="#E65100" rx="5" /><text x="536.8" y="13.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="536.8" dy="0">NOVA DIT (a partir de 1950–70: transnacionais e cadeias globais)</tspan></text><rect x="362.5" y="24.0" width="348.5" height="168.0" fill="#FAFAFA" rx="4" stroke="#E3E8EE" stroke-width="0.8" /><circle cx="62.0" cy="70.0" r="29.0" fill="#1565C0"/><text x="62.0" y="69.26" font-size="9.07" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="62.0" dy="0">CENTRO</tspan></text><text x="62.0" y="79.69" font-size="7.47" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="62.0" dy="0">EUA · Europa</tspan></text><circle cx="288.0" cy="124.0" r="29.0" fill="#8D5B2E"/><text x="288.0" y="123.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="288.0" dy="0">PERIFERIA</tspan></text><text x="288.0" y="133.69" font-size="7.47" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="288.0" dy="0">Brasil · África</tspan></text><line x1="98.0" y1="66.0" x2="245.1" y2="106.1" stroke="#1565C0" stroke-width="2.6" stroke-linecap="butt"/><polygon points="252.0,108.0 243.9,110.4 246.2,101.9" fill="#1565C0"/><line x1="256.0" y1="130.0" x2="107.0" y2="89.9" stroke="#8D5B2E" stroke-width="2.6" stroke-linecap="butt"/><polygon points="100.0,88.0 108.1,85.6 105.8,94.1" fill="#8D5B2E"/><text x="190.0" y="72.61" font-size="8.27" fill="#0D47A1" font-weight="800" text-anchor="middle"><tspan x="190.0" dy="0">manufaturados</tspan><tspan x="190.0" dy="9.09">(alto valor)</tspan></text><text x="160.0" y="130.61" font-size="8.27" fill="#5D3A1A" font-weight="800" text-anchor="middle"><tspan x="160.0" dy="0">matérias-primas e commodities</tspan><tspan x="160.0" dy="9.09">(baixo valor)</tspan></text><text x="8.0" y="156.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0"><tspan font-weight="700">Periferia:</tspan> agrícola e extrativista, dependente. <tspan font-weight="700">Centro:</tspan> industrial. Consequência:</tspan><tspan x="8.0" dy="10.08">troca desigual e dependência tecnológica.</tspan></text><rect x="372.5" y="40.0" width="120.0" height="60.0" fill="#7B3FA0" rx="6" /><text x="432.5" y="58.61" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="432.5" dy="0">SEDE · P&amp;D · FINANÇAS</tspan></text><text x="432.5" y="70.19" font-size="7.73" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="432.5" dy="0">países centrais</tspan></text><text x="432.5" y="82.19" font-size="7.73" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="432.5" dy="0">retém patentes e lucros</tspan></text><rect x="576.5" y="30.0" width="126.0" height="38.0" fill="#FFE0B2" rx="5" stroke="#E65100" stroke-width="1.2" /><text x="639.5" y="47.40" font-size="8.00" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="639.5" dy="0">montagem</tspan><tspan x="639.5" dy="8.96">China · Vietnã</tspan></text><line x1="494.5" y1="70.0" x2="568.3" y2="50.4" stroke="#7B3FA0" stroke-width="1.8" stroke-linecap="butt"/><polygon points="573.5,49.0 569.1,53.6 567.4,47.2" fill="#7B3FA0"/><rect x="576.5" y="72.0" width="126.0" height="38.0" fill="#FFE0B2" rx="5" stroke="#E65100" stroke-width="1.2" /><text x="639.5" y="89.40" font-size="8.00" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="639.5" dy="0">indústria poluente</tspan><tspan x="639.5" dy="8.96">México · Índia</tspan></text><line x1="494.5" y1="70.0" x2="568.3" y2="89.6" stroke="#7B3FA0" stroke-width="1.8" stroke-linecap="butt"/><polygon points="573.5,91.0 567.4,92.8 569.1,86.4" fill="#7B3FA0"/><rect x="576.5" y="112.0" width="126.0" height="38.0" fill="#FFE0B2" rx="5" stroke="#E65100" stroke-width="1.2" /><text x="639.5" y="129.40" font-size="8.00" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="639.5" dy="0">serviços (call center)</tspan><tspan x="639.5" dy="8.96">Filipinas · Índia</tspan></text><line x1="494.5" y1="70.0" x2="569.2" y2="127.7" stroke="#7B3FA0" stroke-width="1.8" stroke-linecap="butt"/><polygon points="573.5,131.0 567.2,130.3 571.2,125.1" fill="#7B3FA0"/><text x="372.5" y="114.19" font-size="7.73" fill="#4A148C" font-weight="700"><tspan x="372.5" dy="0">ordens, projetos e capital →</tspan><tspan x="372.5" dy="8.89">← mercadorias e lucros</tspan></text><text x="370.5" y="156.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="370.5" dy="0"><tspan font-weight="700">Transnacionais</tspan> buscam mão de obra barata, incentivos fiscais e leis ambientais e</tspan><tspan x="370.5" dy="9.60">trabalhistas mais brandas. Surgem países industrializados na periferia e há</tspan><tspan x="370.5" dy="9.60"><tspan font-weight="700">desindustrialização relativa</tspan> de parte do centro.</tspan></text><rect x="0.0" y="198.0" width="711.0" height="30.0" fill="#FFF0E0" rx="4" /><text x="355.5" y="209.61" font-size="8.27" fill="#B23C00" font-weight="700" text-anchor="middle"><tspan x="355.5" dy="0"><tspan font-weight="800">Fuga de cérebros (brain drain):</tspan> profissionais qualificados da periferia migram para centros de pesquisa.  <tspan font-weight="800">Compressão espaço-tempo:</tspan> transportes e comunicações</tspan><tspan x="355.5" dy="9.75">encurtam o tempo, não a distância.</tspan></text></svg>