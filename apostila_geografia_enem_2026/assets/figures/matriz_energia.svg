ase 2025). Energia ≠ eletricidade: a eletricidade é só uma parte da matriz energética (que inclui transporte, indústria e calor). Na</tspan><tspan x="0.0" dy="9.76">matriz energética pesam o petróleo (transportes) e a biomassa; na elétrica, a hidráulica; eólica + solar somam ≈ 26% (2025).</tspan></text></svg>