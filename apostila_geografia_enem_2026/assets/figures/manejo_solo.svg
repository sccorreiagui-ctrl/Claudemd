<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 212.0" role="img" aria-label="Erosão em encosta e práticas conservacionistas" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Erosão em encosta e práticas conservacionistas</title><rect x="0.0" y="0.0" width="229.0" height="20.0" fill="#C62828" rx="4" /><text x="114.5" y="12.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="114.5" dy="0">SEM MANEJO: plantio morro abaixo</tspan></text><rect x="0.0" y="22.0" width="229.0" height="112.0" fill="#EAF4FC" /><rect x="241.0" y="0.0" width="229.0" height="20.0" fill="#1B5E20" rx="4" /><text x="355.5" y="12.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">CURVAS DE NÍVEL: plantio em contorno</tspan></text><rect x="241.0" y="22.0" width="229.0" height="112.0" fill="#EAF4FC" /><rect x="482.0" y="0.0" width="229.0" height="20.0" fill="#1565C0" rx="4" /><text x="596.5" y="12.98" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="596.5" dy="0">TERRACEAMENTO: degraus na encosta</tspan></text><rect x="482.0" y="22.0" width="229.0" height="112.0" fill="#EAF4FC" /><polygon points="0.0,60.0 34.4,66.0 206.1,124.0 229.0,128.0 229.0,134.0 0.0,134.0" fill="#C9A77C" stroke="#8C6039" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="45.8" y1="70.0" x2="63.8" y2="86.0" stroke="#7CB342" stroke-width="3.0" stroke-linecap="round"/><line x1="80.1" y1="82.0" x2="98.1" y2="98.0" stroke="#7CB342" stroke-width="3.0" stroke-linecap="round"/><line x1="114.5" y1="94.0" x2="132.5" y2="110.0" stroke="#7CB342" stroke-width="3.0" stroke-linecap="round"/><line x1="148.8" y1="106.0" x2="166.8" y2="122.0" stroke="#7CB342" stroke-width="3.0" stroke-linecap="round"/><line x1="183.2" y1="118.0" x2="201.2" y2="134.0" stroke="#7CB342" stroke-width="3.0" stroke-linecap="round"/><line x1="40.0" y1="78.0" x2="55.4" y2="87.2" stroke="#1E88E5" stroke-width="2.0" stroke-linecap="butt"/><polygon points="60.0,90.0 53.7,90.1 57.1,84.4" fill="#1E88E5"/><line x1="74.0" y1="98.0" x2="89.4" y2="107.2" stroke="#1E88E5" stroke-width="2.0" stroke-linecap="butt"/><polygon points="94.0,110.0 87.7,110.1 91.1,104.4" fill="#1E88E5"/><line x1="104.0" y1="114.0" x2="119.4" y2="123.2" stroke="#1E88E5" stroke-width="2.0" stroke-linecap="butt"/><polygon points="124.0,126.0 117.7,126.1 121.1,120.4" fill="#1E88E5"/><path d="M114.5,96 q4,10 10,14 q-2,6 6,10" fill="none" stroke="#6D4C41" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="114.5" y="32.19" font-size="7.73" fill="#C62828" font-weight="800" text-anchor="middle"><tspan x="114.5" dy="0">chuva escorre depressa</tspan></text><text x="124.5" y="127.97" font-size="7.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="124.5" dy="0">voçoroca (sulco) · assoreamento</tspan></text><polygon points="241.0,60.0 275.4,66.0 447.1,124.0 470.0,128.0 470.0,134.0 241.0,134.0" fill="#C9A77C" stroke="#8C6039" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="256.5" y1="71.0" x2="282.5" y2="65.0" stroke="#2E7D32" stroke-width="4.0" stroke-linecap="butt"/><line x1="295.4" y1="83.0" x2="321.4" y2="77.0" stroke="#2E7D32" stroke-width="4.0" stroke-linecap="butt"/><line x1="334.3" y1="95.0" x2="360.3" y2="89.0" stroke="#2E7D32" stroke-width="4.0" stroke-linecap="butt"/><line x1="373.3" y1="107.0" x2="399.3" y2="101.0" stroke="#2E7D32" stroke-width="4.0" stroke-linecap="butt"/><line x1="412.2" y1="119.0" x2="438.2" y2="113.0" stroke="#2E7D32" stroke-width="4.0" stroke-linecap="butt"/><line x1="281.0" y1="78.0" x2="288.7" y2="80.6" stroke="#1E88E5" stroke-width="1.6" stroke-linecap="butt"/><polygon points="293.0,82.0 287.9,83.2 289.6,78.0" fill="#1E88E5"/><line x1="315.0" y1="98.0" x2="322.7" y2="100.6" stroke="#1E88E5" stroke-width="1.6" stroke-linecap="butt"/><polygon points="327.0,102.0 321.9,103.2 323.6,98.0" fill="#1E88E5"/><text x="355.5" y="32.19" font-size="7.73" fill="#1B5E20" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">fileiras acompanham as cotas</tspan></text><text x="355.5" y="127.97" font-size="7.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">a água perde velocidade e infiltra</tspan></text><polygon points="482.0,68.0 490.0,68.0 522.0,68.0 522.0,82.0 554.0,82.0 554.0,96.0 586.0,96.0 586.0,110.0 618.0,110.0 618.0,122.0 711.0,122.0 711.0,134.0 482.0,134.0" fill="#C9A77C" stroke="#8C6039" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="492.0" y1="65.0" x2="518.0" y2="65.0" stroke="#7CB342" stroke-width="4.0" stroke-linecap="butt"/><line x1="524.0" y1="79.0" x2="550.0" y2="79.0" stroke="#7CB342" stroke-width="4.0" stroke-linecap="butt"/><line x1="556.0" y1="93.0" x2="582.0" y2="93.0" stroke="#7CB342" stroke-width="4.0" stroke-linecap="butt"/><line x1="588.0" y1="107.0" x2="614.0" y2="107.0" stroke="#7CB342" stroke-width="4.0" stroke-linecap="butt"/><line x1="496.0" y1="56.0" x2="505.9" y2="60.2" stroke="#1E88E5" stroke-width="1.6" stroke-linecap="butt"/><polygon points="510.0,62.0 504.8,62.8 506.9,57.7" fill="#1E88E5"/><text x="596.5" y="32.19" font-size="7.73" fill="#0D47A1" font-weight="800" text-anchor="middle"><tspan x="596.5" dy="0">patamares retêm a água</tspan></text><text x="596.5" y="131.97" font-size="7.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="596.5" dy="0">técnica milenar (Incas, Andes)</tspan></text><text x="2.0" y="148.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="2.0" dy="0">Sem proteção o solo perde a camada fértil (A);</tspan><tspan x="2.0" dy="10.08">sedimentos assoreiam rios e açudes.</tspan></text><text x="243.0" y="148.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="243.0" dy="0">As linhas de plantio seguem a mesma altitude (curvas</tspan><tspan x="243.0" dy="10.08">de nível): menor escoamento e mais infiltração.</tspan></text><text x="484.0" y="148.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="484.0" dy="0">Degraus horizontais quebram a velocidade da água;</tspan><tspan x="484.0" dy="10.08">usado em encostas íngremes.</tspan></text><rect x="0.0" y="186.0" width="711.0" height="22.0" fill="#F4EBE0" rx="4" /><text x="355.5" y="200.12" font-size="8.67" fill="#5D3A1A" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">Também: plantio direto (palhada), cobertura vegetal, rotação de culturas, pousio, cordões de vegetação e matas ciliares.</tspan></text></svg>