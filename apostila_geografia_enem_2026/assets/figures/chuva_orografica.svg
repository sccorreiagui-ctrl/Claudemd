="round" /><polygon points="176.0,90.0 168.9,96.3 167.2,86.5" fill="#1E88E5"/><path d="M14.0,82.0 Q110.0,70.0 218.1,43.9" fill="none" stroke="#1E88E5" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="226.0,42.0 219.3,48.7 217.0,39.1" fill="#1E88E5"/><path d="M218,52 a16,13 0 0 1 28,-8 a18,15 0 0 1 34,4 a11,10 0 0 1 8,16 l-72,0 a9,8 0 0 1 2,-12 z" fill="#B0BEC5" stroke="#78909C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><line x1="230.0" y1="72.0" x2="227.5" y2="82.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><line x1="238.0" y1="75.0" x2="235.5" y2="85.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><line x1="246.0" y1="72.0" x2="243.5" y2="82.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><line x1="254.0" y1="75.0" x2="251.5" y2="85.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><line x1="262.0" y1="72.0" x2="259.5" y2="82.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><line x1="270.0" y1="75.0" x2="267.5" y2="85.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><line x1="278.0" y1="72.0" x2="275.5" y2="82.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round"/><path d="M296.0,40.0 Q346.0,46.0 375.2,85.5" fill="none" stroke="#E53935" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="380.0,92.0 371.2,88.4 379.2,82.5" fill="#E53935"/><path d="M310.0,28.0 Q380.0,30.0 421.6,84.3" fill="none" stroke="#E53935" stroke-width="2.0" stroke-linecap="butt" stroke-linejoin="round" /><polygon points="426.0,90.0 418.1,87.0 425.1,81.6" fill="#E53935"/><text x="461.0" y="106.61" font-size="8.27" fill="#C62828" font-weight="800" text-anchor="end"><tspan x="461.0" dy="0">ar seco e quente</tspan><tspan x="461.0" dy="9.09">desce e se aquece</tspan></text><line x1="456.0" y1="70.0" x2="460.0" y2="70.0" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="453.1" y1="77.1" x2="455.9" y2="79.9" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="446.0" y1="80.0" x2="446.0" y2="84.0" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="438.9" y1="77.1" x2="436.1" y2="79.9" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="436.0" y1="70.0" x2="432.0" y2="70.0" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="438.9" y1="62.9" x2="436.1" y2="60.1" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="446.0" y1="60.0" x2="446.0" y2="56.0" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><line x1="453.1" y1="62.9" x2="455.9" y2="60.1" stroke="#F9A825" stroke-width="1.6" stroke-linecap="round"/><circle cx="446.0" cy="70.0" r="7.0" fill="#F9A825"/><text x="8.0" y="38.75" font-size="10.93" fill="#0D47A1" font-weight="800"><tspan x="8.0" dy="0">BARLAVENTO</tspan></text><text x="8.0" y="48.29" font-size="7.87" fill="#0D47A1" font-weight="600"><tspan x="8.0" dy="0">lado de onde vem o vento</tspan></text><text x="461.0" y="38.75" font-size="10.93" fill="#C62828" font-weight="800" text-anchor="end"><tspan x="461.0" dy="0">SOTAVENTO</tspan></text><text x="461.0" y="48.29" font-size="7.87" fill="#C62828" font-weight="600" text-anchor="end"><tspan x="461.0" dy="0">lado “protegido” do vento</tspan></text><text x="58.0" y="176.61" font-size="8.27" fill="#0D47A1" font-weight="800" text-anchor="middle"><tspan x="58.0" dy="0">Oceano</tspan><tspan x="58.0" dy="9.09">(umidade)</tspan></text><text x="8.0" y="126.29" font-size="7.87" fill="#0D47A1" font-weight="800"><tspan x="8.0" dy="0">ar úmido sobe → esfria</tspan><tspan x="8.0" dy="8.81">≈ 0,6 °C a cada 100 m</tspan><tspan x="8.0" dy="8.81">→ vapor condensa → chove</tspan></text><text x="398.0" y="176.72" font-size="8.40" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="398.0" dy="0">SOMBRA DE CHUVA</tspan><tspan x="398.0" dy="9.41">clima mais seco</tspan></text><text x="206.0" y="172.61" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="206.0" dy="0">chuvas abundantes</tspan><tspan x="206.0" dy="9.26">vegetação úmida</tspan></text><text x="12.0" y="199.72" font-size="8.40" fill="#1D2330" font-weight="600"><tspan x="12.0" dy="0">O relevo obriga o ar úmido a subir: esfria, o vapor condensa e chove na encosta exposta ao vento</tspan><tspan x="12.0" dy="10.50">(barlavento). O ar chega seco ao outro lado (sotavento), desce e aquece: chuva escassa. Ex.: o Sertão, a</tspan><tspan x="12.0" dy="10.50">oeste do Planalto da Borborema.</tspan></text></svg>