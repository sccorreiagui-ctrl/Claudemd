<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348.0 182.0" role="img" aria-label="Compressão espaço-tempo" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Compressão espaço-tempo</title><text x="0.0" y="8.32" font-size="10.40" fill="#B23C00" font-weight="800"><tspan x="0.0" dy="0">Compressão espaço-tempo (D. Harvey)</tspan></text><text x="0.0" y="18.40" font-size="8.00" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">Rio de Janeiro ↔ Lisboa (≈ 7.700 km): a distância não muda; o tempo, sim</tspan></text><text x="0.0" y="40.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Nau/caravela (séc. XVI)</tspan></text><rect x="0.0" y="45.0" width="190.0" height="14.0" fill="#6D4C41" rx="3" /><text x="196.0" y="55.17" font-size="8.80" fill="#6D4C41" font-weight="800"><tspan x="196.0" dy="0">≈ 1,5–3 meses</tspan></text><text x="0.0" y="70.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Navio a vapor (início do séc. XX)</tspan></text><rect x="0.0" y="75.0" width="100.0" height="14.0" fill="#1565C0" rx="3" /><text x="106.0" y="85.17" font-size="8.80" fill="#1565C0" font-weight="800"><tspan x="106.0" dy="0">≈ 2–3 semanas</tspan></text><text x="0.0" y="100.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Avião a jato (hoje)</tspan></text><rect x="0.0" y="105.0" width="24.0" height="14.0" fill="#E65100" rx="3" /><text x="30.0" y="115.17" font-size="8.80" fill="#E65100" font-weight="800"><tspan x="30.0" dy="0">≈ 10 horas</tspan></text><text x="0.0" y="130.83" font-size="8.53" fill="#1D2330" font-weight="700"><tspan x="0.0" dy="0">Internet / videoconferência</tspan></text><rect x="0.0" y="135.0" width="5.0" height="14.0" fill="#7B3FA0" rx="3" /><text x="11.0" y="145.17" font-size="8.80" fill="#7B3FA0" font-weight="800"><tspan x="11.0" dy="0">instantâneo</tspan></text><text x="0.0" y="164.19" font-size="7.73" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">Tempos aproximados e ilustrativos. A “aldeia global” é desigual: nem todos têm acesso às</tspan><tspan x="0.0" dy="9.28">redes.</tspan></text></svg>