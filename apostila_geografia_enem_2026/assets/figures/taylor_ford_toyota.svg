<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 264.0" role="img" aria-label="Taylorismo, fordismo e toyotismo" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Taylorismo, fordismo e toyotismo</title><rect x="0.0" y="0.0" width="226.0" height="30.0" fill="#5E35B1" rx="6" /><text x="113.0" y="18.17" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="113.0" dy="0">TAYLORISMO</tspan></text><text x="113.0" y="27.40" font-size="8.00" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="113.0" dy="0">EUA, c. 1900–1911 (F. W. Taylor)</tspan></text><rect x="0.0" y="34.0" width="226.0" height="60.0" fill="#F5F7FA" rx="4" stroke="#D5DBE4" stroke-width="0.8" /><circle cx="83.0" cy="66.0" r="19.0" fill="#FFFFFF" stroke="#5E35B1" stroke-width="2.4"/><line x1="83.0" y1="66.0" x2="83.0" y2="53.0" stroke="#5E35B1" stroke-width="2.0" stroke-linecap="round"/><line x1="83.0" y1="66.0" x2="92.0" y2="70.0" stroke="#5E35B1" stroke-width="2.0" stroke-linecap="round"/><rect x="80.0" y="42.0" width="6.0" height="4.0" fill="#5E35B1" /><text x="117.0" y="64.40" font-size="8.00" fill="#5E35B1" font-weight="700"><tspan x="117.0" dy="0">cronômetro:</tspan><tspan x="117.0" dy="9.20">tempo e movimentos</tspan></text><rect x="0.0" y="100.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="0.0" y="100.0" width="46.0" height="33.0" fill="#5E35B1" rx="3" opacity="0.14" /><text x="23.0" y="119.62" font-size="8.67" fill="#5E35B1" font-weight="800" text-anchor="middle"><tspan x="23.0" dy="0">Ideia</tspan></text><text x="52.0" y="111.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="52.0" dy="0">Administração científica: máxima</tspan><tspan x="52.0" dy="9.91">eficiência individual</tspan></text><rect x="0.0" y="136.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="0.0" y="136.0" width="46.0" height="33.0" fill="#5E35B1" rx="3" opacity="0.14" /><text x="23.0" y="155.62" font-size="8.67" fill="#5E35B1" font-weight="800" text-anchor="middle"><tspan x="23.0" dy="0">Como</tspan></text><text x="52.0" y="147.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="52.0" dy="0">Cronometragem, divisão extrema de</tspan><tspan x="52.0" dy="9.91">tarefas, gestos “inúteis” eliminados</tspan></text><rect x="0.0" y="172.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="0.0" y="172.0" width="46.0" height="33.0" fill="#5E35B1" rx="3" opacity="0.14" /><text x="23.0" y="191.62" font-size="8.67" fill="#5E35B1" font-weight="800" text-anchor="middle"><tspan x="23.0" dy="0">Trabalho</tspan></text><text x="52.0" y="183.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="52.0" dy="0">Separa <tspan font-weight="700">pensar</tspan> (gerência) de <tspan font-weight="700">fazer</tspan></tspan><tspan x="52.0" dy="9.91">(operário); salário por produtividade</tspan></text><rect x="0.0" y="208.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="0.0" y="208.0" width="46.0" height="33.0" fill="#5E35B1" rx="3" opacity="0.14" /><text x="23.0" y="227.62" font-size="8.67" fill="#5E35B1" font-weight="800" text-anchor="middle"><tspan x="23.0" dy="0">Crítica</tspan></text><text x="52.0" y="219.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="52.0" dy="0">Alienação; trabalho repetitivo e</tspan><tspan x="52.0" dy="9.91">controlado</tspan></text><rect x="242.0" y="0.0" width="226.0" height="30.0" fill="#E65100" rx="6" /><text x="355.0" y="18.17" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.0" dy="0">FORDISMO</tspan></text><text x="355.0" y="27.40" font-size="8.00" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="355.0" dy="0">EUA, 1913 (H. Ford)</tspan></text><rect x="242.0" y="34.0" width="226.0" height="60.0" fill="#F5F7FA" rx="4" stroke="#D5DBE4" stroke-width="0.8" /><text x="355.0" y="45.40" font-size="8.00" fill="#E65100" font-weight="700" text-anchor="middle"><tspan x="355.0" dy="0">esteira de montagem</tspan></text><rect x="285.0" y="74.0" width="140.0" height="8.0" fill="#546E7A" rx="4" /><circle cx="295.0" cy="86.0" r="3.5" fill="#263238"/><circle cx="325.0" cy="86.0" r="3.5" fill="#263238"/><circle cx="355.0" cy="86.0" r="3.5" fill="#263238"/><circle cx="385.0" cy="86.0" r="3.5" fill="#263238"/><circle cx="415.0" cy="86.0" r="3.5" fill="#263238"/><rect x="305.0" y="58.0" width="18.0" height="14.0" fill="#E65100" rx="1.5" /><rect x="349.0" y="58.0" width="18.0" height="14.0" fill="#E65100" rx="1.5" /><rect x="393.0" y="58.0" width="18.0" height="14.0" fill="#E65100" rx="1.5" /><rect x="242.0" y="100.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="242.0" y="100.0" width="46.0" height="33.0" fill="#E65100" rx="3" opacity="0.14" /><text x="265.0" y="119.62" font-size="8.67" fill="#E65100" font-weight="800" text-anchor="middle"><tspan x="265.0" dy="0">Ideia</tspan></text><text x="294.0" y="111.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="294.0" dy="0">Produção <tspan font-weight="700">em massa</tspan> de produtos</tspan><tspan x="294.0" dy="9.91">padronizados</tspan></text><rect x="242.0" y="136.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="242.0" y="136.0" width="46.0" height="33.0" fill="#E65100" rx="3" opacity="0.14" /><text x="265.0" y="155.62" font-size="8.67" fill="#E65100" font-weight="800" text-anchor="middle"><tspan x="265.0" dy="0">Como</tspan></text><text x="294.0" y="147.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="294.0" dy="0"><tspan font-weight="700">Linha de montagem</tspan> (esteira) +</tspan><tspan x="294.0" dy="9.91">taylorismo; grandes estoques; “qualquer</tspan><tspan x="294.0" dy="9.91">cor, desde que preta”</tspan></text><rect x="242.0" y="172.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="242.0" y="172.0" width="46.0" height="33.0" fill="#E65100" rx="3" opacity="0.14" /><text x="265.0" y="191.62" font-size="8.67" fill="#E65100" font-weight="800" text-anchor="middle"><tspan x="265.0" dy="0">Trabalho</tspan></text><text x="294.0" y="183.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="294.0" dy="0">Salários maiores e jornada de 8 h para</tspan><tspan x="294.0" dy="9.91">formar consumidores de massa</tspan></text><rect x="242.0" y="208.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="242.0" y="208.0" width="46.0" height="33.0" fill="#E65100" rx="3" opacity="0.14" /><text x="265.0" y="227.62" font-size="8.67" fill="#E65100" font-weight="800" text-anchor="middle"><tspan x="265.0" dy="0">Crise</tspan></text><text x="294.0" y="219.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="294.0" dy="0">Anos 1970: saturação, rigidez e choques</tspan><tspan x="294.0" dy="9.91">do petróleo</tspan></text><rect x="484.0" y="0.0" width="226.0" height="30.0" fill="#1565C0" rx="6" /><text x="597.0" y="18.17" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="597.0" dy="0">TOYOTISMO</tspan></text><text x="597.0" y="27.40" font-size="8.00" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="597.0" dy="0">Japão, pós-1950 (T. Ohno)</tspan></text><rect x="484.0" y="34.0" width="226.0" height="60.0" fill="#F5F7FA" rx="4" stroke="#D5DBE4" stroke-width="0.8" /><text x="597.0" y="45.40" font-size="8.00" fill="#1565C0" font-weight="700" text-anchor="middle"><tspan x="597.0" dy="0">Just-in-time (puxado pela demanda)</tspan></text><rect x="519.0" y="54.0" width="48.0" height="28.0" fill="#FFFFFF" rx="3" stroke="#1565C0" stroke-width="1.4" /><text x="543.0" y="70.98" font-size="8.27" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="543.0" dy="0">demanda</tspan></text><line x1="567.0" y1="68.0" x2="568.5" y2="68.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="butt"/><polygon points="573.0,68.0 568.5,70.8 568.5,65.2" fill="#1565C0"/><rect x="573.0" y="54.0" width="48.0" height="28.0" fill="#FFFFFF" rx="3" stroke="#1565C0" stroke-width="1.4" /><text x="597.0" y="70.98" font-size="8.27" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="597.0" dy="0">kanban</tspan></text><line x1="621.0" y1="68.0" x2="622.5" y2="68.0" stroke="#1565C0" stroke-width="1.4" stroke-linecap="butt"/><polygon points="627.0,68.0 622.5,70.8 622.5,65.2" fill="#1565C0"/><rect x="627.0" y="54.0" width="48.0" height="28.0" fill="#FFFFFF" rx="3" stroke="#1565C0" stroke-width="1.4" /><text x="651.0" y="70.98" font-size="8.27" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="651.0" dy="0">produção</tspan></text><rect x="484.0" y="100.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="484.0" y="100.0" width="46.0" height="33.0" fill="#1565C0" rx="3" opacity="0.14" /><text x="507.0" y="119.62" font-size="8.67" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="507.0" dy="0">Ideia</tspan></text><text x="536.0" y="111.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="536.0" dy="0">Produção <tspan font-weight="700">flexível</tspan> e enxuta (acumulação</tspan><tspan x="536.0" dy="9.91">flexível)</tspan></text><rect x="484.0" y="136.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="484.0" y="136.0" width="46.0" height="33.0" fill="#1565C0" rx="3" opacity="0.14" /><text x="507.0" y="155.62" font-size="8.67" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="507.0" dy="0">Como</tspan></text><text x="536.0" y="147.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="536.0" dy="0"><tspan font-weight="700">Just-in-time</tspan>, kanban, estoque mínimo,</tspan><tspan x="536.0" dy="9.91">controle de qualidade total</tspan></text><rect x="484.0" y="172.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="484.0" y="172.0" width="46.0" height="33.0" fill="#1565C0" rx="3" opacity="0.14" /><text x="507.0" y="191.62" font-size="8.67" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="507.0" dy="0">Trabalho</tspan></text><text x="536.0" y="183.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="536.0" dy="0">Operário <tspan font-weight="700">polivalente</tspan>, equipes;</tspan><tspan x="536.0" dy="9.91">terceirização e rede de fornecedores</tspan></text><rect x="484.0" y="208.0" width="226.0" height="33.0" fill="#FFFFFF" rx="3" stroke="#E3E8EE" stroke-width="0.8" /><rect x="484.0" y="208.0" width="46.0" height="33.0" fill="#1565C0" rx="3" opacity="0.14" /><text x="507.0" y="227.62" font-size="8.67" fill="#1565C0" font-weight="800" text-anchor="middle"><tspan x="507.0" dy="0">Efeitos</tspan></text><text x="536.0" y="219.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="536.0" dy="0">Precarização, fragmentação sindical,</tspan><tspan x="536.0" dy="9.91">produtos personalizados</tspan></text><text x="355.5" y="255.17" font-size="8.80" fill="#5D3A1A" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">Fordismo = taylorismo + esteira + consumo de massa  ·  Toyotismo = flexibilidade, polivalência e terceirização.</tspan></text></svg>