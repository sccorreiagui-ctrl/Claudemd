<tspan x="0.0" dy="0">Destino da água da chuva (valores de referência didática; FISRWG, 1998; % do total)</tspan></text><rect x="150.0" y="120.0" width="10.0" height="8.0" fill="#1565C0" /><text x="164.0" y="124.40" font-size="8.00" fill="#1D2330" font-weight="700"><tspan x="164.0" dy="0">escoamento superficial</tspan></text><rect x="300.0" y="120.0" width="10.0" height="8.0" fill="#2E7D32" /><text x="314.0" y="124.40" font-size="8.00" fill="#1D2330" font-weight="700"><tspan x="314.0" dy="0">infiltração</tspan></text><rect x="450.0" y="120.0" width="10.0" height="8.0" fill="#81C784" /><text x="464.0" y="124.40" font-size="8.00" fill="#1D2330" font-weight="700"><tspan x="464.0" dy="0">evapotranspiração</tspan></text><text x="0.0" y="146.04" font-size="8.80" fill="#1D2330" font-weight="800"><tspan x="0.0" dy="0">Cobertura natural</tspan></text><rect x="150.0" y="136.0" width="52.0" height="20.0" fill="#1565C0" /><text x="176.0" y="149.36" font-size="9.33" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="176.0" dy="0">10%</tspan></text><rect x="202.0" y="136.0" width="260.0" height="20.0" fill="#2E7D32" /><text x="332.0" y="149.36" font-size="9.33" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="332.0" dy="0">50%</tspan></text><rect x="462.0" y="136.0" width="208.0" height="20.0" fill="#81C784" /><text x="566.0" y="149.36" font-size="9.33" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="566.0" dy="0">40%</tspan></text><text x="0.0" y="174.04" font-size="8.80" fill="#1D2330" font-weight="800"><tspan x="0.0" dy="0">75–100% impermeabilizado</tspan></text><rect x="150.0" y="164.0" width="286.0" height="20.0" fill="#1565C0" /><text x="293.0" y="177.36" font-size="9.33" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="293.0" dy="0">55%</tspan></text><rect x="436.0" y="164.0" width="78.0" height="20.0" fill="#2E7D32" /><text x="475.0" y="177.36" font-size="9.33" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="475.0" dy="0">15%</tspan></text><rect x="514.0" y="164.0" width="156.0" height="20.0" fill="#81C784" /><text x="592.0" y="177.36" font-size="9.33" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="592.0" dy="0">30%</tspan></text><text x="0.0" y="196.61" font-size="8.27" fill="#5D3A1A" font-weight="700"><tspan x="0.0" dy="0">Consequência: muita água escoa de uma vez por ruas e bueiros → galerias sobrecarregadas, rios retificados e assoreados → enchentes, alagamentos e inundações.</tspan></text><text x="0.0" y="206.61" font-size="8.27" fill="#1D2330" font-weight="600"><tspan x="0.0" dy="0">Soluções: pavimento permeável, parques lineares, jardins de chuva, telhados verdes, reservatórios (“piscinões”) e preservação de várzeas.</tspan></text></svg>