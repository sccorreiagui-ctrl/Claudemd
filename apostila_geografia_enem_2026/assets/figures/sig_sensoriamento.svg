<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 178.0" role="img" aria-label="GNSS, sensoriamento remoto e SIG" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>GNSS, sensoriamento remoto e SIG</title><rect x="0.0" y="0.0" width="226.0" height="22.0" fill="#1565C0" rx="5" /><text x="8.0" y="14.26" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="8.0" dy="0">1 · GNSS / GPS</tspan></text><text x="218.0" y="13.88" font-size="8.00" fill="#FFFFFF" font-weight="600" text-anchor="end"><tspan x="218.0" dy="0">posição na Terra</tspan></text><rect x="0.0" y="26.0" width="226.0" height="104.0" fill="#F7FAFD" rx="4" stroke="#D5DBE4" stroke-width="0.8" /><rect x="242.0" y="0.0" width="226.0" height="22.0" fill="#2E7D32" rx="5" /><text x="250.0" y="14.26" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="250.0" dy="0">2 · SENSORIAMENTO REMOTO</tspan></text><text x="460.0" y="13.88" font-size="8.00" fill="#FFFFFF" font-weight="600" text-anchor="end"><tspan x="460.0" dy="0">dados à distância</tspan></text><rect x="242.0" y="26.0" width="226.0" height="104.0" fill="#F6FBF6" rx="4" stroke="#D5DBE4" stroke-width="0.8" /><rect x="484.0" y="0.0" width="226.0" height="22.0" fill="#E65100" rx="5" /><text x="492.0" y="14.26" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="492.0" dy="0">3 · SIG (GIS)</tspan></text><text x="702.0" y="13.88" font-size="8.00" fill="#FFFFFF" font-weight="600" text-anchor="end"><tspan x="702.0" dy="0">camadas e análise</tspan></text><rect x="484.0" y="26.0" width="226.0" height="104.0" fill="#FFF8F2" rx="4" stroke="#D5DBE4" stroke-width="0.8" /><path d="M10,130 Q113,84 216,130" fill="none" stroke="#5B6475" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="11.0" y="118.0" width="204.0" height="12.0" fill="#CFE3C0" /><circle cx="113.0" cy="104.0" r="4.0" fill="#C62828"/><rect x="110.0" y="103.0" width="6.0" height="8.0" fill="#C62828" /><rect x="34.0" y="41.0" width="12.0" height="6.0" fill="#1565C0" rx="1" /><rect x="26.0" y="42.5" width="7.0" height="3.0" fill="#90CAF9" /><rect x="47.0" y="42.5" width="7.0" height="3.0" fill="#90CAF9" /><line x1="40.0" y1="47.0" x2="113.0" y2="100.0" stroke="#1565C0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="94.0" y="33.0" width="12.0" height="6.0" fill="#1565C0" rx="1" /><rect x="86.0" y="34.5" width="7.0" height="3.0" fill="#90CAF9" /><rect x="107.0" y="34.5" width="7.0" height="3.0" fill="#90CAF9" /><line x1="100.0" y1="39.0" x2="113.0" y2="100.0" stroke="#1565C0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="154.0" y="43.0" width="12.0" height="6.0" fill="#1565C0" rx="1" /><rect x="146.0" y="44.5" width="7.0" height="3.0" fill="#90CAF9" /><rect x="167.0" y="44.5" width="7.0" height="3.0" fill="#90CAF9" /><line x1="160.0" y1="49.0" x2="113.0" y2="100.0" stroke="#1565C0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="190.0" y="67.0" width="12.0" height="6.0" fill="#1565C0" rx="1" /><rect x="182.0" y="68.5" width="7.0" height="3.0" fill="#90CAF9" /><rect x="203.0" y="68.5" width="7.0" height="3.0" fill="#90CAF9" /><line x1="196.0" y1="73.0" x2="113.0" y2="100.0" stroke="#1565C0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 2"/><text x="113.0" y="118.19" font-size="7.73" fill="#B71C1C" font-weight="800" text-anchor="middle"><tspan x="113.0" dy="0">receptor</tspan></text><text x="8.0" y="140.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0">O receptor mede o tempo de viagem do sinal de <tspan font-weight="700">≥ 4</tspan></tspan><tspan x="8.0" dy="9.60"><tspan font-weight="700">satélites</tspan> e calcula latitude, longitude e altitude.</tspan><tspan x="8.0" dy="9.60">Sistemas: GPS (EUA), GLONASS (Rússia), Galileo (UE),</tspan><tspan x="8.0" dy="9.60">BeiDou (China).</tspan></text><circle cx="432.0" cy="44.0" r="9.0" fill="#FFD54F" stroke="#F9A825" stroke-width="1"/><line x1="444.0" y1="44.0" x2="449.0" y2="44.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="440.5" y1="52.5" x2="444.0" y2="56.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="432.0" y1="56.0" x2="432.0" y2="61.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="423.5" y1="52.5" x2="420.0" y2="56.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="420.0" y1="44.0" x2="415.0" y2="44.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="423.5" y1="35.5" x2="420.0" y2="32.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="432.0" y1="32.0" x2="432.0" y2="27.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><line x1="440.5" y1="35.5" x2="444.0" y2="32.0" stroke="#F9A825" stroke-width="1" stroke-linecap="round"/><rect x="315.0" y="36.0" width="14.0" height="8.0" fill="#2E7D32" rx="1" /><rect x="302.0" y="38.0" width="11.0" height="4.0" fill="#A5D6A7" /><rect x="331.0" y="38.0" width="11.0" height="4.0" fill="#A5D6A7" /><polygon points="316.0,45.0 328.0,45.0 392.0,118.0 272.0,118.0" fill="#C8E6C9" opacity="0.45"/><line x1="424.0" y1="54.0" x2="362.0" y2="108.0" stroke="#F9A825" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><line x1="362.0" y1="108.0" x2="336.0" y2="54.1" stroke="#F9A825" stroke-width="1.2" stroke-linecap="butt"/><polygon points="334.0,50.0 338.4,52.9 333.5,55.2" fill="#F9A825"/><line x1="334.0" y1="48.0" x2="289.2" y2="107.7" stroke="#C62828" stroke-width="1.4" stroke-linecap="butt"/><polygon points="286.0,112.0 286.6,105.7 291.9,109.7" fill="#C62828"/><line x1="294.0" y1="112.0" x2="328.0" y2="52.0" stroke="#C62828" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="254.0" y="118.0" width="204.0" height="10.0" fill="#D7CCC8" /><rect x="284.7" y="110.8" width="2.6" height="7.2" fill="#8D5B2E" /><circle cx="286.0" cy="106.8" r="6.4" fill="#2E7D32"/><rect x="342.0" y="119.0" width="36.0" height="8.0" fill="#90CAF9" /><rect x="402.0" y="112.0" width="14.0" height="16.0" fill="#90A4AE" /><rect x="419.0" y="108.0" width="12.0" height="20.0" fill="#78909C" /><text x="392.0" y="67.97" font-size="7.47" fill="#B26A00" font-weight="700"><tspan x="392.0" dy="0">sensor passivo:</tspan><tspan x="392.0" dy="8.21">luz solar refletida</tspan></text><text x="256.0" y="65.97" font-size="7.47" fill="#8E1B1B" font-weight="700"><tspan x="256.0" dy="0">sensor ativo</tspan><tspan x="256.0" dy="8.21">(radar): emite e</tspan><tspan x="256.0" dy="8.21">recebe o sinal</tspan></text><text x="250.0" y="140.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="250.0" dy="0">Cada alvo (vegetação, água, solo, cidade) reflete a</tspan><tspan x="250.0" dy="9.60">energia de um modo. <tspan font-weight="700">Resolução espacial:</tspan> menor</tspan><tspan x="250.0" dy="9.60">objeto distinguível; <tspan font-weight="700">temporal:</tspan> intervalo entre</tspan><tspan x="250.0" dy="9.60">passagens. O radar atravessa nuvens.</tspan></text><polygon points="524.0,122.0 634.0,122.0 674.0,104.0 564.0,104.0" fill="#CE93D8" stroke="#5B6475" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><text x="652.0" y="120.19" font-size="7.73" fill="#37474F" font-weight="800"><tspan x="652.0" dy="0">população</tspan></text><polygon points="524.0,104.0 634.0,104.0 674.0,86.0 564.0,86.0" fill="#A5D6A7" stroke="#5B6475" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><text x="652.0" y="102.19" font-size="7.73" fill="#37474F" font-weight="800"><tspan x="652.0" dy="0">uso do solo</tspan></text><polygon points="524.0,86.0 634.0,86.0 674.0,68.0 564.0,68.0" fill="#90CAF9" stroke="#5B6475" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><text x="652.0" y="84.19" font-size="7.73" fill="#37474F" font-weight="800"><tspan x="652.0" dy="0">hidrografia</tspan></text><polygon points="524.0,68.0 634.0,68.0 674.0,50.0 564.0,50.0" fill="#D7B98E" stroke="#5B6475" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><text x="652.0" y="66.19" font-size="7.73" fill="#37474F" font-weight="800"><tspan x="652.0" dy="0">relevo</tspan></text><text x="494.0" y="42.19" font-size="7.73" fill="#B23C00" font-weight="700"><tspan x="494.0" dy="0">camadas georreferenciadas</tspan><tspan x="494.0" dy="8.51">sobrepostas (overlay)</tspan></text><line x1="596.0" y1="50.0" x2="596.0" y2="57.5" stroke="#B23C00" stroke-width="1.4" stroke-linecap="butt"/><polygon points="596.0,62.0 593.2,57.5 598.8,57.5" fill="#B23C00"/><text x="492.0" y="140.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="492.0" dy="0">O SIG integra bancos de dados e mapas em camadas</tspan><tspan x="492.0" dy="9.60">e permite <tspan font-weight="700">cruzar variáveis</tspan> (ex.: declividade × chuva ×</tspan><tspan x="492.0" dy="9.60">ocupação = áreas de risco). Usos: planejamento</tspan><tspan x="492.0" dy="9.60">urbano, agricultura de precisão, gestão ambiental.</tspan></text></svg>