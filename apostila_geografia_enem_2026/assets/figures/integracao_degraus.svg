<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 200.0" role="img" aria-label="Etapas da integração econômica regional" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Etapas da integração econômica regional</title><text x="0.0" y="7.89" font-size="9.87" fill="#37474F" font-weight="800"><tspan x="0.0" dy="0">Quanto mais alto o degrau, maior a integração e a perda de autonomia nacional (supranacionalidade)</tspan></text><rect x="0.0" y="80.0" width="168.0" height="84.0" fill="#2E7D32" rx="5" /><text x="8.0" y="94.25" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="8.0" dy="0">1. ZONA DE LIVRE COMÉRCIO</tspan></text><text x="8.0" y="108.04" font-size="8.27" fill="#FFFFFF" font-weight="500"><tspan x="8.0" dy="0">Elimina tarifas entre os membros;</tspan><tspan x="8.0" dy="9.92">cada país mantém a sua tarifa</tspan><tspan x="8.0" dy="9.92">externa.</tspan></text><text x="8.0" y="144.40" font-size="8.00" fill="#FFFFFF" font-weight="800"><tspan x="8.0" dy="0">USMCA (ex-NAFTA): EUA, México e</tspan><tspan x="8.0" dy="9.20">Canadá</tspan></text><rect x="180.7" y="61.0" width="168.0" height="103.0" fill="#1565C0" rx="5" /><text x="188.7" y="75.25" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="188.7" dy="0">2. UNIÃO ADUANEIRA</tspan></text><text x="188.7" y="89.04" font-size="8.27" fill="#FFFFFF" font-weight="500"><tspan x="188.7" dy="0">Livre comércio interno + <tspan font-weight="700">Tarifa</tspan></tspan><tspan x="188.7" dy="9.92"><tspan font-weight="700">Externa Comum (TEC)</tspan>.</tspan></text><text x="188.7" y="144.40" font-size="8.00" fill="#FFFFFF" font-weight="800"><tspan x="188.7" dy="0">Mercosul (imperfeita: há exceções à</tspan><tspan x="188.7" dy="9.20">TEC)</tspan></text><rect x="361.4" y="42.0" width="168.0" height="122.0" fill="#C04A00" rx="5" /><text x="369.4" y="56.25" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="369.4" dy="0">3. MERCADO COMUM</tspan></text><text x="369.4" y="70.04" font-size="8.27" fill="#FFFFFF" font-weight="500"><tspan x="369.4" dy="0">União aduaneira + livre circulação de</tspan><tspan x="369.4" dy="9.92"><tspan font-weight="700">pessoas, capitais e serviços</tspan>.</tspan></text><text x="369.4" y="144.40" font-size="8.00" fill="#FFFFFF" font-weight="800"><tspan x="369.4" dy="0">União Europeia (mercado único)</tspan></text><rect x="542.1" y="23.0" width="168.0" height="141.0" fill="#7B3FA0" rx="5" /><text x="550.1" y="37.25" font-size="9.07" fill="#FFFFFF" font-weight="800"><tspan x="550.1" dy="0">4. UNIÃO ECONÔMICA E</tspan><tspan x="550.1" dy="10.43">MONETÁRIA</tspan></text><text x="550.1" y="61.47" font-size="8.27" fill="#FFFFFF" font-weight="500"><tspan x="550.1" dy="0">Mercado comum + <tspan font-weight="700">moeda única</tspan>,</tspan><tspan x="550.1" dy="9.92">banco central e políticas econômicas</tspan><tspan x="550.1" dy="9.92">coordenadas.</tspan></text><text x="550.1" y="144.40" font-size="8.00" fill="#FFFFFF" font-weight="800"><tspan x="550.1" dy="0">UE: países da zona do euro</tspan></text><rect x="0.0" y="170.0" width="711.0" height="28.0" fill="#F5F7FA" rx="4" /><text x="355.5" y="181.83" font-size="8.53" fill="#37474F" font-weight="700" text-anchor="middle"><tspan x="355.5" dy="0"><tspan font-weight="800">Protecionismo:</tspan> tarifas e barreiras não tarifárias (cotas, subsídios, exigências técnicas e sanitárias)  ×  <tspan font-weight="800">livre-comércio</tspan> (a OMC busca reduzir as barreiras).</tspan></text></svg>