<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 214.0" role="img" aria-label="Terceirização e terciarização" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Terceirização e terciarização</title><rect x="0.0" y="0.0" width="348.5" height="22.0" fill="#E65100" rx="5" /><text x="174.2" y="14.26" font-size="9.07" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="174.2" dy="0">TERCEIRIZAÇÃO (organização do trabalho)</tspan></text><rect x="362.5" y="0.0" width="348.5" height="22.0" fill="#1565C0" rx="5" /><text x="536.8" y="14.26" font-size="9.07" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="536.8" dy="0">TERCIARIZAÇÃO (estrutura da economia)</tspan></text><rect x="0.0" y="24.0" width="348.5" height="132.0" fill="#FFF8F2" rx="4" stroke="#F2D6BF" stroke-width="0.8" /><rect x="362.5" y="24.0" width="348.5" height="132.0" fill="#F4F9FE" rx="4" stroke="#CFE2F3" stroke-width="0.8" /><rect x="14.0" y="38.0" width="124.0" height="30.0" fill="#FFF0E0" rx="5" stroke="#E65100" stroke-width="1.2" /><text x="76.0" y="54.76" font-size="8.80" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="76.0" dy="0">Empresa contratante</tspan></text><rect x="208.0" y="38.0" width="124.0" height="30.0" fill="#FFF0E0" rx="5" stroke="#E65100" stroke-width="1.2" /><text x="270.0" y="54.76" font-size="8.80" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="270.0" dy="0">Empresa terceirizada</tspan></text><line x1="140.0" y1="53.0" x2="197.7" y2="53.0" stroke="#B23C00" stroke-width="1.8" stroke-linecap="butt"/><polygon points="204.0,53.0 197.7,56.9 197.7,49.1" fill="#B23C00"/><text x="172.0" y="46.19" font-size="7.73" fill="#B23C00" font-weight="700" text-anchor="middle"><tspan x="172.0" dy="0">contrato</tspan></text><circle cx="232.0" cy="96.0" r="6.0" fill="#E65100"/><line x1="232.0" y1="102.0" x2="232.0" y2="118.0" stroke="#E65100" stroke-width="2" stroke-linecap="round"/><line x1="226.0" y1="108.0" x2="238.0" y2="108.0" stroke="#E65100" stroke-width="2" stroke-linecap="round"/><circle cx="266.0" cy="96.0" r="6.0" fill="#E65100"/><line x1="266.0" y1="102.0" x2="266.0" y2="118.0" stroke="#E65100" stroke-width="2" stroke-linecap="round"/><line x1="260.0" y1="108.0" x2="272.0" y2="108.0" stroke="#E65100" stroke-width="2" stroke-linecap="round"/><circle cx="300.0" cy="96.0" r="6.0" fill="#E65100"/><line x1="300.0" y1="102.0" x2="300.0" y2="118.0" stroke="#E65100" stroke-width="2" stroke-linecap="round"/><line x1="294.0" y1="108.0" x2="306.0" y2="108.0" stroke="#E65100" stroke-width="2" stroke-linecap="round"/><line x1="270.0" y1="70.0" x2="270.0" y2="88.0" stroke="#B23C00" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="14.0" y="86.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="14.0" dy="0">Reduz custos e transfere</tspan><tspan x="14.0" dy="9.60">responsabilidades trabalhistas; pode</tspan><tspan x="14.0" dy="9.60">precarizar salários e direitos.</tspan></text><text x="14.0" y="140.29" font-size="7.87" fill="#B23C00" font-weight="700"><tspan x="14.0" dy="0">O trabalhador tem vínculo com a terceirizada, não com a contratante.</tspan></text><text x="536.8" y="35.40" font-size="8.00" fill="#0D47A1" font-weight="700" text-anchor="middle"><tspan x="536.8" dy="0">Participação dos setores (esquema ilustrativo)</tspan></text><rect x="380.5" y="106.0" width="90.0" height="22.0" fill="#1565C0" /><text x="425.5" y="119.88" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="425.5" dy="0">terciário</tspan></text><rect x="380.5" y="92.8" width="90.0" height="13.2" fill="#E65100" /><text x="425.5" y="102.28" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="425.5" dy="0">secundário</tspan></text><rect x="380.5" y="40.0" width="90.0" height="52.8" fill="#8D5B2E" /><text x="425.5" y="69.28" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="425.5" dy="0">primário</tspan></text><text x="425.5" y="136.76" font-size="7.20" fill="#1D2330" font-weight="800" text-anchor="middle"><tspan x="425.5" dy="0">início (economia agrária)</tspan></text><rect x="490.5" y="88.4" width="90.0" height="39.6" fill="#1565C0" /><text x="535.5" y="111.08" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="535.5" dy="0">terciário</tspan></text><rect x="490.5" y="57.6" width="90.0" height="30.8" fill="#E65100" /><text x="535.5" y="75.88" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="535.5" dy="0">secundário</tspan></text><rect x="490.5" y="40.0" width="90.0" height="17.6" fill="#8D5B2E" /><text x="535.5" y="51.68" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="535.5" dy="0">primário</tspan></text><text x="535.5" y="136.76" font-size="7.20" fill="#1D2330" font-weight="800" text-anchor="middle"><tspan x="535.5" dy="0">meio (auge industrial)</tspan></text><rect x="600.5" y="66.4" width="90.0" height="61.6" fill="#1565C0" /><text x="645.5" y="100.08" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="645.5" dy="0">terciário</tspan></text><rect x="600.5" y="47.0" width="90.0" height="19.4" fill="#E65100" /><text x="645.5" y="59.60" font-size="8.00" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="645.5" dy="0">secundário</tspan></text><rect x="600.5" y="40.0" width="90.0" height="7.0" fill="#8D5B2E" /><text x="645.5" y="136.76" font-size="7.20" fill="#1D2330" font-weight="800" text-anchor="middle"><tspan x="645.5" dy="0">hoje (economia de serviços)</tspan></text><text x="536.8" y="148.19" font-size="7.73" fill="#0D47A1" font-weight="800" text-anchor="middle"><tspan x="536.8" dy="0">Cresce o peso de comércio e serviços no PIB e no emprego</tspan></text><rect x="0.0" y="162.0" width="711.0" height="48.0" fill="#F5F7FA" rx="4" /><text x="8.0" y="173.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0"><tspan font-weight="700">Terceirização:</tspan> transferência de atividades a outra empresa. <tspan font-weight="700">Terciarização:</tspan> aumento do peso do setor terciário (comércio e serviços) na economia. No Brasil, a Lei</tspan><tspan x="8.0" dy="10.25">13.429/2017 e a Reforma Trabalhista (Lei 13.467/2017) ampliaram a terceirização; em 2018, o STF a validou também para atividades-fim. <tspan font-weight="700">Não confundir:</tspan> terceirização é uma</tspan><tspan x="8.0" dy="10.25">forma de contratar; terciarização é uma mudança estrutural.</tspan></text></svg>