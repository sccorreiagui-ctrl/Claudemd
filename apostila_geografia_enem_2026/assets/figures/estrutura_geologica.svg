<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 214.0" role="img" aria-label="Escudo cristalino, bacia sedimentar e dobramentos modernos" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Escudo cristalino, bacia sedimentar e dobramentos modernos</title><rect x="0.0" y="0.0" width="711.0" height="214.0" fill="#FFFFFF" /><rect x="0.0" y="28.0" width="711.0" height="150.0" fill="#EAF4FC" /><polygon points="0.0,92.0 60.0,70.0 150.0,66.0 210.0,92.0 232.0,150.0 0.0,150.0" fill="#B07A8A" stroke="#7C4A5A" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M20,100 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><path d="M60,118 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><path d="M110,96 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><path d="M150,124 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><path d="M190,108 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><path d="M90,138 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><path d="M30,134 q10,-6 20,0 q6,6 -4,10" fill="none" stroke="#6A3B4B" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><text x="112.0" y="40.11" font-size="10.13" fill="#6A3B4B" font-weight="800" text-anchor="middle"><tspan x="112.0" dy="0">ESCUDO CRISTALINO (Pré-Cambriano)</tspan></text><text x="112.0" y="50.40" font-size="8.00" fill="#6A3B4B" font-weight="600" text-anchor="middle"><tspan x="112.0" dy="0">rochas magmáticas e metamórficas</tspan><tspan x="112.0" dy="9.20">relevo desgastado e antigo</tspan></text><text x="112.0" y="106.61" font-size="8.27" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="112.0" dy="0">granito · gnaisse</tspan></text><text x="112.0" y="118.29" font-size="7.87" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="112.0" dy="0">minerais metálicos: ferro,</tspan><tspan x="112.0" dy="8.65">manganês, ouro, bauxita</tspan></text><line x1="196.0" y1="72.0" x2="237.7" y2="94.6" stroke="#1E88E5" stroke-width="2.2" stroke-linecap="butt"/><polygon points="244.0,98.0 235.6,98.4 239.8,90.7" fill="#1E88E5"/><text x="204.0" y="52.29" font-size="7.87" fill="#0D47A1" font-weight="800" text-anchor="middle" font-style="italic"><tspan x="204.0" dy="0">erosão e</tspan><tspan x="204.0" dy="8.65">transporte</tspan></text><polygon points="236.0,108.0 310.0,126.0 410.0,134.0 500.0,126.0 560.0,108.0 560.0,178.0 236.0,178.0" fill="#E9D7B0" stroke="#A68A55" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M242,116 C 310,126 410,132 500,126 S 552,116 556,112" fill="none" stroke="#D8C08A" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round" opacity="0.95" /><path d="M242,132 C 310,142 410,148 500,142 S 552,132 556,128" fill="none" stroke="#C9AB6F" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round" opacity="0.95" /><path d="M242,146 C 310,156 410,162 500,156 S 552,146 556,142" fill="none" stroke="#B8955A" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round" opacity="0.95" /><text x="398.0" y="40.11" font-size="10.13" fill="#6D4C41" font-weight="800" text-anchor="middle"><tspan x="398.0" dy="0">BACIA SEDIMENTAR (Paleozoico–Cenozoico)</tspan></text><text x="398.0" y="50.40" font-size="8.00" fill="#6D4C41" font-weight="600" text-anchor="middle"><tspan x="398.0" dy="0">sedimentos compactados em camadas · relevo mais baixo</tspan></text><path d="M342,148 q8,-14 8,-6 q0,8 -8,6 z" fill="#2B2B2B" /><path d="M368,150 q8,-14 8,-6 q0,8 -8,6 z" fill="#2B2B2B" /><text x="386.0" y="152.40" font-size="8.00" fill="#2B2B2B" font-weight="800"><tspan x="386.0" dy="0">petróleo e gás</tspan></text><rect x="290.0" y="162.0" width="160.0" height="12.0" fill="#90CAF9" opacity="0.9" /><text x="370.0" y="170.78" font-size="7.73" fill="#0D47A1" font-weight="800" text-anchor="middle"><tspan x="370.0" dy="0">aquífero (rocha porosa com água)</tspan></text><circle cx="470.0" cy="112.0" r="2.8" fill="#2B2B2B"/><text x="478.0" y="112.40" font-size="8.00" fill="#2B2B2B" font-weight="800"><tspan x="478.0" dy="0">carvão</tspan></text><path d="M492,140 q6,-6 12,0 q-6,6 -12,0 z" fill="#FFFFFF" stroke="#6D4C41" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" /><text x="508.0" y="142.40" font-size="8.00" fill="#6D4C41" font-weight="700" font-style="italic"><tspan x="508.0" dy="0">fósseis</tspan></text><polygon points="584.0,150.0 616.0,96.0 636.0,118.0 652.0,100.0 704.0,150.0" fill="#C9C9C9" stroke="#8A8A8A" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 2"/><text x="645.0" y="39.25" font-size="9.07" fill="#7A7A7A" font-weight="800" text-anchor="middle"><tspan x="645.0" dy="0">DOBRAMENTOS MODERNOS</tspan></text><text x="645.0" y="50.08" font-size="7.60" fill="#7A7A7A" font-weight="600" text-anchor="middle"><tspan x="645.0" dy="0">Cenozoico: Andes, Himalaia</tspan></text><text x="645.0" y="60.08" font-size="7.60" fill="#C62828" font-weight="800" text-anchor="middle"><tspan x="645.0" dy="0">ausentes no território brasileiro</tspan></text><line x1="596.0" y1="70.0" x2="700.0" y2="146.0" stroke="#C62828" stroke-width="1.6" stroke-linecap="round"/><line x1="700.0" y1="70.0" x2="596.0" y2="146.0" stroke="#C62828" stroke-width="1.6" stroke-linecap="round"/><rect x="0.0" y="178.0" width="711.0" height="36.0" fill="#F4EBE0" /><text x="8.0" y="189.72" font-size="8.40" fill="#5D3A1A" font-weight="800"><tspan x="8.0" dy="0">Brasil: no centro da Placa Sul-Americana (tectonicamente estável) → escudos e bacias; sem dobramentos modernos nem vulcanismo ativo.</tspan></text><text x="8.0" y="202.72" font-size="8.40" fill="#5D3A1A" font-weight="600"><tspan x="8.0" dy="0">Recursos associados: escudos → minerais metálicos · bacias → combustíveis fósseis (petróleo, gás, carvão) e grandes aquíferos.</tspan></text></svg>