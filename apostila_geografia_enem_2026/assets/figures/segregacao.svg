60.0" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="422.0" y="55.6" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="444.0" y="51.2" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="466.0" y="46.8" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="488.0" y="42.4" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="510.0" y="38.0" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="532.0" y="33.6" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="554.0" y="29.2" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="576.0" y="24.8" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="598.0" y="20.4" width="15.0" height="12.0" fill="#D7A86E" stroke="#8C5E2B" stroke-width="0.7" /><rect x="300.0" y="58.0" width="14.0" height="12.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><polygon points="299.0,58.0 307.0,52.0 315.0,58.0" fill="#B2493A"/><rect x="318.0" y="58.0" width="14.0" height="12.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><polygon points="317.0,58.0 325.0,52.0 333.0,58.0" fill="#B2493A"/><rect x="336.0" y="58.0" width="14.0" height="12.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><polygon points="335.0,58.0 343.0,52.0 351.0,58.0" fill="#B2493A"/><rect x="354.0" y="58.0" width="14.0" height="12.0" fill="#F5E6C8" stroke="#8C6039" stroke-width="0.7" /><polygon points="353.0,58.0 361.0,52.0 369.0,58.0" fill="#B2493A"/><rect x="280.0" y="56.0" width="80.0" height="3.0" fill="#388E3C" /><text x="60.0" y="30.83" font-size="8.53" fill="#B71C1C" font-weight="800" text-anchor="middle"><tspan x="60.0" dy="0">VÁRZEA</tspan><tspan x="60.0" dy="9.39">(inunda)</tspan></text><text x="206.0" y="30.83" font-size="8.53" fill="#4A148C" font-weight="800" text-anchor="middle"><tspan x="206.0" dy="0">CENTRO</tspan><tspan x="206.0" dy="9.39">valorizado</tspan></text><text x="330.0" y="30.61" font-size="8.27" fill="#4A148C" font-weight="800" text-anchor="middle"><tspan x="330.0" dy="0">condomínios</tspan><tspan x="330.0" dy="9.09">fechados</tspan></text><text x="500.0" y="20.83" font-size="8.53" fill="#B71C1C" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">ENCOSTA</tspan><tspan x="500.0" dy="9.39">(deslizamentos)</tspan></text><rect x="0.0" y="112.0" width="711.0" height="66.0" fill="#F7F0FB" rx="4" /><text x="8.0" y="124.61" font-size="8.27" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0"><tspan font-weight="700">Mecanismo:</tspan> o preço do solo urbano seleciona quem</tspan><tspan x="8.0" dy="10.09">vive onde; sem moradia acessível, a população pobre</tspan><tspan x="8.0" dy="10.09">ocupa várzeas e encostas (autoconstrução, favelas).</tspan></text><text x="244.0" y="124.61" font-size="8.27" fill="#1D2330" font-weight="500"><tspan x="244.0" dy="0"><tspan font-weight="700">Consequências:</tspan> deslizamentos e enchentes, falta de</tspan><tspan x="244.0" dy="10.09">saneamento e transporte, <tspan font-weight="700">segregação</tspan> (condomínios ×</tspan><tspan x="244.0" dy="10.09">favelas) e violência urbana.</tspan></text><text x="480.0" y="124.61" font-size="8.27" fill="#1D2330" font-weight="500"><tspan x="480.0" dy="0"><tspan font-weight="700">Resposta:</tspan> habitação de interesse social, regularização</tspan><tspan x="480.0" dy="10.09">fundiária, plano diretor, parques e contenção de</tspan><tspan x="480.0" dy="10.09">encostas (ver Estatuto da Cidade, 2001).</tspan></text></svg>