<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 216.0" role="img" aria-label="Eutrofização" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Eutrofização</title><rect x="0.0" y="0.0" width="711.0" height="216.0" fill="#FFFFFF" /><rect x="0.0" y="6.0" width="158.0" height="46.0" fill="#F4EBE0" rx="6" stroke="#8D5B2E" stroke-width="1.2" /><text x="79.0" y="25.48" font-size="8.80" fill="#5D3A1A" font-weight="700" text-anchor="middle"><tspan x="79.0" dy="0">Adubação com N e P</tspan><tspan x="79.0" dy="10.56">(fertilizantes)</tspan></text><circle cx="10.0" cy="4.0" r="7.5" fill="#1F2A44"/><text x="10.0" y="7.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="10.0" dy="0">1</tspan></text><rect x="184.0" y="6.0" width="158.0" height="46.0" fill="#E3F2FD" rx="6" stroke="#1565C0" stroke-width="1.2" /><text x="263.0" y="20.20" font-size="8.80" fill="#0D47A1" font-weight="700" text-anchor="middle"><tspan x="263.0" dy="0">Chuva carrega o excesso</tspan><tspan x="263.0" dy="10.56">(lixiviação e escoamento) até rios</tspan><tspan x="263.0" dy="10.56">e lagos</tspan></text><circle cx="194.0" cy="4.0" r="7.5" fill="#1F2A44"/><text x="194.0" y="7.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="194.0" dy="0">2</tspan></text><rect x="368.0" y="6.0" width="158.0" height="46.0" fill="#E3F2FD" rx="6" stroke="#1565C0" stroke-width="1.2" /><text x="447.0" y="30.76" font-size="8.80" fill="#0D47A1" font-weight="700" text-anchor="middle"><tspan x="447.0" dy="0">Água rica em nutrientes</tspan></text><circle cx="378.0" cy="4.0" r="7.5" fill="#1F2A44"/><text x="378.0" y="7.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="378.0" dy="0">3</tspan></text><rect x="552.0" y="6.0" width="158.0" height="46.0" fill="#E8F5E9" rx="6" stroke="#2E7D32" stroke-width="1.2" /><text x="631.0" y="25.48" font-size="8.80" fill="#1B5E20" font-weight="700" text-anchor="middle"><tspan x="631.0" dy="0">Proliferação de algas e</tspan><tspan x="631.0" dy="10.56">cianobactérias (“floração”)</tspan></text><circle cx="562.0" cy="4.0" r="7.5" fill="#1F2A44"/><text x="562.0" y="7.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="562.0" dy="0">4</tspan></text><rect x="0.0" y="84.0" width="158.0" height="46.0" fill="#E8F5E9" rx="6" stroke="#2E7D32" stroke-width="1.2" /><text x="79.0" y="108.76" font-size="8.80" fill="#1B5E20" font-weight="700" text-anchor="middle"><tspan x="79.0" dy="0">A camada de algas bloqueia a luz</tspan></text><circle cx="10.0" cy="82.0" r="7.5" fill="#1F2A44"/><text x="10.0" y="85.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="10.0" dy="0">5</tspan></text><rect x="184.0" y="84.0" width="158.0" height="46.0" fill="#E8F5E9" rx="6" stroke="#2E7D32" stroke-width="1.2" /><text x="263.0" y="103.48" font-size="8.80" fill="#1B5E20" font-weight="700" text-anchor="middle"><tspan x="263.0" dy="0">Plantas submersas morrem:</tspan><tspan x="263.0" dy="10.56">menos fotossíntese</tspan></text><circle cx="194.0" cy="82.0" r="7.5" fill="#1F2A44"/><text x="194.0" y="85.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="194.0" dy="0">6</tspan></text><rect x="368.0" y="84.0" width="158.0" height="46.0" fill="#FFF0E0" rx="6" stroke="#E65100" stroke-width="1.2" /><text x="447.0" y="103.48" font-size="8.80" fill="#B23C00" font-weight="700" text-anchor="middle"><tspan x="447.0" dy="0">Bactérias decompõem a matéria</tspan><tspan x="447.0" dy="10.56">orgânica e consomem O₂</tspan></text><circle cx="378.0" cy="82.0" r="7.5" fill="#1F2A44"/><text x="378.0" y="85.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="378.0" dy="0">7</tspan></text><rect x="552.0" y="84.0" width="158.0" height="46.0" fill="#FDECEA" rx="6" stroke="#C62828" stroke-width="1.2" /><text x="631.0" y="103.48" font-size="8.80" fill="#8E1B1B" font-weight="700" text-anchor="middle"><tspan x="631.0" dy="0">Queda do oxigênio dissolvido:</tspan><tspan x="631.0" dy="10.56">mortandade de peixes</tspan></text><circle cx="562.0" cy="82.0" r="7.5" fill="#1F2A44"/><text x="562.0" y="85.07" font-size="8.53" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="562.0" dy="0">8</tspan></text><line x1="159.0" y1="29.0" x2="177.6" y2="29.0" stroke="#37474F" stroke-width="1.6" stroke-linecap="butt"/><polygon points="183.0,29.0 177.6,32.3 177.6,25.7" fill="#37474F"/><line x1="343.0" y1="29.0" x2="361.6" y2="29.0" stroke="#37474F" stroke-width="1.6" stroke-linecap="butt"/><polygon points="367.0,29.0 361.6,32.3 361.6,25.7" fill="#37474F"/><line x1="527.0" y1="29.0" x2="545.6" y2="29.0" stroke="#37474F" stroke-width="1.6" stroke-linecap="butt"/><polygon points="551.0,29.0 545.6,32.3 545.6,25.7" fill="#37474F"/><line x1="159.0" y1="107.0" x2="177.6" y2="107.0" stroke="#37474F" stroke-width="1.6" stroke-linecap="butt"/><polygon points="183.0,107.0 177.6,110.3 177.6,103.7" fill="#37474F"/><line x1="343.0" y1="107.0" x2="361.6" y2="107.0" stroke="#37474F" stroke-width="1.6" stroke-linecap="butt"/><polygon points="367.0,107.0 361.6,110.3 361.6,103.7" fill="#37474F"/><line x1="527.0" y1="107.0" x2="545.6" y2="107.0" stroke="#37474F" stroke-width="1.6" stroke-linecap="butt"/><polygon points="551.0,107.0 545.6,110.3 545.6,103.7" fill="#37474F"/><path d="M631.0,53 V66 H79.0 V81" fill="none" stroke="#37474F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><polygon points="79.0,83.0 75.5,76.0 82.5,76.0" fill="#37474F"/><rect x="0.0" y="166.0" width="340.0" height="40.0" fill="#B3E5FC" rx="4" stroke="#64B5F6" stroke-width="0.8" /><text x="8.0" y="176.61" font-size="8.27" fill="#0D47A1" font-weight="800"><tspan x="8.0" dy="0">LAGO SAUDÁVEL</tspan></text><path d="M90,200 q4,-8 8,0 M104,200 q4,-10 8,0" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,200 q4,-8 8,0 M174,200 q4,-10 8,0" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M230,200 q4,-8 8,0 M244,200 q4,-10 8,0" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M120,186 q10,-4 20,0 l-6,-3 m6,3 l-6,3" fill="none" stroke="#546E7A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="370.0" y="166.0" width="340.0" height="40.0" fill="#7CB342" rx="4" stroke="#558B2F" stroke-width="0.8" /><text x="378.0" y="176.61" font-size="8.27" fill="#FFFFFF" font-weight="800"><tspan x="378.0" dy="0">LAGO EUTROFIZADO</tspan></text><text x="540.0" y="194.61" font-size="8.27" fill="#1B5E20" font-weight="800" text-anchor="middle" stroke="#C5E1A5" stroke-width="2.3" stroke-linejoin="round" paint-order="stroke"><tspan x="540.0" dy="0">algas cobrem a superfície · peixes mortos</tspan></text><path d="M470,198 q10,4 20,0 l-8,4 m8,-4 l-8,-4" fill="none" stroke="#37474F" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" /><text x="0.0" y="214.51" font-size="8.13" fill="#5D3A1A" font-weight="700"><tspan x="0.0" dy="0">Química/Biologia: N e P (fósforo) em excesso; consumo de O₂ na decomposição aeróbia (DBO). Esgoto doméstico também causa eutrofização.</tspan></text></svg>