<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 228.0" role="img" aria-label="Estrutura da ONU" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Estrutura da ONU</title><rect x="0.0" y="0.0" width="711.0" height="26.0" fill="#1F2A44" rx="6" /><text x="355.5" y="16.74" font-size="10.40" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">ONU — Carta de São Francisco (1945) · 193 Estados-membros · sede em Nova York</tspan></text><rect x="0.0" y="36.0" width="109.0" height="100.0" fill="#FFFFFF" rx="5" stroke="#1565C0" stroke-width="1.4" /><rect x="0.0" y="36.0" width="109.0" height="26.0" fill="#1565C0" rx="5" /><text x="54.5" y="47.93" font-size="8.67" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="54.5" dy="0">Assembleia Geral</tspan></text><text x="6.0" y="74.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="6.0" dy="0">Todos os membros; um</tspan><tspan x="6.0" dy="9.76">país, um voto. Debate e</tspan><tspan x="6.0" dy="9.76">faz recomendações (não</tspan><tspan x="6.0" dy="9.76">vinculantes na maioria</tspan><tspan x="6.0" dy="9.76">dos temas).</tspan></text><rect x="120.2" y="36.0" width="109.0" height="100.0" fill="#FFFFFF" rx="5" stroke="#C62828" stroke-width="1.4" /><rect x="120.2" y="36.0" width="109.0" height="26.0" fill="#C62828" rx="5" /><text x="174.7" y="47.93" font-size="8.67" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="174.7" dy="0">Conselho de</tspan><tspan x="174.7" dy="9.71">Segurança</tspan></text><text x="126.2" y="74.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="126.2" dy="0">15 membros. Decisões</tspan><tspan x="126.2" dy="9.76">obrigatórias sobre paz e</tspan><tspan x="126.2" dy="9.76">segurança (sanções,</tspan><tspan x="126.2" dy="9.76">missões de paz).</tspan><tspan x="126.2" dy="9.76">Aprovação exige 9 votos</tspan><tspan x="126.2" dy="9.76">e nenhum veto.</tspan></text><rect x="240.4" y="36.0" width="109.0" height="100.0" fill="#FFFFFF" rx="5" stroke="#546E7A" stroke-width="1.4" /><rect x="240.4" y="36.0" width="109.0" height="26.0" fill="#546E7A" rx="5" /><text x="294.9" y="47.93" font-size="8.67" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="294.9" dy="0">Secretariado</tspan></text><text x="246.4" y="74.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="246.4" dy="0">Chefiado pelo</tspan><tspan x="246.4" dy="9.76">secretário-geral;</tspan><tspan x="246.4" dy="9.76">administra a</tspan><tspan x="246.4" dy="9.76">organização e a</tspan><tspan x="246.4" dy="9.76">diplomacia preventiva.</tspan></text><rect x="360.6" y="36.0" width="109.0" height="100.0" fill="#FFFFFF" rx="5" stroke="#7B3FA0" stroke-width="1.4" /><rect x="360.6" y="36.0" width="109.0" height="26.0" fill="#7B3FA0" rx="5" /><text x="415.1" y="47.93" font-size="8.67" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="415.1" dy="0">Corte Internacional de</tspan><tspan x="415.1" dy="9.71">Justiça</tspan></text><text x="366.6" y="74.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="366.6" dy="0">Haia; julga disputas</tspan><tspan x="366.6" dy="9.76">entre Estados (se</tspan><tspan x="366.6" dy="9.76">aceitarem a jurisdição) e</tspan><tspan x="366.6" dy="9.76">emite pareceres.</tspan></text><rect x="480.8" y="36.0" width="109.0" height="100.0" fill="#FFFFFF" rx="5" stroke="#E65100" stroke-width="1.4" /><rect x="480.8" y="36.0" width="109.0" height="26.0" fill="#E65100" rx="5" /><text x="535.3" y="47.93" font-size="8.67" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="535.3" dy="0">Conselho Econômico e</tspan><tspan x="535.3" dy="9.71">Social</tspan></text><text x="486.8" y="74.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="486.8" dy="0">Coordena temas</tspan><tspan x="486.8" dy="9.76">econômicos e sociais e</tspan><tspan x="486.8" dy="9.76">as agências</tspan><tspan x="486.8" dy="9.76">especializadas.</tspan></text><rect x="601.0" y="36.0" width="109.0" height="100.0" fill="#FFFFFF" rx="5" stroke="#9AA3B2" stroke-width="1.4" /><rect x="601.0" y="36.0" width="109.0" height="26.0" fill="#9AA3B2" rx="5" /><text x="655.5" y="47.93" font-size="8.67" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="655.5" dy="0">Conselho de Tutela</tspan></text><text x="607.0" y="74.51" font-size="8.13" fill="#1D2330" font-weight="500"><tspan x="607.0" dy="0">Supervisionava</tspan><tspan x="607.0" dy="9.76">territórios sob tutela;</tspan><tspan x="607.0" dy="9.76">suspenso desde 1994.</tspan></text><rect x="120.2" y="142.0" width="109.0" height="52.0" fill="#FDECEC" rx="4" stroke="#C62828" stroke-width="1" /><text x="174.7" y="152.40" font-size="8.00" fill="#8E1B1B" font-weight="800" text-anchor="middle"><tspan x="174.7" dy="0">5 permanentes com veto</tspan></text><text x="174.7" y="164.29" font-size="7.87" fill="#1D2330" font-weight="600" text-anchor="middle"><tspan x="174.7" dy="0">EUA · Rússia · China ·</tspan><tspan x="174.7" dy="9.44">Reino Unido · França</tspan><tspan x="174.7" dy="9.44">+ 10 rotativos (2 anos)</tspan></text><rect x="480.8" y="142.0" width="229.2" height="52.0" fill="#FFF3E6" rx="4" stroke="#E65100" stroke-width="1" /><text x="595.4" y="152.40" font-size="8.00" fill="#B23C00" font-weight="800" text-anchor="middle"><tspan x="595.4" dy="0">Agências e programas</tspan></text><text x="595.4" y="164.29" font-size="7.87" fill="#1D2330" font-weight="600" text-anchor="middle"><tspan x="595.4" dy="0">OMS · FAO · UNESCO · OIT · FMI e Banco Mundial</tspan><tspan x="595.4" dy="9.44">(agências especializadas) · UNICEF · ACNUR · PNUD ·</tspan><tspan x="595.4" dy="9.44">PNUMA</tspan></text><rect x="0.0" y="200.0" width="711.0" height="26.0" fill="#F5F7FA" rx="4" /><text x="355.5" y="210.40" font-size="8.00" fill="#37474F" font-weight="600" text-anchor="middle"><tspan x="355.5" dy="0"><tspan font-weight="700">Atenção:</tspan> a OMC não é agência da ONU (organização autônoma). Palestina e Santa Sé são Estados observadores, não membros. Reforma do Conselho de Segurança: o Brasil (G4,</tspan><tspan x="355.5" dy="9.60">com Alemanha, Índia e Japão) pleiteia assento permanente.</tspan></text></svg>