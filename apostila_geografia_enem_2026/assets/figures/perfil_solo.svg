1="42.0" x2="36.0" y2="148.8" stroke="#1E88E5" stroke-width="2.2" stroke-linecap="butt"/><polygon points="36.0,156.0 31.6,148.8 40.4,148.8" fill="#1E88E5"/><text x="44.0" y="114.29" font-size="7.87" fill="#FFFFFF" font-weight="800"><tspan x="44.0" dy="0">lixiviação:</tspan><tspan x="44.0" dy="8.81">água leva</tspan><tspan x="44.0" dy="8.81">nutrientes</tspan><tspan x="44.0" dy="8.81">para baixo</tspan></text><line x1="145.0" y1="43.0" x2="154.0" y2="23.0" stroke="#37474F" stroke-width="0.7" stroke-linecap="round"/><text x="158.0" y="23.68" font-size="9.60" fill="#3B2716" font-weight="800"><tspan x="158.0" dy="0">O · Orgânico</tspan></text><text x="158.0" y="34.22" font-size="8.40" fill="#1D2330" font-weight="400"><tspan x="158.0" dy="0">serapilheira e húmus: folhas e restos em</tspan><tspan x="158.0" dy="10.08">decomposição (decompositores reciclam</tspan><tspan x="158.0" dy="10.08">nutrientes).</tspan></text><line x1="145.0" y1="70.0" x2="154.0" y2="71.0" stroke="#37474F" stroke-width="0.7" stroke-linecap="round"/><text x="158.0" y="71.68" font-size="9.60" fill="#6A4A2E" font-weight="800"><tspan x="158.0" dy="0">A · Horizonte superficial</tspan></text><text x="158.0" y="82.22" font-size="8.40" fill="#1D2330" font-weight="400"><tspan x="158.0" dy="0">matéria orgânica + minerais; mais escuro,</tspan><tspan x="158.0" dy="10.08">mais fértil e o mais exposto à erosão.</tspan></text><line x1="145.0" y1="125.0" x2="154.0" y2="125.0" stroke="#37474F" stroke-width="0.7" stroke-linecap="round"/><text x="158.0" y="125.68" font-size="9.60" fill="#9A5530" font-weight="800"><tspan x="158.0" dy="0">B · Horizonte de acumulação</tspan></text><text x="158.0" y="136.22" font-size="8.40" fill="#1D2330" font-weight="400"><tspan x="158.0" dy="0">argilas e óxidos de ferro e alumínio (cores</tspan><tspan x="158.0" dy="10.08">vermelha e amarela dos solos tropicais).</tspan></text><line x1="145.0" y1="187.0" x2="154.0" y2="199.0" stroke="#37474F" stroke-width="0.7" stroke-linecap="round"/><text x="158.0" y="199.68" font-size="9.60" fill="#8C6F45" font-weight="800"><tspan x="158.0" dy="0">C · Rocha alterada</tspan></text><text x="158.0" y="210.22" font-size="8.40" fill="#1D2330" font-weight="400"><tspan x="158.0" dy="0">saprolito: fragmentos da rocha-mãe em</tspan><tspan x="158.0" dy="10.08">intemperismo.</tspan></text><line x1="145.0" y1="245.0" x2="154.0" y2="253.0" stroke="#37474F" stroke-width="0.7" stroke-linecap="round"/><text x="158.0" y="253.68" font-size="9.60" fill="#5F676E" font-weight="800"><tspan x="158.0" dy="0">R · Rocha-mãe</tspan></text><text x="158.0" y="264.22" font-size="8.40" fill="#1D2330" font-weight="400"><tspan x="158.0" dy="0">material de origem, ainda inalterado.</tspan></text><text x="78.0" y="14.40" font-size="8.00" fill="#5B6475" font-weight="600" text-anchor="middle" font-style="italic"><tspan x="78.0" dy="0">superfície</tspan></text><text x="174.0" y="290.72" font-size="8.40" fill="#5D3A1A" font-weight="800" text-anchor="middle"><tspan x="174.0" dy="0">Pedogênese = clima + organismos + relevo + rocha-mãe + tempo</tspan></text></svg>