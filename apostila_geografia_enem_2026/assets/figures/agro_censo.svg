<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 204.0" role="img" aria-label="Agricultura familiar no Censo Agropecuário 2017" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Agricultura familiar no Censo Agropecuário 2017</title><rect x="0.0" y="0.0" width="711.0" height="204.0" fill="#FFFFFF" /><text x="0.0" y="8.96" font-size="11.20" fill="#5D3A1A" font-weight="800"><tspan x="0.0" dy="0">Agricultura familiar × não familiar no Brasil (Censo Agropecuário 2017, IBGE)</tspan></text><text x="0.0" y="35.89" font-size="9.87" fill="#1D2330" font-weight="800"><tspan x="0.0" dy="0">Estabelecimentos</tspan></text><text x="0.0" y="46.40" font-size="8.00" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">≈ 3,9 milhões de ≈ 5,07 milhões</tspan></text><rect x="150.0" y="26.0" width="331.1" height="24.0" fill="#2E7D32" /><rect x="481.1" y="26.0" width="98.9" height="24.0" fill="#E65100" /><text x="156.0" y="42.13" font-size="11.47" fill="#FFFFFF" font-weight="800"><tspan x="156.0" dy="0">77%</tspan></text><text x="574.0" y="42.13" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="end"><tspan x="574.0" dy="0">23%</tspan></text><text x="0.0" y="69.89" font-size="9.87" fill="#1D2330" font-weight="800"><tspan x="0.0" dy="0">Área ocupada</tspan></text><text x="0.0" y="80.40" font-size="8.00" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">80,9 milhões de hectares</tspan></text><rect x="150.0" y="60.0" width="98.9" height="24.0" fill="#2E7D32" /><rect x="248.9" y="60.0" width="331.1" height="24.0" fill="#E65100" /><text x="156.0" y="76.13" font-size="11.47" fill="#FFFFFF" font-weight="800"><tspan x="156.0" dy="0">23%</tspan></text><text x="574.0" y="76.13" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="end"><tspan x="574.0" dy="0">77%</tspan></text><text x="0.0" y="103.89" font-size="9.87" fill="#1D2330" font-weight="800"><tspan x="0.0" dy="0">Valor da produção</tspan></text><text x="0.0" y="114.40" font-size="8.00" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">R$ 107 bi de R$ 465 bi</tspan></text><rect x="150.0" y="94.0" width="98.9" height="24.0" fill="#2E7D32" /><rect x="248.9" y="94.0" width="331.1" height="24.0" fill="#E65100" /><text x="156.0" y="110.13" font-size="11.47" fill="#FFFFFF" font-weight="800"><tspan x="156.0" dy="0">23%</tspan></text><text x="574.0" y="110.13" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="end"><tspan x="574.0" dy="0">77%</tspan></text><text x="0.0" y="137.89" font-size="9.87" fill="#1D2330" font-weight="800"><tspan x="0.0" dy="0">Pessoal ocupado</tspan></text><text x="0.0" y="148.40" font-size="8.00" fill="#5B6475" font-weight="500"><tspan x="0.0" dy="0">2/3 do pessoal do campo</tspan></text><rect x="150.0" y="128.0" width="288.1" height="24.0" fill="#2E7D32" /><rect x="438.1" y="128.0" width="141.9" height="24.0" fill="#E65100" /><text x="156.0" y="144.13" font-size="11.47" fill="#FFFFFF" font-weight="800"><tspan x="156.0" dy="0">67%</tspan></text><text x="574.0" y="144.13" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="end"><tspan x="574.0" dy="0">33%</tspan></text><rect x="150.0" y="166.0" width="10.0" height="8.0" fill="#2E7D32" /><text x="164.0" y="171.04" font-size="8.80" fill="#1D2330" font-weight="700"><tspan x="164.0" dy="0">Agricultura familiar (Lei 11.326/2006)</tspan></text><rect x="370.0" y="166.0" width="10.0" height="8.0" fill="#E65100" /><text x="384.0" y="171.04" font-size="8.80" fill="#1D2330" font-weight="700"><tspan x="384.0" dy="0">Não familiar</tspan></text><text x="0.0" y="188.72" font-size="8.40" fill="#5D3A1A" font-weight="700"><tspan x="0.0" dy="0">Ideia central: muitos estabelecimentos e muita gente ocupada em pouca área; pouca área concentra grande parte do valor.</tspan></text><text x="0.0" y="197.29" font-size="7.87" fill="#B71C1C" font-weight="600"><tspan x="0.0" dy="0">Os números NÃO significam que a agricultura familiar produza “70% dos alimentos” do país; o recorte é por estabelecimentos.</tspan></text></svg>