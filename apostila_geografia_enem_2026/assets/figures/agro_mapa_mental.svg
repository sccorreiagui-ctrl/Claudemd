<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 168.0" role="img" aria-label="Mapa mental da Geografia Agrária" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Mapa mental da Geografia Agrária</title><rect x="0.0" y="0.0" width="711.0" height="168.0" fill="#FFFFFF" /><circle cx="355.0" cy="84.0" r="46.0" fill="#8D5B2E"/><text x="355.0" y="81.82" font-size="11.47" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.0" dy="0">GEOGRAFIA</tspan><tspan x="355.0" dy="12.61">AGRÁRIA</tspan></text><rect x="0.0" y="6.0" width="270.0" height="46.0" fill="#F4EBE0" rx="5" stroke="#8D5B2E" stroke-width="1.2" /><text x="8.0" y="19.68" font-size="9.60" fill="#5D3A1A" font-weight="800"><tspan x="8.0" dy="0">Sistemas agrícolas</tspan></text><text x="8.0" y="31.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0">familiar × empresarial · intensiva × extensiva · plantation</tspan></text><line x1="270.0" y1="29.0" x2="322.0" y2="84.0" stroke="#8D5B2E" stroke-width="1.6" stroke-linecap="round"/><rect x="0.0" y="60.0" width="270.0" height="46.0" fill="#FFF0E0" rx="5" stroke="#E65100" stroke-width="1.2" /><text x="8.0" y="73.68" font-size="9.60" fill="#B23C00" font-weight="800"><tspan x="8.0" dy="0">Revolução Verde</tspan></text><text x="8.0" y="85.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0">pacote técnico → produtividade ↑ · concentração ↑ · êxodo</tspan><tspan x="8.0" dy="10.08">rural</tspan></text><line x1="270.0" y1="83.0" x2="322.0" y2="84.0" stroke="#E65100" stroke-width="1.6" stroke-linecap="round"/><rect x="0.0" y="114.0" width="270.0" height="46.0" fill="#E3F2FD" rx="5" stroke="#1565C0" stroke-width="1.2" /><text x="8.0" y="127.68" font-size="9.60" fill="#0D47A1" font-weight="800"><tspan x="8.0" dy="0">Insumos e química</tspan></text><text x="8.0" y="139.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="8.0" dy="0">NPK, agrotóxicos → eutrofização, resistência, contaminação</tspan></text><line x1="270.0" y1="137.0" x2="322.0" y2="84.0" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><rect x="440.0" y="6.0" width="270.0" height="46.0" fill="#E8F5E9" rx="5" stroke="#2E7D32" stroke-width="1.2" /><text x="448.0" y="19.68" font-size="9.60" fill="#1B5E20" font-weight="800"><tspan x="448.0" dy="0">Solo e manejo</tspan></text><text x="448.0" y="31.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="448.0" dy="0">calagem · rotação · pousio · curvas de nível · terraços</tspan></text><line x1="440.0" y1="29.0" x2="388.0" y2="84.0" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round"/><rect x="440.0" y="60.0" width="270.0" height="46.0" fill="#FDECEA" rx="5" stroke="#C62828" stroke-width="1.2" /><text x="448.0" y="73.68" font-size="9.60" fill="#8E1B1B" font-weight="800"><tspan x="448.0" dy="0">Fronteira agrícola</tspan></text><text x="448.0" y="85.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="448.0" dy="0">Cerrado → MATOPIBA → Amazônia · pecuária e grilagem</tspan></text><line x1="440.0" y1="83.0" x2="388.0" y2="84.0" stroke="#C62828" stroke-width="1.6" stroke-linecap="round"/><rect x="440.0" y="114.0" width="270.0" height="46.0" fill="#F3E8F9" rx="5" stroke="#7B3FA0" stroke-width="1.2" /><text x="448.0" y="127.68" font-size="9.60" fill="#4A148C" font-weight="800"><tspan x="448.0" dy="0">Terra e poder</tspan></text><text x="448.0" y="139.72" font-size="8.40" fill="#1D2330" font-weight="500"><tspan x="448.0" dy="0">sesmarias → Lei de Terras → especulação → reforma agrária</tspan></text><line x1="440.0" y1="137.0" x2="388.0" y2="84.0" stroke="#7B3FA0" stroke-width="1.6" stroke-linecap="round"/></svg>