<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711.0 236.0" role="img" aria-label="Revolução Verde: pacote tecnológico e consequências" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Revolução Verde: pacote tecnológico e consequências</title><rect x="0.0" y="0.0" width="711.0" height="236.0" fill="#FFFFFF" /><rect x="0.0" y="0.0" width="470.0" height="20.0" fill="#E65100" rx="4" /><text x="235.0" y="13.26" font-size="9.07" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="235.0" dy="0">PACOTE TECNOLÓGICO (difundido a partir dos anos 1940–60)</tspan></text><rect x="0.0" y="28.0" width="150.0" height="32.0" fill="#F4EBE0" rx="5" stroke="#8D5B2E" stroke-width="1.2" /><text x="75.0" y="45.76" font-size="8.80" fill="#5D3A1A" font-weight="700" text-anchor="middle"><tspan x="75.0" dy="0">Máquinas e mecanização</tspan></text><rect x="160.0" y="28.0" width="150.0" height="32.0" fill="#E8F5E9" rx="5" stroke="#2E7D32" stroke-width="1.2" /><text x="235.0" y="40.48" font-size="8.80" fill="#1B5E20" font-weight="700" text-anchor="middle"><tspan x="235.0" dy="0">Sementes melhoradas (híbridos</tspan><tspan x="235.0" dy="10.56">de alto rendimento)</tspan></text><rect x="320.0" y="28.0" width="150.0" height="32.0" fill="#E3F2FD" rx="5" stroke="#1565C0" stroke-width="1.2" /><text x="395.0" y="45.76" font-size="8.80" fill="#0D47A1" font-weight="700" text-anchor="middle"><tspan x="395.0" dy="0">Fertilizantes (NPK) e calagem</tspan></text><rect x="0.0" y="66.0" width="150.0" height="32.0" fill="#FDECEA" rx="5" stroke="#C62828" stroke-width="1.2" /><text x="75.0" y="83.76" font-size="8.80" fill="#8E1B1B" font-weight="700" text-anchor="middle"><tspan x="75.0" dy="0">Agrotóxicos (defensivos)</tspan></text><rect x="160.0" y="66.0" width="150.0" height="32.0" fill="#E3F2FD" rx="5" stroke="#1565C0" stroke-width="1.2" /><text x="235.0" y="83.76" font-size="8.80" fill="#0D47A1" font-weight="700" text-anchor="middle"