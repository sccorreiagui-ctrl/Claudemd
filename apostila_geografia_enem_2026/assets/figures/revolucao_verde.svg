#1D2330" font-weight="600"><tspan x="6.0" dy="0">Dependência de insumos industriais</tspan></text><rect x="241.0" y="124.0" width="229.0" height="18.0" fill="#E65100" rx="4" /><text x="355.5" y="136.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="355.5" dy="0">ECONÔMICAS E SOCIAIS</tspan></text><rect x="241.0" y="146.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#E65100" stroke-width="1.0" /><text x="247.0" y="157.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="247.0" dy="0">Custo alto: pequenos produtores endividados</tspan></text><rect x="241.0" y="165.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#E65100" stroke-width="1.0" /><text x="247.0" y="176.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="247.0" dy="0">Concentração fundiária e de renda</tspan></text><rect x="241.0" y="184.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#E65100" stroke-width="1.0" /><text x="247.0" y="195.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="247.0" dy="0">Menos empregos por hectare → êxodo rural</tspan></text><rect x="482.0" y="124.0" width="229.0" height="18.0" fill="#C62828" rx="4" /><text x="596.5" y="136.17" font-size="8.80" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="596.5" dy="0">AMBIENTAIS</tspan></text><rect x="482.0" y="146.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#C62828" stroke-width="1.0" /><text x="488.0" y="157.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="488.0" dy="0">Erosão e compactação do solo</tspan></text><rect x="482.0" y="165.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#C62828" stroke-width="1.0" /><text x="488.0" y="176.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="488.0" dy="0">Contaminação por agrotóxicos e NPK</tspan></text><rect x="482.0" y="184.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#C62828" stroke-width="1.0" /><text x="488.0" y="195.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="488.0" dy="0">Eutrofização e perda de biodiversidade</tspan></text><rect x="482.0" y="203.0" width="229.0" height="17.0" fill="#FFFFFF" rx="3" stroke="#C62828" stroke-width="1.0" /><text x="488.0" y="214.43" font-size="8.13" fill="#1D2330" font-weight="600"><tspan x="488.0" dy="0">Pragas resistentes (seleção)</tspan></text><text x="0.0" y="232.83" font-size="8.53" fill="#5D3A1A" font-weight="800"><tspan x="0.0" dy="0">Cadeia: mecanização → menor demanda de trabalho rural → êxodo rural → expansão urbana (tendência histórica; varia por região e cultura).</tspan></text></svg>