<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 227.0 196.0" role="img" aria-label="Falésia, praia e recife" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Falésia, praia e recife</title><rect x="0.0" y="0.0" width="227.0" height="196.0" fill="#FFFFFF" /><rect x="0.0" y="22.0" width="227.0" height="100.0" fill="#EAF4FC" /><rect x="0.0" y="100.0" width="130.0" height="22.0" fill="#64B5F6" /><polygon points="130.0,122.0 130.0,100.0 136.0,40.0 227.0,40.0 227.0,122.0" fill="#C8714A" stroke="#8C4A2A" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M136,56 L227,58" fill="none" stroke="#E7A57F" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" /><path d="M136,72 L227,74" fill="none" stroke="#E7A57F" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" /><path d="M136,88 L227,90" fill="none" stroke="#E7A57F" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" /><polygon points="100.0,122.0 130.0,108.0 138.0,122.0" fill="#F2D49B"/><path d="M120,102 q6,-8 14,-4" fill="none" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" /><path d="M126,106 q-4,0 -6,4" fill="none" stroke="#8C4A2A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="40.0,100.0 52.0,96.0 60.0,100.0" fill="#8D6E63"/><text x="113.5" y="10.68" font-size="9.60" fill="#8C4A2A" font-weight="800" text-anchor="middle"><tspan x="113.5" dy="0">FALÉSIA E PRAIA</tspan></text><text x="221.0" y="30.19" font-size="7.73" fill="#FFFFFF" font-weight="800" text-anchor="end"><tspan x="221.0" dy="0">falésia: escarpa</tspan><tspan x="221.0" dy="8.51">recuada pela abrasão</tspan></text><text x="50.0" y="90.40" font-size="8.00" fill="#0D47A1" font-weight="700" font-style="italic"><tspan x="50.0" dy="0">ondas</tspan></text><line x1="80.0" y1="92.0" x2="112.7" y2="98.9" stroke="#1E88E5" stroke-width="1.8" stroke-linecap="butt"/><polygon points="118.0,100.0 112.0,102.1 113.4,95.7" fill="#1E88E5"/><text x="100.0" y="134.29" font-size="7.87" fill="#8A6508" font-weight="800" text-anchor="middle"><tspan x="100.0" dy="0">praia</tspan></text><text x="113.5" y="156.29" font-size="7.87" fill="#1D2330" font-weight="600" text-anchor="middle"><tspan x="113.5" dy="0">Ondas erodem o sopé (abrasão); a falésia recua e</tspan><tspan x="113.5" dy="9.44">deixa plataforma de abrasão. Recifes e arenitos</tspan><tspan x="113.5" dy="9.44">de praia protegem trechos da costa nordestina.</tspan></text></svg>