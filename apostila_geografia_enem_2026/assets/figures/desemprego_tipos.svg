<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348.0 206.0" role="img" aria-label="Desemprego estrutural e conjuntural" style="width:100%;height:auto;display:block" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>Desemprego estrutural e conjuntural</title><text x="0.0" y="7.89" font-size="9.87" fill="#B23C00" font-weight="800"><tspan x="0.0" dy="0">Desemprego: conjuntural × estrutural (esquema)</tspan></text><rect x="126.0" y="34.0" width="36.0" height="84.0" fill="#ECEFF1" /><line x1="26.0" y1="118.0" x2="340.0" y2="118.0" stroke="#37474F" stroke-width="1.0" stroke-linecap="round"/><line x1="26.0" y1="32.0" x2="26.0" y2="118.0" stroke="#37474F" stroke-width="1.0" stroke-linecap="round"/><text x="30.0" y="26.97" font-size="7.47" fill="#5B6475" font-weight="700"><tspan x="30.0" dy="0">vagas de trabalho ↑</tspan></text><text x="340.0" y="126.97" font-size="7.47" fill="#5B6475" font-weight="700" text-anchor="end"><tspan x="340.0" dy="0">tempo →</tspan></text><polyline points="26.0,50.0 86.0,48.0 126.0,86.0 156.0,92.0 216.0,58.0 340.0,48.0" fill="none" stroke="#1565C0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="26.0,50.0 86.0,48.0 126.0,72.0 156.0,86.0 216.0,94.0 340.0,98.0" fill="none" stroke="#C62828" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="144.0" y="108.19" font-size="7.73" fill="#37474F" font-weight="800" text-anchor="middle"><tspan x="144.0" dy="0">crise</tspan></text><text x="340.0" y="40.19" font-size="7.73" fill="#0D47A1" font-weight="800" text-anchor="end"><tspan x="340.0" dy="0">conjuntural: as vagas voltam</tspan></text><text x="340.0" y="112.19" font-size="7.73" fill="#B71C1C" font-weight="800" text-anchor="end"><tspan x="340.0" dy="0">estrutural: não voltam (automação)</tspan></text><text x="0.0" y="138.40" font-size="8.00" fill="#1D2330" font-weight="500"><tspan x="0.0" dy="0"><tspan font-weight="700">Conjuntural (cíclico):</tspan> causado por crise econômica passageira; a retomada do PIB recria</tspan><tspan x="0.0" dy="9.76">vagas. <tspan font-weight="700">Estrutural:</tspan> mudança tecnológica ou da organização produtiva elimina ocupações</tspan><tspan x="0.0" dy="9.76">(ex.: cobradores de ônibus, digitadores); exige requalificação.</tspan></text></svg>