<text x="61.48" y="26" font-size="13" fill="#1B2438" font-weight="700"><tspan font-weight="600" xml:space="preserve">Carga  q</tspan></text>
<text x="65.62" y="42" font-size="10.5" fill="#5B6578"><tspan xml:space="preserve">Q = ± n e</tspan></text>
