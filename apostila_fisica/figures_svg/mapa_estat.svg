<text x="56.84" y="134" font-size="13" fill="#1B2438" font-weight="700"><tspan font-weight="600" xml:space="preserve">Capacitor</tspan></text>
<text x="67.58" y="150" font-size="10.5" fill="#5B6578"><tspan xml:space="preserve">C = Q/U</tspan></text>
<line x1="172" y1="29" x2="244.2" y2="29" stroke="#1B2438" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="252,29 242,33 242,25" fill="#1B2438" stroke="#1B2438" stroke-width="0.6" stroke-linejoin="round"/>
<text x="190.51" y="20" font-size="11" fill="#1B2438" font-weight="600" class="halo"><tspan font-weight="600" xml:space="preserve">Coulomb</tspan></text>
<text x="182.38" y="47" font-size="10.5" fill="#5B6578" class="halo"><tspan xml:space="preserve">F = k|q₁q₂|/r²</tspan></text>
