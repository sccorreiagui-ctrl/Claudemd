<polygon points="508,29 498,33 498,25" fill="#1B2438" stroke="#1B2438" stroke-width="0.6" stroke-linejoin="round"/>
<text x="454.11" y="20" font-size="11" fill="#1B2438" font-weight="600" class="halo"><tspan font-weight="600" xml:space="preserve">F = qE</tspan></text>
<text x="448.85" y="47" font-size="10.5" fill="#5B6578" class="halo"><tspan xml:space="preserve">E = kQ/r²</tspan></text>
<line x1="596" y1="57" x2="596" y2="101.2" stroke="#1B2438" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="596,109 592,99 600,99" fill="#1B2438" stroke="#1B2438" stroke-width="0.6" stroke-linejoin="round"/>
<text x="490.32" y="78" font-size="11" fill="#1B2438" font-weight="600" class="halo"><tspan font-weight="600" xml:space="preserve">U = E·d  (E uniforme)</tspan></text>
<text x="464.99" y="92" font-size="10.5" fill="#5B6578" class="halo"><tspan xml:space="preserve">V = kQ/r  (carga puntiforme)</tspan></text>
