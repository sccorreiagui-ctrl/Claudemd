<text x="287.71" y="134" font-size="13" fill="#1B2438" font-weight="700"><tspan font-weight="600" xml:space="preserve">Trabalho e energia</tspan></text>
<text x="316.81" y="150" font-size="10.5" fill="#5B6578"><tspan xml:space="preserve">ΔE_c = q·U</tspan></text>
