<text x="450.36" y="128" font-size="11" fill="#1B2438" font-weight="600" class="halo"><tspan font-weight="600" xml:space="preserve">W = q·U</tspan></text>
<text x="448.06" y="155" font-size="10.5" fill="#5B6578" class="halo"><tspan xml:space="preserve">E_p = q·V</tspan></text>
<line x1="252" y1="137" x2="179.8" y2="137" stroke="#1B2438" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="172,137 182,133 182,141" fill="#1B2438" stroke="#1B2438" stroke-width="0.6" stroke-linejoin="round"/>
<text x="163.61" y="128" font-size="11" fill="#1B2438" font-weight="600" class="halo"><tspan font-weight="600" xml:space="preserve">energia armazenada</tspan></text>
<text x="190.46" y="155" font-size="10.5" fill="#5B6578" class="halo"><tspan xml:space="preserve">E = C·U²/2</tspan></text>
