<rect x="512" y="4" width="168" height="50" rx="9" fill="#DBF2F7" stroke="#0891B2" stroke-width="2.2"/>
<text x="570.09" y="26" font-size="13" fill="#1B2438" font-weight="700"><tspan font-weight="600" xml:space="preserve">Campo  E</tspan></text>
<text x="560.03" y="42" font-size="10.5" fill="#5B6578"><tspan xml:space="preserve">linhas de campo</tspan></text>
<rect x="512" y="112" width="168" height="50" rx="9" fill="#DBF2F7" stroke="#0891B2" stroke-width="2.2"/>
<text x="544.21" y="134" font-size="13" fill="#1B2438" font-weight="700"><tspan font-weight="600" xml:space="preserve">Potencial V, DDP U</tspan></text>
