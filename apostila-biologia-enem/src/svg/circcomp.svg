<svg viewBox="0 0 688 174"><defs><linearGradient id="grad-mix" x1="0" x2="1"><stop offset="0" stop-color="#8c1f35"/><stop offset="1" stop-color="#d83a3a"/></linearGradient></defs><g transform="translate(0 0)"><rect x="0" y="0" width="160" height="150" rx="8" class="f-w s-g sw1"/><text x="80" y="14" class="t10 c xb">Peixes</text><text x="80" y="26" class="t8 c g">2 cavidades</text><rect x="30.0" y="36" width="60.0" height="26" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><rect x="30.0" y="66" width="60.0" height="34" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><text x="80" y="116" class="t8 c b">circulação simples</text><text x="80" y="126" class="t8 c g">só sangue pobre em O₂ no coração</text><text x="80" y="136" class="t8 c g">→ brânquias → corpo</text></g><g transform="translate(176 0)"><rect x="0" y="0" width="160" height="150" rx="8" class="f-w s-g sw1"/><text x="80" y="14" class="t10 c xb">Anfíbios</text><text x="80" y="26" class="t8 c g">3 cavidades</text><rect x="32.0" y="36" width="26.0" height="26" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><rect x="62.0" y="36" width="26.0" height="26" rx="6" fill="#d83a3a" stroke="#1b2236" stroke-width="1.2"/><rect x="30.0" y="66" width="60.0" height="34" rx="6" fill="url(#grad-mix)" stroke="#1b2236" stroke-width="1.2"/><text x="80" y="116" class="t8 c b">dupla e incompleta</text><text x="80" y="126" class="t8 c g">mistura no ventrículo</text><text x="80" y="136" class="t8 c g">(pulmões e pele)</text></g><g transform="translate(352 0)"><rect x="0" y="0" width="160" height="150" rx="8" class="f-w s-g sw1"/><text x="80" y="14" class="t10 c xb">Répteis*</text><text x="80" y="26" class="t8 c g">3 + septo parcial</text><rect x="32.0" y="36" width="26.0" height="26" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><rect x="62.0" y="36" width="26.0" height="26" rx="6" fill="#d83a3a" stroke="#1b2236" stroke-width="1.2"/><rect x="32.0" y="66" width="26.0" height="34" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><rect x="62.0" y="66" width="26.0" height="34" rx="6" fill="#d83a3a" stroke="#1b2236" stroke-width="1.2"/><text x="80" y="116" class="t8 c b">dupla e incompleta</text><text x="80" y="126" class="t8 c g">mistura reduzida</text><text x="80" y="136" class="t8 c g">*crocodilianos: 4 cav.</text></g><g transform="translate(528 0)"><rect x="0" y="0" width="160" height="150" rx="8" class="f-w s-g sw1"/><text x="80" y="14" class="t10 c xb">Aves e mamíferos</text><text x="80" y="26" class="t8 c g">4 cavidades</text><rect x="32.0" y="36" width="26.0" height="26" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><rect x="62.0" y="36" width="26.0" height="26" rx="6" fill="#d83a3a" stroke="#1b2236" stroke-width="1.2"/><rect x="32.0" y="66" width="26.0" height="34" rx="6" fill="#8c1f35" stroke="#1b2236" stroke-width="1.2"/><rect x="62.0" y="66" width="26.0" height="34" rx="6" fill="#d83a3a" stroke="#1b2236" stroke-width="1.2"/><text x="80" y="116" class="t8 c b">dupla e completa</text><text x="80" y="126" class="t8 c g">sem mistura</text><text x="80" y="136" class="t8 c g">→ metabolismo alto</text></g><text x="0" y="168" class="t8 g">Cor: vinho = O₂ baixo · vermelho = O₂ alto · degradê = mistura. Em peixes, sangue oxigenado das brânquias segue direto aos tecidos, sem voltar ao coração.</text></svg>