<svg viewBox="0 0 690 238"><rect x="190" y="0" width="300" height="236" rx="14" class="l-az"/><text x="340" y="14" class="t9 c xb tx-az">ÁGUA DOCE (lagoas, riachos, represas)</text><rect x="0" y="92" width="196" height="62" rx="10" fill="#fff" stroke="#d83a3a" stroke-width="1.8"/><text x="26" y="133.0" class="t26 c em">🧍</text><text x="50" y="110" class="t9 xb" style="fill:#d83a3a">Humano (hosp. definitivo)</text><text x="50" y="122.0" class="t8">vermes adultos nas veias do</text><text x="50" y="132.5" class="t8">intestino/fígado: reprodução sexuada</text><rect x="250" y="34" width="196" height="50" rx="10" fill="#fff" stroke="#2f9e5a" stroke-width="1.8"/><text x="276" y="69.0" class="t26 c em">🥚</text><text x="300" y="52" class="t9 xb" style="fill:#2f9e5a">Ovos → miracídios</text><text x="300" y="64.0" class="t8">ovos saem nas fezes; eclodem na água;</text><text x="300" y="74.5" class="t8">larva ciliada nada</text><rect x="494" y="92" width="196" height="62" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="1.8"/><text x="520" y="133.0" class="t26 c em">🐌</text><text x="544" y="110" class="t9 xb" style="fill:#8a5a2b">Caramujo Biomphalaria</text><text x="544" y="122.0" class="t8">hosp. intermediário: o parasita se</text><text x="544" y="132.5" class="t8">multiplica assexuadamente</text><rect x="250" y="170" width="196" height="56" rx="10" fill="#fff" stroke="#7b43b8" stroke-width="1.8"/><text x="276" y="208.0" class="t26 c em">🏊</text><text x="300" y="188" class="t9 xb" style="fill:#7b43b8">Cercárias</text><text x="300" y="200.0" class="t8">larvas de cauda bifurcada saem do</text><text x="300" y="210.5" class="t8">caramujo e nadam</text><path d="M96 92 C120 60 200 56 248 56" class="nf s-ve sw3" marker-end="url(#ar-ve)"/><text x="116" y="62" class="t8 b tx-ve">① ovos</text><path d="M446 56 C500 56 560 70 590 90" class="nf s-ve sw3" marker-end="url(#ar-ve)"/><text x="510" y="58" class="t8 b tx-ve">② penetra no caramujo</text><path d="M590 156 C570 190 500 200 448 198" class="nf s-mr sw3" marker-end="url(#ar-mr)"/><text x="470" y="216" class="t8 b tx-mr">③ libera cercárias</text><path d="M250 200 C180 204 110 190 96 156" class="nf s-ro sw3" marker-end="url(#ar-ro)"/><text x="50" y="190" class="t8 b tx-ro">④ penetram a pele</text><text x="50" y="200" class="t8 g">ativamente (banho, lavagem)</text></svg>