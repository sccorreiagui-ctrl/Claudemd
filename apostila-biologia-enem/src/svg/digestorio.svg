ss="t8">HCl (células parietais; pH ≈ 2)</text><text x="490" y="145" class="t8">pepsinogênio → pepsina:</text><text x="490" y="156" class="t8">proteínas → peptídeos · quimo</text><path d="M484 128 L412 176" class="nf s-g sw1"/><circle cx="412" cy="176" r="2.6" fill="#b5503a"/><rect x="484" y="196" width="206" height="51" rx="5" fill="#fff" stroke="#a8842d" stroke-width="1.2"/><text x="490" y="208" class="t9 xb" style="fill:#a8842d">PÂNCREAS (exócrino)</text><text x="490" y="220" class="t8">suco pancreático: HCO₃⁻ (pH ≈ 8),</text><text x="490" y="231" class="t8">amilase, tripsina, quimotripsina,</text><text x="490" y="242" class="t8">lipase, nucleases</text><path d="M484 214 L440 210" class="nf s-g sw1"/><circle cx="440" cy="210" r="2.6" fill="#a8842d"/><rect x="484" y="278" width="206" height="62" rx="5" fill="#fff" stroke="#a8742d" stroke-width="1.2"/><text x="490" y="290" class="t9 xb" style="fill:#a8742d">INTESTINO DELGADO</text><text x="490" y="302" class="t8">suco entérico: maltase, sacarase,</text><text x="490" y="313" class="t8">lactase, peptidases · quilo</text><text x="490" y="324" class="t8">absorção: vilosidades e</text><text x="490" y="335" class="t8">microvilosidades</text><path d="M484 296 L396 284" class="nf s-g sw1"/><circle cx="396" cy="284" r="2.6" fill="#a8742d"/></svg>