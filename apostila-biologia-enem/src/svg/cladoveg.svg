<svg viewBox="0 0 690 190"><path d="M16 138 H640" class="nf s-ve sw4 rc"/><path d="M190 138 V84" class="nf s-ve sw3"/><circle cx="190" cy="78" r="7" class="f-ve"/><text x="190" y="14" class="t10 c xb tx-ve">Briófitas</text><text x="190" y="25" class="t8 c g">musgos</text><text x="190" y="40" class="t8 c" style="font-size:8px">sem vasos</text><text x="190" y="51" class="t8 c" style="font-size:8px">gametófito dominante</text><text x="190" y="62" class="t8 c" style="font-size:8px">água na fecundação</text><path d="M316 138 V84" class="nf s-ve sw3"/><circle cx="316" cy="78" r="7" class="f-ve"/><text x="316" y="14" class="t10 c xb tx-ve">Pteridófitas</text><text x="316" y="25" class="t8 c g">samambaias</text><text x="316" y="40" class="t8 c" style="font-size:8px">com vasos</text><text x="316" y="51" class="t8 c" style="font-size:8px">esporófito dominante</text><text x="316" y="62" class="t8 c" style="font-size:8px">sem sementes</text><path d="M442 138 V84" class="nf s-ve sw3"/><circle cx="442" cy="78" r="7" class="f-ve"/><text x="442" y="14" class="t10 c xb tx-ve">Gimnospermas</text><text x="442" y="25" class="t8 c g">pinheiros, araucária</text><text x="442" y="40" class="t8 c" style="font-size:8px">semente nua (pinhão)</text><text x="442" y="51" class="t8 c" style="font-size:8px">cones; grão de pólen</text><text x="442" y="62" class="t8 c" style="font-size:8px">sem flor e sem fruto</text><path d="M568 138 V84" class="nf s-ve sw3"/><circle cx="568" cy="78" r="7" class="f-ve"/><text x="568" y="14" class="t10 c xb tx-ve">Angiospermas</text><text x="568" y="25" class="t8 c g">a maioria das plantas</text><text x="568" y="40" class="t8 c" style="font-size:8px">flor, fruto e semente</text><text x="568" y="51" class="t8 c" style="font-size:8px">dupla fecundação</text><text x="568" y="62" class="t8 c" style="font-size:8px">endosperma</text><circle cx="128" cy="138" r="7" class="f-la"/><text x="128" y="141" class="t8 c b w">★</text><text x="128" y="158" class="t8 c xb tx-la">embrião protegido</text><text x="128" y="169" class="t8 c g" style="font-size:7.6px">+ cutícula (terra firme)</text><circle cx="253" cy="138" r="7" class="f-la"/><text x="253" y="141" class="t8 c b w">★</text><text x="253" y="158" class="t8 c xb tx-la">vasos condutores</text><text x="253" y="169" class="t8 c g" style="font-size:7.6px">xilema e floema; lignina</text><circle cx="379" cy="138" r="7" class="f-la"/><text x="379" y="141" class="t8 c b w">★</text><text x="379" y="158" class="t8 c xb tx-la">semente</text><text x="379" y="169" class="t8 c g" style="font-size:7.6px">pólen: fecundação sem água</text><circle cx="505" cy="138" r="7" class="f-la"/><text x="505" y="141" class="t8 c b w">★</text><text x="505" y="158" class="t8 c xb tx-la">flor e fruto</text><text x="505" y="169" class="t8 c g" style="font-size:7.6px">polinizadores; dispersão</text><text x="4" y="128" class="t8 b tx-ve">algas verdes</text><text x="4" y="119" class="t7 g" style="display:none"></text><text x="4" y="182" class="t8 g">★ = inovação evolutiva (conquista do ambiente terrestre)</text></svg>