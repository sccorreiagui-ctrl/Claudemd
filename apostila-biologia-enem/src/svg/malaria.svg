<svg viewBox="0 0 690 344"><rect x="350" y="0" width="340" height="318" rx="10" class="l-vm" opacity=".55"/><text x="520" y="16" class="t11 c xb tx-vm">HOSPEDEIRO HUMANO</text><text x="520" y="28" class="t8 c g">fase assexuada (multiplicação por divisão)</text><rect x="362" y="40" width="316" height="46" rx="8" fill="#fff" stroke="#d83a3a" stroke-width="1.8"/><circle cx="376" cy="63.0" r="10" fill="#d83a3a"/><text x="376" y="66.5" class="t10 c b w">1</text><text x="394" y="56" class="t9 xb" style="fill:#d83a3a">Picada: esporozoítos no sangue</text><text x="394" y="68" class="t8">vão rapidamente ao fígado</text><path d="M520 86 V95" class="nf s-vm sw2" marker-end="url(#ar-vm)"/><rect x="362" y="96" width="316" height="46" rx="8" fill="#fff" stroke="#d83a3a" stroke-width="1.8"/><circle cx="376" cy="119.0" r="10" fill="#d83a3a"/><text x="376" y="122.5" class="t10 c b w">2</text><text x="394" y="112" class="t9 xb" style="fill:#d83a3a">Fígado (hepatócitos)</text><text x="394" y="124" class="t8">esquizogonia: multiplicação assexuada → merozoítos</text><path d="M520 142 V151" class="nf s-vm sw2" marker-end="url(#ar-vm)"/><rect x="362" y="152" width="316" height="46" rx="8" fill="#fff" stroke="#d83a3a" stroke-width="1.8"/><circle cx="376" cy="175.0" r="10" fill="#d83a3a"/><text x="376" y="178.5" class="t10 c b w">3</text><text x="394" y="168" class="t9 xb" style="fill:#d83a3a">Merozoítos invadem hemácias</text><text x="394" y="180" class="t8">crescimento: trofozoíto → esquizonte</text><path d="M520 198 V207" class="nf s-vm sw2" marker-end="url(#ar-vm)"/><rect x="362" y="208" width="316" height="46" rx="8" fill="#fff" stroke="#d83a3a" stroke-width="1.8"/><circle cx="376" cy="231.0" r="10" fill="#d83a3a"/><text x="376" y="234.5" class="t10 c b w">4</text><text x="394" y="224" class="t9 xb" style="fill:#d83a3a">Ruptura sincrônica das hemácias</text><text x="394" y="236" class="t8">libera merozoítos e toxinas: FEBRE periódica, anemia</text><path d="M520 254 V263" class="nf s-vm sw2" marker-end="url(#ar-vm)"/><rect x="362" y="264" width="316" height="46" rx="8" fill="#fff" stroke="#d83a3a" stroke-width="1.8"/><circle cx="376" cy="287.0" r="10" fill="#d83a3a"/><text x="376" y="290.5" class="t10 c b w">5</text><text x="394" y="280" class="t9 xb" style="fill:#d83a3a">Alguns viram gametócitos</text><text x="394" y="292" class="t8">formas sexuadas, infectantes para o mosquito</text><rect x="0" y="0" width="340" height="318" rx="10" class="l-sl" opacity=".7"/><text x="170" y="16" class="t11 c xb tx-sl">MOSQUITO <tspan style="font-style:italic">Anopheles</tspan> (fêmea)</text><text x="170" y="28" class="t8 c g">hospedeiro definitivo: fase sexuada</text><rect x="10" y="236" width="316" height="46" rx="8" fill="#fff" stroke="#475a73" stroke-width="1.8"/><circle cx="24" cy="259.0" r="10" fill="#475a73"/><text x="24" y="262.5" class="t10 c b w">6</text><text x="42" y="252" class="t9 xb" style="fill:#475a73">Ingere gametócitos</text><text x="42" y="264" class="t8">ao picar uma pessoa infectada</text><rect x="10" y="164" width="316" height="46" rx="8" fill="#fff" stroke="#475a73" stroke-width="1.8"/><circle cx="24" cy="187.0" r="10" fill="#475a73"/><text x="24" y="190.5" class="t10 c b w">7</text><text x="42" y="180" class="t9 xb" style="fill:#475a73">Fecundação no intestino</text><text x="42" y="192" class="t8">gametas → zigoto → oocisto</text><rect x="10" y="92" width="316" height="46" rx="8" fill="#fff" stroke="#475a73" stroke-width="1.8"/><circle cx="24" cy="115.0" r="10" fill="#475a73"/><text x="24" y="118.5" class="t10 c b w">8</text><text x="42" y="108" class="t9 xb" style="fill:#475a73">Esporozoítos nas glândulas salivares</text><text x="42" y="120" class="t8">prontos para infectar o próximo humano</text><path d="M170 236 V220" class="nf s-sl sw2" marker-end="url(#ar-sl)"/><path d="M170 164 V148" class="nf s-sl sw2" marker-end="url(#ar-sl)"/><path d="M520 310 V326 H170 V284" class="nf s-vm sw3" marker-end="url(#ar-vm)"/><text x="344" y="338" class="t8 c b tx-vm">mosquito pica pessoa com gametócitos</text><path d="M170 92 V50 H350 C356 50 360 56 362 62" class="nf s-sl sw3" marker-end="url(#ar-sl)" style="display:none"/><path d="M170 92 V46 H358" class="nf s-sl sw3" marker-end="url(#ar-sl)"/><text x="260" y="40" class="t8 c b tx-sl">picada transmite esporozoítos</text></svg>