<svg viewBox="0 0 690 262"><text x="0" y="12" class="t10 xb tx-ro">1. Reconhecimento</text><path d="M6 70 H330" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M6 82 H330" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><rect x="96" y="63" width="118" height="22" rx="4" fill="none" stroke="#d4287c" stroke-width="2"/><text x="155" y="100" class="t8 c b tx-rs">sequência-alvo (≈ 20 nt)</text><rect x="218" y="63" width="34" height="22" rx="4" class="l-am s-am sw2"/><text x="235" y="100" class="t8 c b tx-am">PAM</text><text x="235" y="110" class="t7 c g">(NGG)</text><path d="M98 54 H214" stroke="#d4287c" stroke-width="4" fill="none"/><text x="156" y="46" class="t8 c b tx-rs">RNA-guia (complementar ao alvo)</text><ellipse cx="156" cy="72" rx="88" ry="38" class="nf s-sl sw2 dsh"/><text x="156" y="128" class="t9 c xb tx-sl">Cas9 (nuclease) + RNA-guia</text><text x="0" y="150" class="t8 g">O RNA-guia leva a Cas9 até a sequência complementar; o PAM adjacente é exigido.</text><g transform="translate(0 168)"><text x="0" y="0" class="t10 xb tx-ro">2. Corte nas duas fitas (quebra de fita dupla)</text><path d="M6 22 H150" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M176 22 H330" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M6 34 H144" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M182 34 H330" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><text x="163" y="42" class="t14 c em">✂️</text><text x="163" y="68" class="t8 c b tx-vm">Cas9 corta a dupla-hélice</text></g><g transform="translate(360 0)"><text x="0" y="12" class="t10 xb tx-ro">3. A célula repara — e é aí que se edita</text><rect x="0" y="22" width="330" height="112" rx="8" class="l-vm s-vm sw1"/><text x="10" y="40" class="t9 xb tx-vm">a) Reparo sem molde (junção de extremidades)</text><path d="M10 56 H150" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M174 56 H320" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M10 68 H144" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M180 68 H320" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><rect x="146" y="50" width="34" height="22" rx="3" fill="#fff" stroke="#d83a3a" stroke-width="1.6" stroke-dasharray="3 2"/><text x="163" y="64" class="t9 c b tx-vm">indel</text><text x="10" y="100" class="t8">Erros → pequenas inserções ou deleções → <tspan class="b tx-vm">gene inativado (knock-out)</tspan></text><text x="10" y="112" class="t8 g">útil para “desligar” um gene</text><rect x="0" y="142" width="330" height="112" rx="8" class="l-ve s-ve sw1"/><text x="10" y="160" class="t9 xb tx-ve">b) Reparo com molde de DNA fornecido</text><path d="M10 176 H320" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M10 188 H320" stroke="#7b43b8" stroke-width="4.5" fill="none" stroke-linecap="round"/><rect x="140" y="170" width="46" height="22" rx="3" class="f-ve"/><text x="163" y="184" class="t8 c b w">novo trecho</text><text x="10" y="218" class="t8">Correção de uma mutação ou inserção de gene (<tspan class="b tx-ve">edição precisa</tspan>)</text><text x="10" y="230" class="t8 g">Ex.: terapia para anemia falciforme (p. 26)</text></g></svg>