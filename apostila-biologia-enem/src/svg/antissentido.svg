<svg viewBox="0 0 335 188"><text x="0" y="12" class="t9 xb tx-sl">Sem RNA antissentido</text><path d="M6 40 H320" stroke="#7b43b8" stroke-width="4.5" fill="none"/><text x="6" y="30" class="t8 b tx-ro">mRNA da poligalacturonase</text><ellipse cx="200" cy="30" rx="26" ry="8" class="f-sl"/><ellipse cx="200" cy="50" rx="18" ry="7" class="f-sl"/><text x="232" y="34" class="t8 b tx-sl">ribossomo</text><path d="M200 60 V68" class="nf s-la sw2" marker-end="url(#ar-la)"/><text x="6" y="78" class="t8 b tx-la">proteína (enzima) degrada a pectina da parede</text><text x="6" y="88" class="t8 b tx-la">→ fruto amolece e estraga</text><text x="0" y="102" class="t9 xb tx-rs">Com RNA antissentido (transgene invertido)</text><path d="M6 128 H320" stroke="#7b43b8" stroke-width="4.5" fill="none"/><path d="M6 138 H320" stroke="#d4287c" stroke-width="4.5" fill="none"/><text x="6" y="118" class="t8 b tx-ro">mRNA</text><text x="190" y="156" class="t8 b tx-rs">RNA antissentido (complementar)</text><text x="6" y="156" class="t8 b tx-ro">dupla fita de RNA</text><ellipse cx="200" cy="118" rx="26" ry="8" class="f-sl" opacity=".5"/><text x="258" y="106" class="t14 b tx-vm">✕</text><text x="244" y="118" class="t8 b tx-vm" style="display:none"></text><text x="6" y="176" class="t8 b tx-ve">tradução bloqueada → pouca enzima → fruto firme por mais tempo</text></svg>