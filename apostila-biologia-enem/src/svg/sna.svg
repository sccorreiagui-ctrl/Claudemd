<svg viewBox="0 0 690 332"><rect x="0" y="0" width="690" height="38" rx="8" fill="#fff" stroke="#98a2b6" stroke-width="1" style="display:none"/><rect x="190" y="0" width="236" height="44" rx="8" fill="#d4287c"/><text x="308" y="17" class="t11 c xb w">SIMPÁTICO</text><text x="308" y="32" class="t8 c w">“luta ou fuga” · noradrenalina e adrenalina</text><rect x="436" y="0" width="254" height="44" rx="8" fill="#475a73"/><text x="563" y="17" class="t11 c xb w">PARASSIMPÁTICO</text><text x="563" y="32" class="t8 c w">“repouso e digestão” · acetilcolina</text><rect x="0" y="52" width="690" height="30" fill="#f8f9fc"/><text x="22" y="74" class="t16 c em">👁️</text><text x="44" y="71" class="t10 xb">Pupila</text><text x="196" y="71" class="t9" style="fill:#86144f">dilata (midríase)</text><text x="442" y="71" class="t9" style="fill:#2c3b50">contrai (miose)</text><rect x="0" y="84" width="690" height="30" fill="#fff"/><text x="22" y="106" class="t16 c em">🫀</text><text x="44" y="103" class="t10 xb">Coração</text><text x="196" y="103" class="t9" style="fill:#86144f">↑ frequência e força (taquicardia)</text><text x="442" y="103" class="t9" style="fill:#2c3b50">↓ frequência (bradicardia)</text><rect x="0" y="116" width="690" height="30" fill="#f8f9fc"/><text x="22" y="138" class="t16 c em">🫁</text><text x="44" y="135" class="t10 xb">Brônquios</text><text x="196" y="135" class="t9" style="fill:#86144f">dilatam (mais ar)</text><text x="442" y="135" class="t9" style="fill:#2c3b50">contraem</text><rect x="0" y="148" width="690" height="30" fill="#fff"/><text x="22" y="170" class="t16 c em">🍽️</text><text x="44" y="167" class="t10 xb">Tubo digestório</text><text x="196" y="167" class="t9" style="fill:#86144f">↓ peristaltismo e secreções</text><text x="442" y="167" class="t9" style="fill:#2c3b50">↑ peristaltismo e secreções</text><rect x="0" y="180" width="690" height="30" fill="#f8f9fc"/><text x="22" y="202" class="t16 c em">💧</text><text x="44" y="199" class="t10 xb">Glândulas salivares</text><text x="196" y="199" class="t9" style="fill:#86144f">pouca saliva (boca seca)</text><text x="442" y="199" class="t9" style="fill:#2c3b50">muita saliva</text><rect x="0" y="212" width="690" height="30" fill="#fff"/><text x="22" y="234" class="t16 c em">🩸</text><text x="44" y="231" class="t10 xb">Fígado e glicose</text><text x="196" y="231" class="t9" style="fill:#86144f">glicogenólise: ↑ glicemia</text><text x="442" y="231" class="t9" style="fill:#2c3b50">armazena glicogênio</text><rect x="0" y="244" width="690" height="30" fill="#f8f9fc"/><text x="22" y="266" class="t16 c em">🚽</text><text x="44" y="263" class="t10 xb">Bexiga</text><text x="196" y="263" class="t9" style="fill:#86144f">relaxa (retém urina)</text><text x="442" y="263" class="t9" style="fill:#2c3b50">contrai (micção)</text><rect x="0" y="276" width="690" height="30" fill="#fff"/><text x="22" y="298" class="t16 c em">🔴</text><text x="44" y="295" class="t10 xb">Vasos da pele e vísceras</text><text x="196" y="295" class="t9" style="fill:#86144f">vasoconstrição (sangue ao músculo)</text><text x="442" y="295" class="t9" style="fill:#2c3b50">pouca ação direta</text><line x1="186" y1="44" x2="186" y2="308" class="nf s-g sw1"/><line x1="432" y1="44" x2="432" y2="308" class="nf s-g sw1"/><text x="0" y="324" class="t8 g">Anatomia: simpático = gânglios perto da medula (fibras pré curtas, pós longas); parassimpático = gânglios perto dos órgãos (nervo vago).</text></svg>