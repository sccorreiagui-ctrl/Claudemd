<svg viewBox="0 0 690 342"><rect x="0" y="0" width="480" height="140" rx="8" fill="#fbeedd"/><rect x="0" y="140" width="480" height="200" rx="8" fill="#f6d6c2"/><text x="8" y="14" class="t9 xb" style="fill:#a8603f">CÓRTEX RENAL</text><text x="8" y="330" class="t9 xb" style="fill:#8a4a2a">MEDULA RENAL (↑ osmolaridade para baixo)</text><defs><linearGradient id="osm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d6c2" stop-opacity="0"/><stop offset="1" stop-color="#c8896a" stop-opacity=".55"/></linearGradient></defs><rect x="0" y="140" width="480" height="200" rx="8" fill="url(#osm)"/><path d="M120 60 C150 70 160 90 150 120 M170 56 C200 76 210 110 200 134 M300 96 C320 110 324 132 316 150" class="nf s-v2 sw1 dt" style="display:none"/><path d="M20 56 H60" stroke="#d83a3a" stroke-width="7" fill="none" stroke-linecap="round"/><text x="4" y="40" class="t8 b tx-vm">arteríola aferente</text><path d="M96 100 C96 118 70 130 30 130" stroke="#d83a3a" stroke-width="4" fill="none"/><text x="8" y="146" class="t8 b tx-vm">arteríola eferente</text><circle cx="82" cy="72" r="30" fill="#fff" stroke="#475a73" stroke-width="2.4"/><path d="M62 70 q8 -14 16 0 t14 0 t10 6 M66 82 q8 -12 14 0 t12 -2" stroke="#d83a3a" stroke-width="3" fill="none"/><text x="82" y="116" class="t8 c b" style="fill:#2c3b50">corpúsculo renal</text><text x="82" y="126" class="t8 c" style="fill:#5a6479">(glomérulo + cápsula)</text><path d="M112 72 C130 56 150 56 156 72 C162 88 144 96 134 84 C124 72 148 66 168 80 C188 94 196 70 214 66" fill="none" stroke="#1f78c8" stroke-width="9" stroke-linecap="round"/><text x="196" y="40" class="t9 c xb tx-az">túbulo contorcido</text><text x="196" y="51" class="t9 c xb tx-az">proximal</text><path d="M222 70 H246 V250 C246 276 280 276 280 250 V92" fill="none" stroke="#475a73" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 92 V250 C246 276 280 276 280 250" fill="none" stroke="#98a2b6" stroke-width="3" style="display:none"/><text x="226" y="296" class="t9 c xb" style="fill:#2c3b50">alça de Henle</text><path d="M280 92 C290 80 306 80 312 94 C318 108 300 112 296 100 C292 88 324 84 346 92 C362 98 372 84 392 82" fill="none" stroke="#2f9e5a" stroke-width="9" stroke-linecap="round"/><text x="340" y="134" class="t9 c xb tx-ve">túbulo contorcido</text><text x="340" y="145" class="t9 c xb tx-ve">distal</text><path d="M404 82 H420 V300" fill="none" stroke="#d19a00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="436" y="190" class="t9 xb tx-am">ducto</text><text x="436" y="201" class="t9 xb tx-am">coletor</text><path d="M420 304 V328" class="nf s-am sw3" marker-end="url(#ar-am)"/><text x="428" y="326" class="t8 b tx-am">urina → pelve renal</text><path d="M60 58 H50" stroke="#1f78c8" stroke-width="3" style="display:none"/><circle cx="116" cy="46" r="9" fill="#1f78c8"/><text x="116" y="49.5" class="t10 c b w">F</text><path d="M82 50 V56" class="nf s-az sw2" style="display:none"/><path d="M140 100 L128 140" class="nf s-ve sw2" marker-end="url(#ar-ve)" style="display:none"/><circle cx="176" cy="98" r="9" fill="#2f9e5a"/><text x="176" y="101.5" class="t10 c b w">R</text><circle cx="262" cy="170" r="9" fill="#2f9e5a"/><text x="262" y="173.5" class="t10 c b w">R</text><circle cx="304" cy="70" r="9" fill="#d83a3a"/><text x="304" y="73.5" class="t10 c b w">S</text><circle cx="328" cy="70" r="9" fill="#2f9e5a"/><text x="328" y="73.5" class="t10 c b w">R</text><circle cx="446" cy="150" r="9" fill="#2f9e5a"/><text x="446" y="153.5" class="t10 c b w">R</text><path d="M170 92 L176 112" class="nf s-ve sw2" marker-end="url(#ar-ve)" style="display:none"/><g transform="translate(496 0)"><circle cx="10" cy="14" r="9" fill="#1f78c8"/><text x="10" y="17.5" class="t10 c b w">F</text><text x="26" y="18" class="t10 xb" style="fill:#1f78c8">FILTRAÇÃO</text><text x="0" y="34.0" class="t8">no glomérulo: pressão empurra</text><text x="0" y="44.5" class="t8">água, íons, glicose, ureia e</text><text x="0" y="55.0" class="t8">aminoácidos para a cápsula.</text><text x="0" y="65.5" class="t8">Células e proteínas grandes ficam</text><text x="0" y="76.0" class="t8">no sangue.</text><circle cx="10" cy="102.5" r="9" fill="#2f9e5a"/><text x="10" y="106.0" class="t10 c b w">R</text><text x="26" y="106.5" class="t10 xb" style="fill:#2f9e5a">REABSORÇÃO</text><text x="0" y="122.5" class="t8">TCP: ~100% da glicose e</text><text x="0" y="133.0" class="t8">aminoácidos, grande parte da água</text><text x="0" y="143.5" class="t8">e do Na⁺. Alça: concentra a</text><text x="0" y="154.0" class="t8">medula. Coletor: água sob ADH.</text><circle cx="10" cy="180.5" r="9" fill="#d83a3a"/><text x="10" y="184.0" class="t10 c b w">S</text><text x="26" y="184.5" class="t10 xb" style="fill:#d83a3a">SECREÇÃO</text><text x="0" y="200.5" class="t8">TCD: H⁺, K⁺, amônio e alguns</text><text x="0" y="211.0" class="t8">fármacos passam do sangue ao</text><text x="0" y="221.5" class="t8">túbulo.</text><rect x="0" y="248.0" width="190" height="66" rx="6" class="l-sl"/><text x="8" y="262.0" class="t8 xb tx-sl">Urina = filtração − reabsorção + secreção</text><text x="8" y="276.0" class="t8">Sem ADH: urina volumosa e diluída.</text><text x="8" y="287.0" class="t8">Com ADH: reabsorve água → pouca</text><text x="8" y="298.0" class="t8">urina, concentrada.</text></g></svg>