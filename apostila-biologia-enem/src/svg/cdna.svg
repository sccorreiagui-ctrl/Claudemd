<svg viewBox="0 0 690 156"><text x="0" y="12" class="t9 xb tx-ro">1. Primeira fita: transcriptase reversa (molde = mRNA)</text><circle cx="34" cy="38" r="6" class="f-rs"/><path d="M40 38 H430" class="nf s-ro sw4"/><text x="436" y="42" class="t10 xb tx-ro">AAAA</text><text x="60" y="28" class="t8 b tx-ro">mRNA maduro (só éxons)</text><path d="M430 48 H330" stroke="#c9a6f0" stroke-width="4" fill="none"/><path d="M430 54 H40" stroke="#c9a6f0" stroke-width="4" fill="none" stroke-dasharray="1 0" style="display:none"/><path d="M424 52 H60" stroke="#c9a6f0" stroke-width="4" fill="none" marker-end="url(#ar-ro)"/><text x="430" y="70" class="t8 b tx-rs">primer oligo-dT (TTTT)</text><text x="62" y="68" class="t8 b tx-ro">cDNA fita simples (complementar ao mRNA)</text><text x="560" y="40" class="t8 b tx-ro">Transcriptase reversa:</text><text x="560" y="51" class="t8 g">enzima de retrovírus (HIV)</text><text x="560" y="62" class="t8 g">RNA → DNA</text><text x="0" y="96" class="t9 xb tx-ro">2. Degrada-se o mRNA e DNA polimerase faz a segunda fita</text><path d="M60 114 H430" stroke="#c9a6f0" stroke-width="4" fill="none"/><path d="M60 124 H430" stroke="#7b43b8" stroke-width="4" fill="none"/><text x="436" y="120" class="t9 xb tx-ro">cDNA dupla-fita</text><text x="436" y="131" class="t8 g">sem íntrons · pronto para clonar no plasmídio</text><text x="0" y="148" class="t8 g">Para a clonagem do gene, o cDNA entra no plasmídio com enzimas de restrição e ligase (p. 24). A PCR pode amplificá-lo depois.</text></svg>